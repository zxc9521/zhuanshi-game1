<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>转世之修仙系统</title>
<style>
:root{
  --bg:#090b12;--panel:#121826;--panel2:#182033;--panel3:#101725;--line:#26324d;
  --text:#d9e6ff;--muted:#8fa3c8;--gold:#ffd36a;--red:#ff6b6b;
  --green:#7dff9e;--cyan:#77e6ff;--purple:#d997ff;--orange:#ffb86c;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    linear-gradient(rgba(7,9,17,.72),rgba(7,9,17,.86)),
    url("assets/images/ui/main_background.webp") center top/cover fixed no-repeat;
  color:var(--text);
  font-family:"Microsoft YaHei",system-ui,sans-serif;
}color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif}
button,input,select{font:inherit}
button{
  cursor:pointer;
  border:1px solid rgba(255,211,106,.28);
  background:
    linear-gradient(rgba(28,39,64,.70),rgba(28,39,64,.88)),
    url("assets/images/ui/button_normal.webp") center/100% 100% no-repeat;
  color:var(--text);
  border-radius:8px;
  padding:7px 10px;
  margin:2px;
  box-shadow:inset 0 0 10px rgba(119,230,255,.04);
}border:1px solid #405073;background:#1c2740;color:var(--text);border-radius:8px;padding:7px 10px;margin:2px}
button:hover{
  background:
    linear-gradient(rgba(40,55,90,.78),rgba(40,55,90,.92)),
    url("assets/images/ui/button_hover.webp") center/100% 100% no-repeat;
}
button:disabled{
  opacity:.45;
  cursor:not-allowed;
  background:
    linear-gradient(rgba(40,40,48,.72),rgba(25,25,32,.88)),
    url("assets/images/ui/button_disabled.webp") center/100% 100% no-repeat;
}
input,select{background:#101827;color:var(--text);border:1px solid #405073;border-radius:7px;padding:6px}
.app{max-width:1480px;margin:auto;padding:12px}
.top{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  padding:12px;
  background:
    linear-gradient(rgba(16,24,39,.78),rgba(16,24,39,.88)),
    url("assets/images/ui/top_bar.webp") center/cover no-repeat;
  border:1px solid rgba(255,211,106,.28);
  border-radius:14px;
  box-shadow:0 8px 28px rgba(0,0,0,.28), inset 0 0 18px rgba(119,230,255,.05);
}
.title{font-size:24px;font-weight:800;color:var(--gold)}
.notice{font-size:13px;color:var(--cyan);line-height:1.5}
.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#24314f;border:1px solid #405073;margin:2px;color:#dce8ff}
.warn{color:var(--orange)}
.grid{display:grid;grid-template-columns:210px 1fr;gap:12px;margin-top:12px}
.nav{
  background:
    linear-gradient(rgba(18,24,38,.86),rgba(18,24,38,.94)),
    url("assets/images/ui/nav_background.webp") center/cover no-repeat;
  border:1px solid rgba(255,211,106,.24);
  border-radius:14px;
  padding:8px;
  position:sticky;
  top:8px;
  height:max-content;
  box-shadow:0 10px 28px rgba(0,0,0,.22);
}border:1px solid var(--line);border-radius:14px;padding:8px;position:sticky;top:8px;height:max-content}
.nav button{display:block;width:100%;margin:5px 0;text-align:left}
.nav button.active{background:#31446f;border-color:#6b85c8;color:#fff}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.subnav button.active{background:#40588e;border-color:#7f9fea}
.main{min-height:720px}
.panel{
  background:
    linear-gradient(rgba(18,24,38,.88),rgba(18,24,38,.94)),
    url("assets/images/ui/panel_bg.webp") center/cover repeat;
  border:1px solid rgba(255,211,106,.20);
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 10px 28px rgba(0,0,0,.28), inset 0 0 18px rgba(119,230,255,.04);
}border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.card{
  background:
    linear-gradient(rgba(24,32,51,.88),rgba(24,32,51,.94)),
    url("assets/images/ui/card_bg.webp") center/cover repeat;
  border:1px solid rgba(119,230,255,.14);
  border-radius:12px;
  padding:10px;
  box-shadow:inset 0 0 14px rgba(119,230,255,.035);
}border:1px solid var(--line);border-radius:12px;padding:10px}
h2,h3{margin:0 0 10px;color:#fff}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;font-size:14px}
.log{height:310px;overflow:auto;background:#080c14;border:1px solid #25314c;border-radius:10px;padding:8px;font-size:13px;line-height:1.65}
.small-log{height:220px;overflow:auto;background:#080c14;border:1px solid #25314c;border-radius:10px;padding:8px;font-size:13px;line-height:1.65}
.log .crit{color:var(--gold)}.log .bad{color:var(--red)}.log .good{color:var(--green)}.log .blue{color:var(--cyan)}
.list{max-height:430px;overflow:auto}
.item{padding:8px;border:1px solid #2b3858;border-radius:10px;background:#11192a;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{float:right}
.muted{color:var(--muted)}
.gold{color:var(--gold)}.red{color:var(--red)}.green{color:var(--green)}.cyan{color:var(--cyan)}.purple{color:var(--purple)}
.q0{color:#9aa6b2}.q1{color:#e8e8e8}.q2{color:#74ff92}.q3{color:#6bb9ff}.q4{color:#c47cff}.q5{color:#ffbc52}.q6{color:#ff6df2}
.bar{height:12px;background:#0a0f1b;border:1px solid #293653;border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#51d27a,#ffd36a)}
.hpbar>span{background:linear-gradient(90deg,#ff5353,#ffb86c)}
.map-hero{
  position:relative;
  overflow:hidden;
  border-radius:14px;
  border:1px solid var(--line);
  margin-bottom:12px;
  min-height:360px;
  background:#0b101b;
}
.map-bg-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.55;
  filter:saturate(.95) contrast(1.08);
  transform:scale(1.02);
  z-index:0;
}
.map-hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at center,rgba(9,11,18,.08),rgba(9,11,18,.08) 70%),
    linear-gradient(180deg,rgba(9,11,18,.22),rgba(9,11,18,.68));
}
.map-hero-content{
  position:relative;
  z-index:1;
  padding:12px;
}
.map-hero .card{
  background:rgba(18,32,51,.68);
  border:1px solid rgba(119,230,255,.22);
  backdrop-filter:blur(6px);
  box-shadow:0 8px 24px rgba(0,0,0,.22);
}

.map-hero .card:hover{
  background:rgba(24,40,65,.78);
  border-color:rgba(119,230,255,.36);
}
.map-title-line{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.map-name{
  font-size:22px;
  font-weight:800;
  color:var(--gold);
  text-shadow:0 2px 8px rgba(0,0,0,.55);
}
.map-subtitle{
  color:var(--cyan);
  font-size:13px;
}
.monster-art{
  width:100%;
  max-height:260px;
  object-fit:contain;
  display:block;
  margin:6px auto 10px;
  background:radial-gradient(circle at center,rgba(119,230,255,.08),rgba(0,0,0,0));
  border-radius:12px;
}
.monster-art-missing{
  height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px dashed #405073;
  border-radius:12px;
  color:var(--muted);
  background:#0b101b;
  margin:6px 0 10px;
}
.battle-scene{
  position:relative;
  height:220px;
  margin-top:10px;
  border:1px solid rgba(119,230,255,.22);
  border-radius:12px;
  overflow:hidden;
  background:#080c14;
  box-shadow:inset 0 0 28px rgba(0,0,0,.45);
}

.battle-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.82;
  filter:saturate(.92) contrast(1.05);
}

.battle-vignette{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at center,rgba(0,0,0,0),rgba(0,0,0,.55) 80%),
    linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.45));
  pointer-events:none;
}

.battle-unit{
  position:absolute;
  bottom:16px;
  width:34%;
  height:72%;
  object-fit:contain;
  filter:drop-shadow(0 10px 12px rgba(0,0,0,.55));
  z-index:2;
}

.battle-player{
  left:4%;
}

.battle-monster{
  right:4%;
  transform:scaleX(-1);
}
.battle-monster-dead{
  position:absolute;
  right:4%;
  bottom:16px;
  width:34%;
  height:72%;
  object-fit:contain;
  z-index:3;
  filter:drop-shadow(0 10px 12px rgba(0,0,0,.55));
  transform-origin:70% 90%;
  animation:monsterDeathFall .9s ease-out forwards;
  pointer-events:none;
}

@keyframes monsterDeathFall{
  0%{
    opacity:1;
    transform:scaleX(-1) rotate(0deg) translateY(0) scale(1);
    filter:drop-shadow(0 10px 12px rgba(0,0,0,.55)) brightness(1);
  }
  45%{
    opacity:.78;
    transform:scaleX(-1) rotate(58deg) translateY(16px) scale(.96);
    filter:drop-shadow(0 5px 8px rgba(0,0,0,.45)) brightness(.82);
  }
  100%{
    opacity:0;
    transform:scaleX(-1) rotate(82deg) translateY(34px) scale(.88);
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.25)) brightness(.45);
  }
}

.battle-fx{
  position:absolute;
  width:34%;
  height:70%;
  object-fit:contain;
  left:50%;
  top:46%;
  transform:translate(-50%,-50%);
  z-index:4;
  opacity:0;
  pointer-events:none;
}

.battle-fx.play{
  animation:battleFxFlash .55s ease-out;
}

@keyframes battleFxFlash{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.75) rotate(-6deg)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.25) rotate(4deg)}
}

.battle-nameplate{
  position:absolute;
  z-index:5;
  top:8px;
  left:8px;
  right:8px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
}

.battle-name{
  padding:4px 7px;
  border:1px solid rgba(64,80,115,.75);
  border-radius:999px;
  background:rgba(8,12,20,.68);
  color:var(--text);
}

.battle-mini-hp{
  position:absolute;
  z-index:5;
  height:7px;
  border:1px solid rgba(0,0,0,.5);
  border-radius:99px;
  background:rgba(0,0,0,.45);
  overflow:hidden;
}

.battle-mini-hp span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#ff5353,#ffb86c);
}

.battle-player-hp{
  left:8px;
  bottom:8px;
  width:34%;
}

.battle-monster-hp{
  right:8px;
  bottom:8px;
  width:34%;
}

.battle-float-text{
  position:absolute;
  z-index:6;
  left:50%;
  top:34%;
  transform:translateX(-50%);
  color:var(--gold);
  font-weight:800;
  text-shadow:0 2px 8px rgba(0,0,0,.8);
  opacity:0;
  pointer-events:none;
}

.battle-float-text.play{
  animation:battleTextFloat .7s ease-out;
}

@keyframes battleTextFloat{
  0%{opacity:0;transform:translate(-50%,10px) scale(.9)}
  25%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-24px) scale(1.08)}
}
.equip-icon{
  position:relative;
  width:72px;
  height:72px;
  flex:0 0 auto;
  display:inline-block;
  border-radius:10px;
  background:rgba(5,8,14,.62);
  box-shadow:inset 0 0 18px rgba(0,0,0,.35),0 4px 12px rgba(0,0,0,.25);
  overflow:hidden;
  vertical-align:middle;
}

.equip-icon.large{
  width:96px;
  height:96px;
}

.equip-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.equip-layer.material{
  opacity:.48;
  mix-blend-mode:screen;
}

.equip-layer.frame{
  z-index:3;
}

.equip-layer.grade{
  z-index:4;
}

.equip-layer.fx{
  z-index:5;
}

.equip-layer.unidentified{
  z-index:6;
}

.equip-line{
  display:flex;
  gap:10px;
  align-items:center;
}

.equip-info{
  min-width:0;
}
.equip-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
  gap:10px;
  align-items:start;
}

.equip-grid-cell{
  position:relative;
  min-height:88px;
  border:1px solid rgba(64,80,115,.7);
  border-radius:12px;
  background:rgba(10,15,26,.72);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px;
  transition:.15s;
}

.equip-grid-cell:hover{
  border-color:rgba(119,230,255,.55);
  background:rgba(18,32,51,.78);
  transform:translateY(-1px);
}

.equip-grid-cell .equip-icon{
  width:64px;
  height:64px;
}

.equip-tooltip{
  display:none;
  position:absolute;
  left:50%;
  top:72px;
  transform:translateX(-50%);
  z-index:9999;
  width:300px;
  max-width:80vw;
  padding:10px;
  border:1px solid rgba(119,230,255,.38);
  border-radius:12px;
  background:rgba(8,12,20,.96);
  box-shadow:0 12px 30px rgba(0,0,0,.45);
  pointer-events:none;
}

.equip-grid-cell:hover .equip-tooltip{
  display:block;
}

.equip-tooltip-title{
  font-weight:800;
  margin-bottom:6px;
}

.equip-tooltip-line{
  font-size:13px;
  line-height:1.6;
}

.equip-mobile-mask{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.58);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
}

.equip-mobile-dialog{
  width:min(420px,96vw);
  max-height:80vh;
  overflow:auto;
  border:1px solid rgba(119,230,255,.38);
  border-radius:14px;
  background:rgba(12,18,30,.98);
  box-shadow:0 16px 42px rgba(0,0,0,.55);
  padding:12px;
}

.equip-mobile-actions{
  display:flex;
  justify-content:flex-end;
  margin-top:10px;
}
.item-icon{
  position:relative;
  width:42px;
  height:42px;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  background:rgba(5,8,14,.62);
  box-shadow:inset 0 0 12px rgba(0,0,0,.35);
  overflow:hidden;
  vertical-align:middle;
}

.item-icon.large{
  width:64px;
  height:64px;
}

.item-icon img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.item-icon-stack{
  position:relative;
  width:42px;
  height:42px;
  flex:0 0 auto;
}

.item-icon-stack.large{
  width:64px;
  height:64px;
}

.item-icon-stack img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
}

.item-quality-overlay{
  pointer-events:none;
  opacity:.85;
}

.item-line{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.item-line-text{
  min-width:0;
  overflow:hidden;
}

.reward-list{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin:6px 0;
}

.reward-chip{
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 7px;
  border:1px solid rgba(64,80,115,.7);
  border-radius:10px;
  background:rgba(10,15,26,.55);
}

.resource-icon{
  width:20px;
  height:20px;
  object-fit:contain;
  vertical-align:middle;
  margin-right:4px;
}

.shop-good{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.forge-cost-line{
  display:flex;
  align-items:center;
  gap:8px;
  margin:6px 0;
}
.forge-layout{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:12px;
}

.forge-sidebar{
  background:rgba(10,15,26,.72);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.forge-category{
  margin-bottom:8px;
}

.forge-category-title{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#1c2740;
  border:1px solid #405073;
  border-radius:10px;
  padding:9px 10px;
  color:var(--text);
}

.forge-category-title.active{
  background:#31446f;
  border-color:#6b85c8;
}

.forge-slot-list{
  margin-top:8px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.forge-slot-btn{
  text-align:center;
  padding:8px 6px;
  border-radius:9px;
  border:1px solid rgba(64,80,115,.75);
  background:rgba(18,32,51,.7);
}

.forge-slot-btn.active{
  border-color:var(--gold);
  background:rgba(80,62,28,.62);
  color:var(--gold);
}

.forge-preview{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:12px;
  align-items:start;
}

.forge-stat-range{
  padding:7px 9px;
  border:1px solid rgba(64,80,115,.7);
  border-radius:9px;
  background:rgba(8,12,20,.45);
  margin:5px 0;
}

.forge-blue-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:6px;
}

.forge-blue-item{
  padding:7px 8px;
  border:1px solid rgba(119,230,255,.18);
  border-radius:9px;
  background:rgba(8,18,28,.55);
}

.forge-cost-card{
  padding:9px;
  border:1px solid rgba(255,211,106,.25);
  border-radius:10px;
  background:rgba(35,28,12,.35);
  margin-bottom:10px;
}

.material-hover{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:6px;
}

.material-tooltip{
  display:none;
  position:absolute;
  left:0;
  top:48px;
  z-index:80;
  width:260px;
  padding:9px 10px;
  border:1px solid rgba(119,230,255,.32);
  border-radius:10px;
  background:rgba(8,12,20,.96);
  box-shadow:0 10px 28px rgba(0,0,0,.45);
  font-size:13px;
  line-height:1.55;
  pointer-events:none;
}

.material-hover:hover .material-tooltip{
  display:block;
}

.craft-layout{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:12px;
}

.craft-sidebar{
  background:rgba(10,15,26,.72);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.craft-category-title{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#1c2740;
  border:1px solid #405073;
  border-radius:10px;
  padding:9px 10px;
  color:var(--text);
}

.craft-category-title.active{
  background:#31446f;
  border-color:#6b85c8;
}

.craft-item-list{
  margin-top:8px;
  display:grid;
  grid-template-columns:1fr;
  gap:6px;
}

.craft-item-btn{
  text-align:left;
  padding:8px;
  border-radius:9px;
  border:1px solid rgba(64,80,115,.75);
  background:rgba(18,32,51,.7);
}

.craft-item-btn.active{
  border-color:var(--gold);
  background:rgba(80,62,28,.62);
  color:var(--gold);
}

.craft-preview{
  display:grid;
  grid-template-columns:90px 1fr;
  gap:12px;
  align-items:start;
}

@media(max-width:820px){
  .craft-layout{grid-template-columns:1fr}
  .craft-preview{grid-template-columns:1fr}
}
@media(max-width:820px){
  .forge-layout{grid-template-columns:1fr}
  .forge-preview{grid-template-columns:1fr}
}
.tabs-note{font-size:13px;color:var(--muted)}
.auth-wrap{
  min-height:100vh;

  return CONFIG.fashions.filter(fashion=>{

  });

  return !!STATE.fashion?.owned?.includes(fashionId);

function canUseFashion(fashion){
  if(!fashion)return false;
  return fashion.gender==="通用"||fashion.gender===STATE.player.gender;
}

function getFashionBattleImage(fashion){
  if(!fashion)return "";
  return fashion.animated||fashion.image;
}

function getEquippedFashion(){
  return getFashionConfig(STATE.fashion?.equipped);
}

function getPlayerDisplayImage(){
  const glamour=STATE.fashion?.glamour;

  if(glamour?.type==="realm"){
    return getPlayerPortrait(glamour.gender||STATE.player.gender,glamour.realm);
  }

  if(glamour?.type==="fashion"){
    const fashion=getFashionConfig(glamour.fashionId);
    if(fashion)return getFashionBattleImage(fashion);
  }

  const equippedFashion=getEquippedFashion();
  if(equippedFashion)return getFashionBattleImage(equippedFashion);

  return getPlayerPortrait(STATE.player.gender||"男",STATE.player.realm||0);

let STATE=loadState();
let GAME_WS=null;
let GAME_WS_RETRY_TIMER=null;
function getAuthToken(){
  return localStorage.getItem("zs_xxxt_token")||"";
}

function setAuthToken(token){
  localStorage.setItem("zs_xxxt_token",token||"");
}

function clearAuthToken(){
  localStorage.removeItem("zs_xxxt_token");
}

async function apiRequest(path,options={}){
  const headers={
    "Content-Type":"application/json",
    ...(options.headers||{})
  };

  const token=getAuthToken();
  if(token){
    headers.Authorization="Bearer "+token;
  }

  const response=await fetch(API_BASE+path,{
    ...options,
    headers
  });

  let data=null;
  try{
    data=await response.json();
  }catch{
    data={ok:false,message:"服务器返回格式错误"};
  }

  if(!response.ok||!data.ok){
    throw new Error(data.message||"请求失败");
  }

  return data;
}

function closeGameWebSocket(){
  if(GAME_WS){
    try{
      GAME_WS.onopen=null;
      GAME_WS.onclose=null;
      GAME_WS.onmessage=null;
      GAME_WS.onerror=null;
      GAME_WS.close();
    }catch{}
    GAME_WS=null;
  }

  if(GAME_WS_RETRY_TIMER){
    clearTimeout(GAME_WS_RETRY_TIMER);
    GAME_WS_RETRY_TIMER=null;
  }
}

function getWsUrl(){
  const token=getAuthToken();
  const protocol=location.protocol==="https:"?"wss":"ws";
  return `${protocol}://${location.host}/?token=${encodeURIComponent(token)}`;
}

function sendWsMessage(data){
  if(GAME_WS&&GAME_WS.readyState===WebSocket.OPEN){
    GAME_WS.send(JSON.stringify(data));
    return true;
  }
  return false;
}

function handleGameWsMessage(data){
  if(!data||typeof data!=="object")return;

  if(data.type==="connected"){
    return;
  }

  if(data.type==="pong"){
    return;
  }

  if(data.type==="auth_error"){
    alert(data.message||"WebSocket 登录失效");
    closeGameWebSocket();
    return;
  }

  if(data.type==="world_chat_history"){
    if(!STATE.worldChat){
      STATE.worldChat={input:"",messages:[]};
    }

    STATE.worldChat.messages=Array.isArray(data.messages)?data.messages:[];
    saveState();
    updateWorldChatDom();
    return;
  }

  if(data.type==="world_chat_message"){
    if(!STATE.worldChat){
      STATE.worldChat={input:"",messages:[]};
    }

    if(!STATE.worldChat.messages.some(message=>message.id===data.id)){
      STATE.worldChat.messages.push(data);
      STATE.worldChat.messages=STATE.worldChat.messages.slice(-80);
    }

    saveState();
    updateWorldChatDom();
    return;
  }

if(data.type==="trade_update"){
  if(!STATE.tradeFilter){
    STATE.tradeFilter={keyword:"",itemKind:"all",tradeType:"all",page:1,totalPages:1,total:0,hasUpdate:false,loading:false};
  }

  STATE.tradeFilter.hasUpdate=true;
  pushUseLog(`交易行提示：${data.message||"交易行有更新"}`);
  saveState();

  if(STATE.tab==="交易行"){
    updateTradeUpdateHintDom();
  }

  return;
}
  if(data.type==="system_notice"){
    pushLog(`<span class="cyan">[系统频道]</span>${escapeHtml(data.message||"有新消息")}`);
    saveState();
    return;
  }

  if(data.type==="save_hint"){
    pushUseLog(`实时提示：${data.message||"已收到"}`);
    return;
  }
}

function connectGameWebSocket(){
  const token=getAuthToken();
  if(!token)return;

  closeGameWebSocket();

  const wsUrl=getWsUrl();
  const ws=new WebSocket(wsUrl);
  GAME_WS=ws;

  ws.onopen=()=>{
    sendWsMessage({type:"ping"});
  };

  ws.onmessage=event=>{
    let data;
    try{
      data=JSON.parse(event.data);
    }catch{
      return;
    }
    handleGameWsMessage(data);
  };

  ws.onclose=()=>{
    if(GAME_WS===ws)GAME_WS=null;

    if(getAuthToken()){
      GAME_WS_RETRY_TIMER=setTimeout(()=>{
        if(getAuthToken())connectGameWebSocket();
      },5000);
    }
  };

  ws.onerror=()=>{
    // 这里不弹窗，避免连接重试时一直吵
  };
}

function renderWorldChatMessages(){
  const messages=STATE.worldChat?.messages||[];

  if(!messages.length){
    return `<span class="muted">暂无世界聊天，第一位开口的道友通常都比较勇。</span>`;
  }

  return messages.map(message=>`<div>
    <span class="muted">[${new Date(message.time).toLocaleTimeString()}]</span>
    <span class="gold">[${escapeHtml(message.realm)}]</span>
    <b>${escapeHtml(message.name)}：</b>
    <span>${escapeHtml(message.text)}</span>
  </div>`).join("");
}

function updateWorldChatDom(){
  const list=document.getElementById("worldChatList");
  if(list){
    list.innerHTML=renderWorldChatMessages();
    list.scrollTop=list.scrollHeight;
  }

  const input=document.getElementById("worldChatInput");
  if(input&&STATE.worldChat){
    input.value=STATE.worldChat.input||"";
  }
}

function handleWorldChatInput(element){

let GAME_BGM_AUDIO=null;
let BGM_REWARD_TIMER=null;

function getGameBgmAudio(){
  if(!GAME_BGM_AUDIO){
    GAME_BGM_AUDIO=new Audio("assets/audio/bgm/main_theme.mp3");
    GAME_BGM_AUDIO.loop=true;
    GAME_BGM_AUDIO.volume=.45;
  }

  return GAME_BGM_AUDIO;
}

function startBgm(){
  if(!STATE.ui){
    STATE.ui={glamourOpen:false,bgmPromptShown:false,bgmEnabled:false,bgmRewardStartedAt:0,bgmRewardElapsed:0,lastBgmRewardAt:0};
  }

  const audio=getGameBgmAudio();

  audio.play().then(()=>{
    STATE.ui.bgmEnabled=true;
    STATE.ui.bgmPromptShown=true;
    STATE.ui.bgmRewardStartedAt=Date.now();
    saveState();
    startBgmRewardTimer();
    pushUseLog("BGM 已开启。");
  }).catch(()=>{
    alert("浏览器阻止了自动播放，请再点击一次开启 BGM。");
  });
}

function stopBgm(){
  const audio=getGameBgmAudio();
  audio.pause();

  STATE.ui.bgmEnabled=false;
  STATE.ui.bgmRewardStartedAt=0;
  saveState();

  if(BGM_REWARD_TIMER){
    clearInterval(BGM_REWARD_TIMER);
    BGM_REWARD_TIMER=null;
  }

  pushUseLog("BGM 已关闭。");
}

function toggleBgm(){
  if(STATE.ui?.bgmEnabled){
    stopBgm();
  }else{
    startBgm();
  }

  render();
}

function startBgmRewardTimer(){
  if(BGM_REWARD_TIMER){
    clearInterval(BGM_REWARD_TIMER);
  }

  BGM_REWARD_TIMER=setInterval(()=>{
    if(!STATE.ui?.bgmEnabled)return;

    const audio=getGameBgmAudio();

    if(audio.paused){
      return;
    }

    STATE.ui.bgmRewardElapsed=(STATE.ui.bgmRewardElapsed||0)+1000;

    if(STATE.ui.bgmRewardElapsed>=5*60*1000){
      STATE.ui.bgmRewardElapsed-=5*60*1000;
      STATE.ui.lastBgmRewardAt=Date.now();

      addItem("传说时装碎片",1,"材料");
      pushLog(`<span class="gold">BGM 灵韵奖励：</span>获得传说时装碎片 ×1。`);
      pushUseLog("BGM播放满5分钟，获得传说时装碎片×1。");

      saveState();

      if(STATE.tab==="背包"||STATE.tab==="主页"){
        safeRender();
      }
    }else{
      saveState();
    }
  },1000);
}

function mergeState(base,saved){
  if(Array.isArray(base))return Array.isArray(saved)?saved:base;
  if(base&&typeof base==="object"){
    const output={...base};
    Object.keys(saved||{}).forEach(key=>{
      output[key]=mergeState(base[key],saved[key]);
    });
    return output;
  }
  return saved===undefined?base:saved;
}

function totalAttrs(){
  const attrs={
    生命:STATE.player.lifeMax,
    力量:STATE.player.attrs.力量,
    精神:STATE.player.attrs.精神,
    灵力:STATE.player.attrs.灵力,
    耐力:STATE.player.attrs.耐力,
    抗性:STATE.player.attrs.抗性,
    速度:STATE.player.attrs.速度,
    幸运:0,
    固伤:0
  };

  Object.values(STATE.equipped).filter(Boolean).forEach(equip=>{
    const equipAttrs=equip.attrs||{};
    for(const key in equipAttrs){
      attrs[key]=(attrs[key]||0)+equipAttrs[key];
    }
  });

  const vipConfig=CONFIG.vip[STATE.vip.level]||CONFIG.vip[0];
  const monthBonus=STATE.month.active ? .02 : 0;

  if(STATE.buffs?.wine&&STATE.buffs.wine.until>now()){
    const wine=STATE.buffs.wine;
    attrs[wine.attr]=(attrs[wine.attr]||0)+wine.value;
  }

  for(const key in attrs){
    attrs[key]=Math.floor(attrs[key]*(1+(vipConfig.bonus||0)+monthBonus));
  }

  return attrs;
}

function weightedPick(values,weights){
  let total=weights.reduce((sum,value)=>sum+value,0);
  let roll=Math.random()*total;
  for(let index=0;index<values.length;index++){
    roll-=weights[index];
    if(roll<=0)return values[index];
  }
  return values[0];
}

function getMaterialConfigByName(name){
  return CONFIG.materials.find(material=>material.name===name);
}

function getSpecialMaterialConfigByName(name){
  return Object.values(CONFIG.monsterSpecialDrops||{}).find(material=>material.name===name);
}

function getPillBaseName(name){
  return String(name||"")
    .replace(/^下品/,"")
    .replace(/^中品/,"")
    .replace(/^上品/,"");
}

function getPillGradeIndexFromName(name){
  if(String(name||"").startsWith("上品"))return 2;
  if(String(name||"").startsWith("中品"))return 1;
  return 0;
}

function getPillConfigByName(name){
  const baseName=getPillBaseName(name);
  return CONFIG.pills.find(pill=>pill.name===baseName);
}

function createPillItemName(pillName,gradeIndex){
  const gradeName=CONFIG.grades[gradeIndex]?.name||"下品";
  return gradeName+pillName;
}

function getPillQualityFrameIndex(pillName){
  const pill=getPillConfigByName(pillName);
  if(!pill)return 1;
  return Math.max(0,Math.min(6,pill.realm+1));
}

function pillIconHtml(name,type=null,size=""){
  const pill=getPillConfigByName(name);
  if(!pill)return null;

  const baseName=getPillBaseName(name);
  const icon=getItemIconPath(baseName,type);
  const gradeIndex=getPillGradeIndexFromName(name);
  const qualityIndex=getPillQualityFrameIndex(name);

  const framePath=CONFIG.equipmentIconPaths.frame+"quality_"+qualityIndex+"_"+[
    "broken","normal","fine","rare","epic","legend","myth"
  ][qualityIndex]+".webp";

  const gradePath=CONFIG.equipmentIconPaths.grade+"grade_"+gradeIndex+"_"+[
    "low","mid","high"
  ][gradeIndex]+".webp";

  return `<span class="item-icon-stack ${size}">
    <img src="${icon}" onerror="this.style.display='none'">
    <img class="item-quality-overlay" src="${framePath}" onerror="this.style.display='none'">
    <img class="item-quality-overlay" src="${gradePath}" onerror="this.style.display='none'">
  </span>`;
}

function getPillGradeWeights(){
  return [60,30,10];
}

function rollPillGrade(){
  return weightedPick([0,1,2],getPillGradeWeights());
}

function getPillGradeSuccessBonus(gradeIndex){
  return [0,.08,.16][gradeIndex]||0;
}

function findBestBreakthroughPill(pillName){
  const candidates=STATE.bag.filter(item=>{
    return item.type==="丹药"&&item.count>0&&getPillBaseName(item.name)===pillName;
  });

  if(!candidates.length)return null;

  candidates.sort((a,b)=>getPillGradeIndexFromName(b.name)-getPillGradeIndexFromName(a.name));
  return candidates[0];
}
function getItemIconPath(name,type=null){
  if(CONFIG.itemIconMap[name])return CONFIG.itemIconMap[name];

  const material=getMaterialConfigByName(name);
  if(material)return CONFIG.materialTypeIcons[material.type]||CONFIG.iconPaths.materials+"material_treasure.webp";
  const specialMaterial=getSpecialMaterialConfigByName(name);
  if(specialMaterial){
    return CONFIG.materialTypeIcons[specialMaterial.type]||CONFIG.iconPaths.materials+"material_treasure.webp";
  }

  if(name.includes("破境丹"))return CONFIG.iconPaths.pills+"breakthrough_dan.webp";
  if(name.includes("丹"))return CONFIG.iconPaths.pills+"attribute_dan.webp";
  if(name.includes("灵石"))return CONFIG.iconPaths.packages+"random_spirit_stone_pack.webp";
  if(name.includes("残页"))return CONFIG.iconPaths.skillItems+"skill_page.webp";
  if(name.includes("礼包"))return CONFIG.iconPaths.packages+"normal_gift_pack.webp";
  if(name.includes("材料包"))return CONFIG.iconPaths.packages+"random_material_pack.webp";
  if(name.includes("装备箱"))return CONFIG.iconPaths.packages+"low_equip_box.webp";

  if(type==="材料")return CONFIG.iconPaths.materials+"material_treasure.webp";
  if(type==="功法残页")return CONFIG.iconPaths.skillItems+"skill_page.webp";
  if(type==="礼包")return CONFIG.iconPaths.packages+"normal_gift_pack.webp";

  return CONFIG.iconPaths.itemsFallback||CONFIG.iconPaths.tools+"identify_talisman.webp";
}

function itemIconHtml(name,type=null,size=""){
  const pillHtml=pillIconHtml(name,type,size);
  if(pillHtml)return pillHtml;
  const material=getMaterialConfigByName(name);
  const specialMaterial=getSpecialMaterialConfigByName(name);
  const icon=getItemIconPath(name,type);
  const qualityIcon=material?CONFIG.materialQualityIcons[material.quality]:null;
  const specialFrame=specialMaterial?CONFIG.specialMaterialFrame:null;

  if(qualityIcon||specialFrame){
    return `<span class="item-icon-stack ${size}">
      <img src="${icon}" onerror="this.style.display='none'">
      ${qualityIcon?`<img class="item-quality-overlay" src="${qualityIcon}" onerror="this.style.display='none'">`:""}
      ${specialFrame?`<img class="item-quality-overlay" src="${specialFrame}" onerror="this.style.display='none'">`:""}
    </span>`;
  }

  return `<span class="item-icon ${size}">
    <img src="${icon}" alt="${name}" onerror="this.style.display='none'">
  </span>`;

function guessItemType(name){

  if(CONFIG.spiritStoneConfigs?.some(stone=>stone.name===name))return "灵石";
  if(getPillConfigByName(name))return "丹药";
  if(getSpecialMaterialConfigByName(name))return "特殊材料";
  if(CONFIG.giftRecipes?.some(item=>item.name===name))return "礼物";
  if(CONFIG.wineRecipes?.some(item=>item.name===name))return "酒";
  if(name==="传说时装碎片")return "材料";
  if(name==="传说时装自选箱")return "礼包";
  if(name==="幻化卡")return "道具";
  if(name==="更新礼包")return "礼包";
  if(name.includes("仙缘箱"))return "仙缘箱";
  if(name.includes("丹"))return "丹药";
  if(name.includes("灵石"))return "灵石";
  if(name.includes("生命晶石"))return "道具";
  if(name.includes("炉"))return "炼丹炉";
  if(name.includes("材料")||CONFIG.materials.some(material=>material.name===name))return "材料";
  if(name.includes("装备箱"))return "礼包";
  if(name.includes("功法残卷"))return "功法残卷";
if(name.includes("神技残卷"))return "神技残卷";
if(name.includes("心法玉简"))return "心法玉简";
if(name.includes("残页"))return "功法残页";
  return "道具";
}

  if(amount>=648){

function gainReward(attachment,source="未知"){
  if(!attachment)return true;
  if(attachment.coin) STATE.resources.coin+=attachment.coin;
  if(attachment.yuanbao) STATE.resources.yuanbao+=attachment.yuanbao;
  if(attachment.xianyuan) gainXianyuan(attachment.xianyuan,source);
  if(attachment.cult) STATE.player.cultivation+=attachment.cult;
  if(attachment.systemPoint) STATE.resources.systemPoint+=attachment.systemPoint;
  if(attachment.items) attachment.items.forEach(([name,count])=>addItem(name,count,guessItemType(name)));

  saveState();
  return true;
}

function createEquip(realm=STATE.player.realm,slot=pick(CONFIG.equipSlots),identified=true,options={}){
  const qualityIndex=options.qualityIndex!==undefined
    ? options.qualityIndex
    : weightedPick(
        options.qualityPool||[0,1,2,3,4,5,6],
        options.qualityWeights||[360,300,180,90,40,12,3]
      );

  const gradeIndex=weightedPick([0,1,2],[60,30,10]);
  const quality=CONFIG.qualities[qualityIndex];
  const grade=CONFIG.grades[gradeIndex];

  const baseSlot=typeof getEquipBaseSlot==="function"
    ? getEquipBaseSlot(slot)
    : (
        slot==="手镯1"||slot==="手镯2"
          ? "手镯"
          : slot==="戒指1"||slot==="戒指2"||slot==="戒指3"
            ? "戒指"
            : slot
      );

  const base=10+realm*15;
  const isAttack=["武器","项链","手镯"].includes(baseSlot);
  const isDefense=["头盔","上身","下装","护臂"].includes(baseSlot);
  const isSpeed=baseSlot==="鞋";

  const attrs={};
  const multiplier=quality.multiplier*grade.multiplier;

  if(isAttack){
    attrs.力量=Math.floor(base*multiplier*rnd(8,13)/10);
    attrs.精神=Math.floor(base*multiplier*rnd(5,10)/10);
  }else if(isDefense){
    attrs.耐力=Math.floor(base*multiplier*rnd(8,13)/10);
    attrs.抗性=Math.floor(base*multiplier*rnd(5,10)/10);
    attrs.生命=Math.floor(base*multiplier*8);
  }else if(isSpeed){
    attrs.速度=Math.max(1,Math.floor((2+realm)*multiplier));
    attrs.生命=Math.floor(base*multiplier*4);
  }else{
    attrs.灵力=Math.floor(base*multiplier*2);
    attrs.生命=Math.floor(base*multiplier*5);
  }

  let blue=null;

  if(options.allowBlue){
    blue=options.forceBlue
      ? pick(CONFIG.blueEffects)
      : (chance(.035+qualityIndex*.008)?pick(CONFIG.blueEffects):null);
  }

  const noRealmLimit=!!options.noRealmLimit;
  const craftedBy=options.craftedBy||null;

  const weaponStyle=baseSlot==="武器"
    ? (options.weaponStyle||pick(CONFIG.weaponIconStyles))
    : null;

  const icon=createEquipmentIcon(
    baseSlot,
    realm,
    qualityIndex,
    gradeIndex,
    blue,
    identified,
    weaponStyle
  );

  return {
    id:uid("equip"),
    name:`${pick(["碎星","寒碑","青烬","澜影","玄垣","照夜","晦明"])}${baseSlot}`,
    slot:baseSlot,
    realm,
    quality:qualityIndex,
    grade:gradeIndex,
    attrs,
    blue,
    identified,
    noRealmLimit,
    craftedBy,
    weaponStyle,
    icon
  };
}

function equipToBestCompatibleSlot(equip){
  if(!equip)return false;
if(!canWearEquip(equip)){
    return false;
  }

  const slots=getCompatibleEquipSlots(equip.slot);
  let bestSlot=slots[0];

  for(const slot of slots){
    if(!STATE.equipped[slot]){
      bestSlot=slot;
      break;
    }

    if(equipScore(equip)>equipScore(STATE.equipped[slot])){
      bestSlot=slot;
    }
  }

  if(STATE.equipped[bestSlot]){
    STATE.store.push(STATE.equipped[bestSlot]);
  }

  STATE.equipped[bestSlot]=equip;
  STATE.store=STATE.store.filter(item=>item.id!==equip.id);

  return true;
}
function equipScore(equip){
  return (equip.quality+1)*1000+(equip.grade+1)*180+Object.values(equip.attrs).reduce((a,b)=>a+b,0)+equip.realm*120+(equip.blue?500:0);
}

          battleLogs.push(`<span class="good">${root.name}灵根触发：回血 ${heal}。</span>`);
        }
        if(root.type==="shield"){
          playerShield+=Math.floor(attrs.生命*.06);
          battleLogs.push(`<span class="blue">${root.name}灵根触发：护盾。</span>`);
        }
        if(root.type==="stun"&&chance(.45)){
          monsterSeal=1;
          battleLogs.push(`<span class="crit">${root.name}灵根触发：麻痹敌人。</span>`);
        }
      }

      if(blueEffects.some(effect=>effect.type==="combo")&&chance(.08)){
        const comboDamage=Math.floor(damage*.45);
        monsterHp-=comboDamage;
        battleLogs.push(`<span class="blue">蓝字·双影回刃：追加 ${comboDamage}</span>`);
      }
      if(blueEffects.some(effect=>effect.type==="heal")&&chance(.12)){
        const heal=Math.floor(attrs.生命*.03);
        playerHp=Math.min(STATE.player.lifeMax,playerHp+heal);
        battleLogs.push(`<span class="good">蓝字回血 ${heal}</span>`);
      }
    };

    const monsterAttack=()=>{
      if(monsterSeal>0){
        monsterSeal--;
        battleLogs.push(`<span class="blue">${monster.name} 被封灵，行动失败。</span>`);
        return;
      }
      let damage=Math.max(1,Math.floor(monster.atk-attrs.耐力*.35-attrs.抗性*.18));
      if(isBoss&&round>8){
        damage=Math.floor(damage*1.35);
        battleLogs.push(`<span class="bad">Boss 狂暴！</span>`);
      }
      if(playerShield>0){
        const blocked=Math.min(playerShield,damage);
        playerShield-=blocked;
        damage-=blocked;
      }
      playerHp-=damage;
      battleLogs.push(`第${round}回合：${monster.name} 反击，造成 ${damage} 伤害。`);
      if(blueEffects.some(effect=>effect.type==="thorns")&&chance(.1)){
        const thornsDamage=Math.floor(damage*.4);
        monsterHp-=thornsDamage;
        battleLogs.push(`<span class="blue">蓝字反伤 ${thornsDamage}</span>`);
      }
    };

    if(attrs.速度>=monster.speed){
      playerAttack();
      if(monsterHp>0)monsterAttack();
    }else{
      monsterAttack();
      if(playerHp>0)playerAttack();
    }
  }

  STATE.player.life=Math.max(0,playerHp);
  STATE.currentMonsterHp=Math.max(0,monsterHp);
  const win=monsterHp<=0;

  if(win){
  triggerMonsterDeath(monster);
  STATE.currentMonsterHp=null;
  rewardBattle(isBoss);
  battleLogs.push(`<span class="good">战斗胜利。</span>`);
}else if(playerHp<=0){
    STATE.player.lifespan-=isBoss?2:1;
    if(STATE.player.lifespan<=0){
      STATE.player.dying=true;
      battleLogs.push(`<span class="bad">寿命归零，进入濒死/轮回待定状态。</span>`);
    }else{
      battleLogs.push(`<span class="bad">战斗失败，寿命受损。</span>`);
    }
  }

  if(!STATE.hideLog) battleLogs.reverse().forEach(pushLog);
  tryBreakthrough(false);
  saveState();
}

function bestEquip(){
  const sorted=STATE.store
  .filter(equip=>equip.identified&&canWearEquip(equip))
  .sort((a,b)=>equipScore(b)-equipScore(a));

  sorted.forEach(equip=>{
    if(!STATE.store.some(item=>item.id===equip.id))return;

    const slots=getCompatibleEquipSlots(equip.slot);
    const hasEmpty=slots.some(slot=>!STATE.equipped[slot]);
    const weakestSlot=slots
      .filter(slot=>STATE.equipped[slot])
      .sort((a,b)=>equipScore(STATE.equipped[a])-equipScore(STATE.equipped[b]))[0];

    if(hasEmpty){
      equipToBestCompatibleSlot(equip);
      return;
    }

    if(weakestSlot&&equipScore(equip)>equipScore(STATE.equipped[weakestSlot])){
      equipToBestCompatibleSlot(equip);
    }
  });

  saveState();
  render();
}

function getForgeCost(slot,targetRealm=STATE.player.realm){
  const playerRealm=STATE.player.realm;
  const realmGap=Math.max(0,targetRealm-playerRealm);
  const materialPool=CONFIG.materials.filter(material=>{
    return material.realm<=targetRealm+1&&material.realm>=Math.max(0,targetRealm-1);
  });

  const fallbackPool=CONFIG.materials.length?CONFIG.materials:[{name:"雾纹草",type:"药草",realm:0,quality:0}];
  const pool=materialPool.length?materialPool:fallbackPool;

  const mainIndex=(targetRealm+slot.length)%pool.length;
let secondIndex=(targetRealm*3+slot.length+1)%pool.length;

if(secondIndex===mainIndex&&pool.length>1){
  secondIndex=(secondIndex+1)%pool.length;
}

const mainMaterial=pool[mainIndex];
const secondMaterial=pool[secondIndex];

  const slotCostRate={
    "武器":1.35,
    "头盔":1.05,
    "上身":1.3,
    "下装":1.15,
    "鞋":1,
    "护臂":1,
    "项链":1.25,
"手镯":1.18,
    "手镯1":1.18,
    "手镯2":1.18,
"戒指":1.2,
    "戒指1":1.2,
    "戒指2":1.2,
    "戒指3":1.2
  }[slot]||1;

  const realmRate=Math.pow(CONFIG.forgeMaterialRules.realmCoinMultiplier,targetRealm);
  const overRealmRate=realmGap>0?CONFIG.forgeMaterialRules.overRealmPenalty:1;

  const rawMaterials=[
  {
    name:"锻造石",
    count:Math.ceil((CONFIG.forgeMaterialRules.stoneBase+targetRealm)*slotCostRate*overRealmRate)
  },
  {
    name:mainMaterial.name,
    count:Math.ceil((CONFIG.forgeMaterialRules.materialBase+targetRealm)*slotCostRate*overRealmRate)
  },
  {
    name:secondMaterial.name,
    count:Math.ceil((1+Math.floor(targetRealm/2))*slotCostRate*overRealmRate)
  }
];

const mergedMaterials=Object.values(rawMaterials.reduce((map,item)=>{
  if(!map[item.name])map[item.name]={name:item.name,count:0};
  map[item.name].count+=item.count;
  return map;
},{}));

return {
  coin:Math.floor(CONFIG.forgeMaterialRules.baseCoin*realmRate*slotCostRate*overRealmRate),
  materials:mergedMaterials,
    targetRealm,
    realmGap,
    slotCostRate,
    overRealmRate
  };
}

 if(["武器","项链","手镯"].includes(baseSlot)){
    ranges.push({name:"力量",min:Math.floor(base*minRate*.8),max:Math.floor(base*maxRate*1.3)});

 }else if(["头盔","上身","下装","护臂"].includes(baseSlot)){

 }else if(baseSlot==="鞋"){
    ranges.push({name:"速度",min:Math.max(1,Math.floor((2+targetRealm)*minRate)),max:Math.max(1,Math.floor((2+targetRealm)*maxRate))});
    ranges.push({name:"生命",min:Math.floor(base*minRate*2),max:Math.floor(base*maxRate*4)});
  }else{
    ranges.push({name:"灵力",min:Math.floor(base*minRate*2),max:Math.floor(base*maxRate*2)});

  }

  return ranges;
}

function getForgeSuccessRate(targetRealm){
  const gap=targetRealm-STATE.player.realm;
  let rate=.62;

  if(gap>0)rate-=.18;
  if(gap<0)rate+=Math.min(.18,Math.abs(gap)*.04);

  if(STATE.system.path==="炼器")rate+=.18;
  rate+=CONFIG.vip[STATE.vip.level]?.forge||0;
  rate+=STATE.system.forgeShopBonus||0;

  if(!STATE.forge){
    STATE.forge={failCompensation:0};
  }

  rate+=Math.min(.30,STATE.forge.failCompensation||0);

  return Math.max(.08,Math.min(.95,rate));
}

 }else{

const craftCount=Math.max(1,Math.min(99,Number(STATE.alchemyCount||1)));
const totalCost=multiplyPillMaterialCost(cost,craftCount);

 if(!hasPillMaterialCost(totalCost)){

consumePillMaterialCost(totalCost);

function getPillMaterialCost(pillName){
  const pill=getPillConfigByName(pillName)||CONFIG.pills[0];
  const realm=pill.realm||0;

  const pool=CONFIG.materials.filter(material=>{
    return material.realm>=Math.max(0,realm-1)&&material.realm<=Math.min(8,realm+1);
  });

  const usablePool=pool.length?pool:CONFIG.materials;

  const firstIndex=(realm*3+pill.name.length)%usablePool.length;
  let secondIndex=(realm*5+pill.name.length+7)%usablePool.length;

  if(secondIndex===firstIndex&&usablePool.length>1){
    secondIndex=(secondIndex+1)%usablePool.length;
  }

  const first=usablePool[firstIndex];
  const second=usablePool[secondIndex];

  return {
    items:[
      {
        name:first.name,
        count:2+realm
      },
      {
        name:second.name,
        count:1+Math.floor(realm/2)
      }
    ]
  };
}

function multiplyPillMaterialCost(cost,count){

function hasPillMaterialCost(cost){

function consumePillMaterialCost(cost){

function alchemy(){
  const pillName=$("#pillSelect")?.value||"回春丹";
  const pillConfig=CONFIG.pills.find(item=>item.name===pillName);
  const cost=Math.floor((pillConfig?.baseCost||200)*(1+STATE.player.realm*.25));
  if(STATE.resources.coin<cost)return alert("铜币不足。");
  STATE.resources.coin-=cost;

  const furnace=CONFIG.alchemyFurnaces.find(item=>item.name===STATE.alchemy.furnace);
  const vipBonus=CONFIG.vip[STATE.vip.level]?.alchemy||0;
  let probability=pillName.includes("破境") ? .45 : .68;
  probability += STATE.system.path === "炼丹" ? .15 : 0;
  probability+=furnace?furnace.successBonus:0;
  probability+=vipBonus+(STATE.system.alchemyShopBonus||0);
  probability+=Math.min(.15,STATE.alchemy.failCompensation);

  if(chance(probability)){
    addItem(pillName,1,"丹药");
    STATE.alchemy.failCompensation=Math.max(0,STATE.alchemy.failCompensation-.04);
    pushLog(`<span class="good">炼丹成功：${pillName}</span>`);
  }else{
    STATE.alchemy.failCompensation+=.03;
    let returnRate = STATE.month.active ? .6 : 0;
    if(furnace) returnRate=Math.max(returnRate,furnace.materialReturn);
    if(returnRate) STATE.resources.coin+=Math.floor(cost*returnRate);
    pushLog(`<span class="bad">炼丹失败。${returnRate?`返还 ${Math.round(returnRate*100)}% 铜币。`:""}</span>`);
  }

function createLegalAITask(rawTask){
  const path=STATE.system.path||"苦修";
  const difficulty=rawTask?.difficulty||"normal";
  const mapIndex=STATE.progress.map;
  const currentMap=CONFIG.maps[mapIndex];

  if(path==="炼器"){
    const maxRealm=Math.min(CONFIG.realms.length-1,STATE.player.realm+1);
    let targetRealm=STATE.player.realm;

    if(difficulty==="easy"){
      targetRealm=Math.max(0,STATE.player.realm-1);
    }

    if(difficulty==="normal"){
      targetRealm=STATE.player.realm;
    }

    if(difficulty==="hard"){
      targetRealm=maxRealm;
    }

    const targetSlot=pickAiTaskSlot(difficulty);
    const targetRealmName=CONFIG.realms[targetRealm];
    const targetName=targetSlot==="任意"
      ? `${targetRealmName}装备`
      : `${targetRealmName}${targetSlot}`;

    const title=targetSlot==="任意"
      ? `锻造${targetRealmName}装备`
      : `锻造${targetRealmName}${targetSlot}`;

    const description=targetSlot==="任意"
      ? `锻造任意一件${targetRealmName}境界装备。`
      : `锻造一件${targetRealmName}境界${targetSlot}。`;

    return {
      title,
      description,
      type:"forgeRealm",
      target:targetName,
      targetRealm,
      targetRealmName,
      targetSlot,
      count:1,
      progress:0,
      difficulty,
      rewardHint:"系统点与炼器资源"
    };
  }

  if(path==="苦修"){
    let targetMapIndex=mapIndex;
    let count=10;

    if(difficulty==="easy"){
      targetMapIndex=mapIndex;
      count=12;
    }

    if(difficulty==="normal"){
      if(mapIndex>0&&chance(.5)){
        targetMapIndex=rnd(0,mapIndex);
      }
      count=targetMapIndex<mapIndex?45+15*(mapIndex-targetMapIndex):24;
    }

    if(difficulty==="hard"){
      if(mapIndex>0){
        targetMapIndex=rnd(0,mapIndex);
      }
      count=targetMapIndex<mapIndex?80+25*(mapIndex-targetMapIndex):36;
    }

    const targetMap=CONFIG.maps[targetMapIndex];

    const title=targetMapIndex<mapIndex
      ? `${targetMap.name}清剿`
      : `${targetMap.name}苦修`;

    const description=targetMapIndex<mapIndex
      ? `回到较低地图【${targetMap.name}】击败 ${count} 只怪物。别嫌麻烦，根基差就多练。`
      : `在当前地图【${targetMap.name}】击败 ${count} 只怪物。`;

    return {
      title,
      description,
      type:"killMap",
      target:`${targetMap.name}怪物`,
      targetMapIndex,
      targetMapName:targetMap.name,
      count,
      progress:0,
      difficulty,
      rewardHint:"系统点与修为资源"
    };
  }

  if(path==="炼丹"){
    if(difficulty==="hard"&&CONFIG.wineRecipes?.length){
      const wine=CONFIG.wineRecipes[Math.min(CONFIG.wineRecipes.length-1,STATE.player.realm)];
      return {
        title:`酿制${wine.name}`,
        description:`酿制一壶${wine.name}。`,
        type:"wine",
        target:wine.name,
        count:1,
        progress:0,
        difficulty,
        rewardHint:"系统点与丹炉资源"
      };
    }

    const available=CONFIG.pills.filter(pill=>pill.realm<=STATE.player.realm+1);
    const pill=pick(available.length?available:CONFIG.pills);

    return {
      title:`炼制${pill.name}`,
      description:`炼制一枚${pill.name}。`,
      type:"alchemy",
      target:pill.name,
      count:1,
      progress:0,
      difficulty,
      rewardHint:"系统点与丹药材料"
    };
  }

  return {
    title:"系统试炼",
    description:`在当前地图【${currentMap.name}】击败 10 只怪物。`,
    type:"killMap",
    target:`${currentMap.name}怪物`,
    targetMapIndex:mapIndex,
    targetMapName:currentMap.name,
    count:10,
    progress:0,
    difficulty,
    rewardHint:"系统点与铜币"
  };
}

function buySystemShopGood(goodId){
  const goods=getSystemShopGoods();
  const good=goods.find(item=>item.id===goodId);
  if(!good)return;
  if(STATE.resources.systemPoint<good.cost)return alert("系统点不足。");
  const boughtKey=STATE.system.path+"_"+good.id;

  STATE.resources.systemPoint-=good.cost;

  if(good.type==="mail"){
    sendMail("mail_system_exchange","system_shop:"+good.id,good.attachment);
  }else if(good.type==="direct"){
    gainReward(good.reward,"系统点商城:"+good.name);
    pushLog(`<span class="good">系统点商城兑换：${good.name}</span>`);
  }else if(good.type==="permanent"){
    STATE.system.shopBought[boughtKey]=true;
    STATE.system[good.field]=(STATE.system[good.field]||0)+good.value;
    pushLog(`<span class="gold">永久加成生效：${good.name}</span>`);
  }

  pushFlow("system_shop_buy",{goodId,cost:good.cost,path:STATE.system.path});
  saveState();
  render();
}

function updateAISystemTaskProgress(event){
  if(!STATE.system?.tasks?.length)return;

  STATE.system.tasks.forEach(task=>{
    if(!task.aiGenerated||task.state==="可领取"||task.state==="已完成")return;

    if(task.taskType==="killMap"&&event.type==="kill"){
      if(task.targetMapIndex===event.mapIndex){
        task.progress=(task.progress||0)+1;
      }
    }

    if(task.taskType==="forgeRealm"&&event.type==="forgeRealm"){
      const realmOk=task.targetRealm===event.targetRealm;
      const slotOk=!task.targetSlot||task.targetSlot==="任意"||task.targetSlot===event.slot;
      if(realmOk&&slotOk){
        task.progress=(task.progress||0)+1;
      }
    }

    if(task.taskType==="alchemy"&&event.type==="alchemy"){
      if(task.target===event.name){
        task.progress=(task.progress||0)+1;
      }
    }

    if(task.taskType==="wine"&&event.type==="wine"){
      if(task.target===event.name){
        task.progress=(task.progress||0)+1;
      }
    }

    if((task.progress||0)>=task.count){
      task.progress=task.count;
      task.state="可领取";
      pushLog(`<span class="gold">AI系统任务完成：</span>${task.name}`);
    }
  });
}
function claimSystemTask(taskId){
  const task=STATE.system.tasks.find(item=>item.id===taskId);
  if(!task||task.state==="已完成")return;

  if(task.aiGenerated&&task.state!=="可领取"){
    alert("任务尚未完成。");
    return;
  }

  gainReward(task.reward,"AI系统任务");
  task.state="已完成";
  pushLog(`<span class="good">领取 AI 系统任务奖励：</span>${task.name}`);
  saveState();
  render();
}

function runDungeon(type){
  const today=new Date().toDateString();
  const key=today+"_"+type;
  if(STATE.dungeon.used[key])return alert("今日该副本次数已用。");
  STATE.dungeon.used[key]=true;
  const reward={coin:2000*(STATE.player.realm+1),cult:600*(STATE.player.realm+1),items:[[type+"宝箱",1]]};
  if(type==="装备"){
    reward.items=[["装备宝箱",1],["随机装备箱",1]];
  }
  if(type.includes("仙缘")) reward.items.push(["普通仙缘箱",1]);
  if(type.includes("活动")) sendMail("mail_cumulative","dungeon_activity",reward);
  else gainReward(reward,"副本:"+type);
  pushLog(`完成十分钟${type}副本的快速结算。`);
  saveState();
  render();
}

function addPoint(attr){
  if(STATE.player.points<=0)return;
  STATE.player.points--;
  STATE.player.attrs[attr]++;
  if(attr==="耐力"||attr==="抗性") STATE.player.lifeMax+=2;
  saveState();
  render();
}

function buyShopItem(name,price,type="道具",count=1){
  if(STATE.resources.yuanbao<price)return alert("元宝不足。");
  STATE.resources.yuanbao-=price;
  addItem(name,count,type);
  pushUseLog(`商城购买：${name} ×${count}`);
  pushFlow("shop_buy",{name,price,type,count});
  saveState();
  render();
}

function attachmentText(attachment){
  if(!attachment)return"无";
  const list=[];
  if(attachment.coin)list.push("铜币×"+fmt(attachment.coin));
  if(attachment.yuanbao)list.push("元宝×"+fmt(attachment.yuanbao));
  if(attachment.xianyuan)list.push("仙缘×"+fmt(attachment.xianyuan));
  if(attachment.cult)list.push("修为×"+fmt(attachment.cult));
  if(attachment.systemPoint)list.push("系统点×"+fmt(attachment.systemPoint));
  if(attachment.items)list.push(...attachment.items.map(item=>item[0]+"×"+item[1]));
  return list.join("，");
}

function safeRender(){
  const activeElement=document.activeElement;
  const activeId=activeElement&&activeElement.id;
  const activeTag=activeElement&&activeElement.tagName;
  const activeValue=activeElement&&(activeTag==="INPUT"||activeTag==="TEXTAREA"||activeTag==="SELECT")?activeElement.value:null;
  const selectionStart=activeElement&&activeElement.selectionStart;
  const selectionEnd=activeElement&&activeElement.selectionEnd;
  const scrollX=window.scrollX;
  const scrollY=window.scrollY;
  const bagList=document.getElementById("bagItemList");
const bagLog=document.getElementById("bagUseLog");
const homeLog=document.getElementById("homeBattleLog");
const forgeLog=document.getElementById("forgeWorkLog");
const alchemyLog=document.getElementById("alchemyWorkLog");
const tradeList=document.getElementById("tradeListingList");
const tradeMineList=document.getElementById("tradeMineList");

const bagListScroll=bagList?bagList.scrollTop:0;
const bagLogScroll=bagLog?bagLog.scrollTop:0;
const homeLogScroll=homeLog?homeLog.scrollTop:0;
const forgeLogScroll=forgeLog?forgeLog.scrollTop:0;
const alchemyLogScroll=alchemyLog?alchemyLog.scrollTop:0;
const tradeListScroll=tradeList?tradeList.scrollTop:0;
const tradeMineListScroll=tradeMineList?tradeMineList.scrollTop:0;

  render();

  if(activeId){
    const next=document.getElementById(activeId);
    if(next){
      if(activeValue!==null)next.value=activeValue;
      next.focus();
      if(typeof selectionStart==="number"&&typeof selectionEnd==="number"&&next.setSelectionRange){
        next.setSelectionRange(selectionStart,selectionEnd);
      }
    }
  }

  const nextBagList=document.getElementById("bagItemList");
const nextBagLog=document.getElementById("bagUseLog");
const nextHomeLog=document.getElementById("homeBattleLog");
const nextForgeLog=document.getElementById("forgeWorkLog");
const nextAlchemyLog=document.getElementById("alchemyWorkLog");
const nextTradeList=document.getElementById("tradeListingList");
const nextTradeMineList=document.getElementById("tradeMineList");

if(nextBagList)nextBagList.scrollTop=bagListScroll;
if(nextBagLog)nextBagLog.scrollTop=bagLogScroll;
if(nextHomeLog)nextHomeLog.scrollTop=homeLogScroll;
if(nextForgeLog)nextForgeLog.scrollTop=forgeLogScroll;
if(nextAlchemyLog)nextAlchemyLog.scrollTop=alchemyLogScroll;
if(nextTradeList)nextTradeList.scrollTop=tradeListScroll;
if(nextTradeMineList)nextTradeMineList.scrollTop=tradeMineListScroll;

window.scrollTo(scrollX,scrollY);
}
function renderStableAround(anchorId){
  const anchor=document.getElementById(anchorId);
  const oldTop=anchor?anchor.getBoundingClientRect().top:null;

  render();

  if(anchor&&oldTop!==null){
    const nextAnchor=document.getElementById(anchorId);
    if(nextAnchor){
      const newTop=nextAnchor.getBoundingClientRect().top;
      window.scrollBy(0,newTop-oldTop);
    }
  }
}

function getTutorialModal(){
  if(!STATE.tutorial){
    STATE.tutorial={newbieStep:0,pageGuideSeen:{},currentGuide:null};
  }

  if(STATE.tutorial.currentGuide){
    return getPageGuide(STATE.tutorial.currentGuide);
  }

  if(STATE.tutorial.newbieStep===0&&STATE.tab==="主页"){
    return {
      title:"新手教程 1/2",
      body:"先去【活动】页领取【新手礼包】。新手礼包会给你启动资源，别在主页发呆。",
      action:"去活动"

  }

  if(STATE.tutorial.newbieStep===1&&STATE.tab==="主页"){
    return {
      title:"新手教程 2/2",
      body:"新手礼包已经领完了。现在回到主页开始挂机，先把修为和基础资源刷起来。",
      action:"开始挂机"
    };
  }

  return null;
}

function closeTutorialModal(){
  if(!STATE.tutorial){
    STATE.tutorial={newbieStep:0,pageGuideSeen:{},currentGuide:null};
  }

  if(STATE.tutorial.currentGuide){
    STATE.tutorial.currentGuide=null;
    saveState();
    render();
    return;
  }

  if(STATE.tutorial.newbieStep===0&&STATE.tab==="主页"){
    STATE.tutorial.newbieStep=1;
    saveState();
    render();
    return;
  }

  if(STATE.tutorial.newbieStep===1&&STATE.tab==="主页"){
    STATE.tutorial.newbieStep=2;
    saveState();
    render();
    return;
  }
}

function openPage(tab){
  if(!STATE.tutorial){
    STATE.tutorial={newbieStep:0,pageGuideSeen:{},currentGuide:null};
  }

  STATE.tab=tab;

  if(tab!=="主页"&&!STATE.tutorial.pageGuideSeen[tab]){
    STATE.tutorial.pageGuideSeen[tab]=true;
    STATE.tutorial.currentGuide=tab;
  }else{
    STATE.tutorial.currentGuide=null;
  }

  saveState();
  render();
}

function renderBattleScene(monster,monsterHp,monsterMax){
  const bg=getBattleBackground();
  const playerImage=getPlayerBattleImage();
  const monsterImage=monster.image;
  const death=STATE.battleDeath||{};
  const deathAlive=death.nonce&&Date.now()-(death.nonce||0)<1000;
  const visual=STATE.battleVisual||{};
  const nonce=visual.nonce||0;
  const visualAlive=nonce&&Date.now()-(visual.nonce||0)<800;

  const fxKey=visualAlive?(visual.fx||"slash"):"";
  const fxImage=fxKey?(CONFIG.battleAssets.fx[fxKey]||CONFIG.battleAssets.fx.slash):"";

function runBossBattleModal(){
  if(!STATE.bossBattle||STATE.bossBattle.running)return;

  const boss=STATE.bossBattle.boss||currentMonster(true);
  const beforeMap=STATE.progress.map;
  const beforeLogCount=STATE.logs.length;

  STATE.bossBattle.running=true;
  STATE.bossBattle.result=null;
  STATE.bossBattle.logs=[
    `你踏入 Boss 战场，${boss.name} 的威压铺天盖地。`
  ];

  saveState();
  safeRender();

  setTimeout(()=>{
    battle(true);

    const newLogs=STATE.logs
      .slice(0,Math.max(0,STATE.logs.length-beforeLogCount))
      .reverse();

    const bossCleared=!!STATE.progress.clearedZones[`${beforeMap}_boss`];
    const mapChanged=STATE.progress.map!==beforeMap;
    const win=bossCleared||mapChanged;
    const lose=STATE.player.life<=0||STATE.player.dying;

    STATE.bossBattle={
      active:true,
      running:false,
      boss,
      result:win?"win":lose?"lose":"end",
      logs:newLogs.length?newLogs:[win?"Boss 战斗胜利。":lose?"Boss 战斗失败。":"Boss 战斗结束。"]
    };

    saveState();
    render();
  },1200);
}

async function loadTradeListings(keepPage=true){
  if(!STATE.tradeFilter){
    STATE.tradeFilter={keyword:"",itemKind:"all",tradeType:"all",page:1,totalPages:1,total:0,hasUpdate:false,loading:false};
  }

  try{
    STATE.tradeFilter.loading=true;
    saveState();
    safeRender();

    const filter=STATE.tradeFilter;
    const page=keepPage ? (filter.page||1) : 1;

    const query=new URLSearchParams({
      keyword:filter.keyword||"",
      itemKind:filter.itemKind||"all",
      tradeType:filter.tradeType||"all",
      page:String(page)
    });

    const result=await apiRequest("/api/trade/listings?"+query.toString(),{method:"GET"});

    STATE.tradeListings=result.active||[];
    STATE.tradeMine=result.mine||[];
    STATE.tradeFilter.page=result.page||1;
    STATE.tradeFilter.totalPages=result.totalPages||1;
    STATE.tradeFilter.total=result.total||0;
    STATE.tradeFilter.hasUpdate=false;
    STATE.tradeFilter.loading=false;

    saveState();
    safeRender();
  }catch(error){
    STATE.tradeFilter.loading=false;
    saveState();
    safeRender();
    alert(error.message||"读取交易行失败");
  }
}

function isClientTradableEquip(equip){
  return equip&&equip.craftedBy&&equip.identified===false;
}

function isClientTradablePill(item){
  return item&&item.type==="丹药"&&item.craftedBy;
}

function getMyTradableItems(){
  const equips=(STATE.store||[])
    .filter(isClientTradableEquip)
    .map(item=>({
      source:"store",
      id:item.id,
      name:item.name,
      type:"装备",
      count:1,
      item
    }));

  const pills=(STATE.bag||[])
    .filter(isClientTradablePill)
    .map(item=>({
      source:"bag",
      id:item.id,
      name:item.name,
      type:"丹药",
      count:item.count||1,
      item
    }));

  return equips.concat(pills);
}

async function tradeListFixed(source,itemId){
  const price=Number(prompt("请输入一口价价格，单位：元宝"));

  if(!price||price<=0){
    alert("价格必须大于 0。");
    return;
  }

  try{
    await saveAccountState();

    const result=await apiRequest("/api/trade/list",{
      method:"POST",
      body:JSON.stringify({
        source,
        itemId,
        listType:"fixed",
        price
      })
    });

    if(result.playerData){
      STATE=mergeState(createDefaultState(),result.playerData);
      STATE.auth.loggedIn=true;
      STATE.auth.account=result.account||STATE.auth.account;
      STATE.auth.mode="game";
    }

    alert("一口价上架成功。");
    await loadTradeListings();
  }catch(error){
    alert(error.message||"上架失败");
  }
}

async function tradeListAuction(source,itemId){
  const basePrice=Number(prompt("请输入竞拍底价，单位：元宝"));
  if(!basePrice||basePrice<=0){
    alert("底价必须大于 0。");
    return;
  }

  const bidStep=Number(prompt("请输入每次加价区间，单位：元宝"));
  if(!bidStep||bidStep<=0){
    alert("每次加价必须大于 0。");
    return;
  }

  const durationHours=Number(prompt("请输入竞拍时间，只能填 1、3、8、12"));
  if(![1,3,8,12].includes(durationHours)){
    alert("竞拍时间只能是 1、3、8、12 小时。");
    return;
  }

  try{
    await saveAccountState();

    const result=await apiRequest("/api/trade/list",{
      method:"POST",
      body:JSON.stringify({
        source,
        itemId,
        listType:"auction",
        basePrice,
        bidStep,
        durationHours
      })
    });

    if(result.playerData){
      STATE=mergeState(createDefaultState(),result.playerData);
      STATE.auth.loggedIn=true;
      STATE.auth.account=result.account||STATE.auth.account;
      STATE.auth.mode="game";
    }

    alert("竞拍上架成功。");
    await loadTradeListings();
  }catch(error){
    alert(error.message||"竞拍上架失败");
  }
}

function getSectById(sectId){
  return CONFIG.sects.find(sect=>sect.id===sectId);
}

function getNpcById(npcId){
  for(const sect of CONFIG.sects){
    const npc=sect.npcs.find(item=>item.id===npcId);
    if(npc)return {...npc,sectId:sect.id,sectName:sect.name};
  }
  return null;
}

function getNpcFavor(npcId){
  if(!STATE.sect)STATE.sect={joined:null,favor:{},dailyTalk:{},tasks:[],selectedNpc:null};
  return STATE.sect.favor[npcId]||0;
}

function addNpcFavor(npcId,amount){
  if(!STATE.sect)STATE.sect={joined:null,favor:{},dailyTalk:{},tasks:[],selectedNpc:null};
  STATE.sect.favor[npcId]=Math.max(0,Math.min(100,(STATE.sect.favor[npcId]||0)+amount));
}

function joinSect(sectId){
  if(STATE.sect?.joined){
    alert("你已经加入宗门，当前版本暂不支持更换宗门。");
    return;

  const sect=getSectById(sectId);

  STATE.sect.selectedNpc=sect.npcs[0].id;

  pushLog(`<span class="gold">你加入了${sect.name}。</span>`);
  saveState();
  render();
}

async function talkSectNpc(npcId,action="闲聊",playerText=""){
  const npc=getNpcById(npcId);
  if(!npc)return;

  const sect=getSectById(npc.sectId);
  const today=new Date().toDateString();
  const key=today+"_"+npcId;

  if(action==="闲聊"&&STATE.sect.dailyTalk[key]){
    alert("今日已经与该 NPC 闲聊过。");
    return;
  }

  try{
    if(!STATE.sect.aiLoading){
      STATE.sect.aiLoading={};
    }

    STATE.sect.aiLoading[npcId]=true;
    saveState();
    safeRender();

    const result=await apiRequest("/api/ai/sect-chat",{
      method:"POST",
      body:JSON.stringify({
        npc,
        sect,
        action,
        playerText,
        favor:getNpcFavor(npcId)
      })
    });

    const data=result.result;
    const delta=Number(data.favorDelta||0);

    addNpcFavor(npcId,delta);

    if(action==="闲聊"){
      STATE.sect.dailyTalk[key]=true;
    }

    STATE.sect.lastDialogues=STATE.sect.lastDialogues||{};
    STATE.sect.lastDialogues[npcId]={
      text:data.dialogue,
      mood:data.mood,
      favorDelta:delta,
      reason:data.reason,
      time:now()
    };

    pushLog(`<span class="cyan">${npc.name}：</span>${escapeHtml(data.dialogue)} ${
      delta>0?`<span class="good">好感 +${delta}</span>`:
      delta<0?`<span class="bad">好感 ${delta}</span>`:
      `<span class="muted">好感不变</span>`
    }`);

    pushUseLog(`宗门互动：${npc.name}｜${action}｜好感变化 ${delta}`);

    STATE.sect.aiLoading[npcId]=false;
    saveState();
    safeRender();
  }catch(error){
    if(STATE.sect.aiLoading){
      STATE.sect.aiLoading[npcId]=false;
    }

    saveState();
    safeRender();
    alert(error.message||"宗门 NPC 对话失败");
  }
}

function getSectTaskChance(npcId){
  const favor=getNpcFavor(npcId);
  return Math.min(.90,.30+favor*.006);
}

function createSectTask(npc){
  const favor=getNpcFavor(npc.id);
  const difficulty=favor>=60?"hard":favor>=25?"normal":"easy";

  let type="killAny";
  let count=8;
  let title=npc.taskTheme;
  let description=`完成 ${npc.name} 交付的宗门委托。`;

  if(npc.role==="宗主"){
    type="killAny";
    count=difficulty==="hard"?36:difficulty==="normal"?24:12;
    description=`击败 ${count} 只怪物，证明你没有辱没宗门之名。`;
  }else if(npc.role==="长老"){
    if(npc.sectId==="xuandan"){
      type="alchemyAny";
      count=difficulty==="hard"?5:difficulty==="normal"?3:1;
      description=`炼制丹药 ${count} 次，接受丹道考校。`;
    }else if(npc.sectId==="xinghe"){
      type="killAny";
      count=difficulty==="hard"?30:difficulty==="normal"?18:10;
      description=`完成 ${count} 次实战推演，验证星阵推算。`;
    }else{
      type="killAny";
      count=difficulty==="hard"?30:difficulty==="normal"?18:10;
      description=`击败 ${count} 只怪物，完成传功试炼。`;
    }
  }else if(npc.role==="师哥"){
    type="killAny";
    count=difficulty==="hard"?28:difficulty==="normal"?16:8;
    description=`随 ${npc.name} 的委托击败 ${count} 只怪物。`;
  }else if(npc.role==="师姐"){
    if(npc.sectId==="xuandan"){
      type="alchemyAny";
      count=difficulty==="hard"?6:difficulty==="normal"?3:1;
      description=`完成 ${count} 次炼丹，参加${npc.name}的斗丹试炼。`;
    }else{
      type="killAny";
      count=difficulty==="hard"?24:difficulty==="normal"?14:8;
      description=`完成 ${count} 次修行战斗，接受${npc.name}的检验。`;
    }
  }else if(npc.role==="师弟"){
    type=npc.sectId==="xuandan"?"collectMaterial":"killAny";
    count=difficulty==="hard"?12:difficulty==="normal"?8:4;
    description=type==="collectMaterial"
      ? `提交任意普通材料 ${count} 份，帮助${npc.name}整理采药记录。`
      : `击败 ${count} 只怪物，陪${npc.name}完成历练。`;
  }else if(npc.role==="师妹"){
    if(npc.sectId==="xuandan"){
      type="alchemyAny";
      count=difficulty==="hard"?4:difficulty==="normal"?2:1;
      description=`帮${npc.name}完成 ${count} 次试丹炼制。`;
    }else if(npc.sectId==="xinghe"){
      type="killAny";
      count=difficulty==="hard"?20:difficulty==="normal"?12:6;
      description=`陪${npc.name}完成星灯探索，击败 ${count} 只怪物。`;
    }else{
      type="killAny";
      count=difficulty==="hard"?18:difficulty==="normal"?10:5;
      description=`帮${npc.name}采集药庐线索，击败 ${count} 只怪物。`;
    }
  }

  return {
    id:uid("sect_task"),
    npcId:npc.id,
    npcName:npc.name,
    sectId:npc.sectId,
    sectName:npc.sectName,
    title,
    description,
    type,
    count,
    progress:0,
    state:"进行中",
    difficulty,
    created:now()
  };
}

async function requestSectNpcTask(npcId){
  const npc=getNpcById(npcId);
  if(!npc)return;

  const sect=getSectById(npc.sectId);

  if(STATE.sect.tasks.some(task=>task.npcId===npcId&&task.state==="进行中")){
    alert("该 NPC 已有一个进行中的任务。");
    return;
  }

  try{
    if(!STATE.sect.aiLoading){
      STATE.sect.aiLoading={};
    }

    STATE.sect.aiLoading[npcId]=true;
    saveState();
    safeRender();

    const result=await apiRequest("/api/ai/sect-chat",{
      method:"POST",
      body:JSON.stringify({
        npc,
        sect,
        action:"请求宗门任务",
        playerText:"弟子想向你请一件合适的宗门委托。",
        favor:getNpcFavor(npcId)
      })
    });

    const data=result.result;
    const delta=Number(data.favorDelta||0);
    addNpcFavor(npcId,delta);

    STATE.sect.lastDialogues=STATE.sect.lastDialogues||{};
    STATE.sect.lastDialogues[npcId]={
      text:data.dialogue,
      mood:data.mood,
      favorDelta:delta,
      reason:data.reason,
      time:now()
    };

    pushLog(`<span class="cyan">${npc.name}：</span>${escapeHtml(data.dialogue)} ${
      delta>0?`<span class="good">好感 +${delta}</span>`:
      delta<0?`<span class="bad">好感 ${delta}</span>`:
      `<span class="muted">好感不变</span>`
    }`);

    if(data.allowTask){
      const task=createSectTask(npc);
      STATE.sect.tasks.unshift(task);
      STATE.sect.tasks=STATE.sect.tasks.slice(0,30);
      pushLog(`<span class="gold">${npc.name} 发布宗门任务：</span>${task.description}`);
    }else{
      pushLog(`<span class="muted">${npc.name} 暂时没有把委托交给你。</span>`);
    }

    STATE.sect.aiLoading[npcId]=false;
    saveState();
    safeRender();
  }catch(error){
    if(STATE.sect.aiLoading){
      STATE.sect.aiLoading[npcId]=false;
    }

    saveState();
    safeRender();
    alert(error.message||"请求宗门任务失败");
  }
}

function getSectTaskReward(task){
  const npc=getNpcById(task.npcId);
  const favor=getNpcFavor(task.npcId);
  const difficultyRate={easy:1,normal:1.8,hard:3}[task.difficulty]||1;
  const realmRate=STATE.player.realm+1;

  const reward={
    coin:Math.floor(800*realmRate*difficultyRate),
    yuanbao:Math.floor(60*difficultyRate),
    items:[]
  };

  if(!npc)return reward;

  if(npc.sectId==="qinglan"){
    if(npc.role==="宗主"){
      reward.yuanbao+=120;
      reward.items.push(["功法残卷",Math.ceil(3*difficultyRate)]);
      reward.items.push(["锻造石",Math.ceil(8*difficultyRate)]);
    }else if(npc.role==="长老"){
      reward.cult=Math.floor(600*realmRate*difficultyRate);
      reward.items.push(["功法残卷",Math.ceil(2*difficultyRate)]);
    }else if(npc.role==="师哥"){
      reward.items.push(["锻造石",Math.ceil(10*difficultyRate)]);
      reward.items.push(["普通生命晶石",Math.ceil(2*difficultyRate)]);
    }else if(npc.role==="师姐"){
      reward.cult=Math.floor(500*realmRate*difficultyRate);
      reward.items.push(["续命丹",1]);
    }else if(npc.role==="师弟"){
      reward.items.push(["随机材料包",Math.ceil(1*difficultyRate)]);
    }else{
      reward.items.push(["回春丹",Math.ceil(2*difficultyRate)]);
      reward.items.push(["普通生命晶石",Math.ceil(2*difficultyRate)]);
    }
  }

  if(npc.sectId==="xuandan"){
    if(npc.role==="宗主"){
      reward.yuanbao+=180;
      reward.items.push(["随机材料包",Math.ceil(3*difficultyRate)]);
      reward.items.push(["续命丹",1]);
    }else if(npc.role==="长老"){
      reward.items.push(["随机材料包",Math.ceil(4*difficultyRate)]);
      reward.items.push(["回春丹",Math.ceil(2*difficultyRate)]);
    }else if(npc.role==="师哥"){
      reward.items.push(["普通生命晶石",Math.ceil(5*difficultyRate)]);
      reward.items.push(["续命丹",1]);
    }else if(npc.role==="师姐"){
      reward.items.push(["功法残卷",Math.ceil(2*difficultyRate)]);
      reward.items.push(["双倍修行丹",1]);
    }else if(npc.role==="师弟"){
      reward.items.push(["随机材料包",Math.ceil(4*difficultyRate)]);
    }else{
      reward.items.push(["随机灵石",Math.ceil(2*difficultyRate)]);
      reward.items.push(["回春丹",Math.ceil(2*difficultyRate)]);
    }
  }

  if(npc.sectId==="xinghe"){
    reward.systemPoint=Math.floor(8*difficultyRate+favor/20);

    if(npc.role==="宗主"){
      reward.systemPoint+=12;
      reward.items.push(["神技残卷",Math.ceil(1*difficultyRate)]);
    }else if(npc.role==="长老"){
      reward.systemPoint+=8;
      if(chance(.08+difficultyRate*.03)){
        reward.items.push(["心法玉简",1]);
      }else{
        reward.items.push(["功法残卷",Math.ceil(2*difficultyRate)]);
      }
    }else if(npc.role==="师哥"){
      reward.items.push(["随机灵石",Math.ceil(2*difficultyRate)]);
      reward.items.push(["功法残卷",Math.ceil(1*difficultyRate)]);
    }else if(npc.role==="师姐"){
      reward.cult=Math.floor(700*realmRate*difficultyRate);
      reward.items.push(["心法玉简",chance(.06*difficultyRate)?1:0]);
      reward.items=reward.items.filter(item=>item[1]>0);
    }else if(npc.role==="师弟"){
      reward.items.push(["随机灵石",Math.ceil(3*difficultyRate)]);
    }else{
      reward.yuanbao+=80;
      reward.items.push(["功法残卷",Math.ceil(2*difficultyRate)]);
    }
  }

  return reward;
}

function updateSectTaskProgress(event){
  if(!STATE.sect?.tasks?.length)return;

  STATE.sect.tasks.forEach(task=>{
    if(task.state!=="进行中")return;

    if(task.type==="killAny"&&event.type==="kill"){
      task.progress++;
    }

    if(task.type==="forgeAny"&&event.type==="forge"){
      task.progress++;
    }

    if(task.type==="alchemyAny"&&event.type==="alchemy"){
      task.progress++;
    }

    if(task.progress>=task.count){
      task.progress=task.count;
      task.state="可领取";
      pushLog(`<span class="gold">宗门任务完成：</span>${task.title}（${task.npcName}）`);
    }
  });
}

function tryCompleteCollectMaterialTask(taskId){
  const task=STATE.sect.tasks.find(item=>item.id===taskId);
  if(!task||task.type!=="collectMaterial"||task.state!=="进行中")return;

  const totalMaterials=STATE.bag
    .filter(item=>item.type==="材料")
    .reduce((sum,item)=>sum+(item.count||0),0);

  if(totalMaterials<task.count){
    alert(`普通材料不足，需要 ${task.count} 份。当前 ${totalMaterials} 份。`);
    return;
  }

  let need=task.count;

  STATE.bag.forEach(item=>{
    if(need<=0)return;
    if(item.type!=="材料")return;
    const use=Math.min(need,item.count||0);
    item.count-=use;
    need-=use;
  });

  cleanBag();
  task.progress=task.count;
  task.state="可领取";

  pushLog(`<span class="gold">宗门材料委托已完成：</span>${task.title}`);
  saveState();
  render();
}

function claimSectTask(taskId){
  const task=STATE.sect.tasks.find(item=>item.id===taskId);
  if(!task)return;

  if(task.state!=="可领取"){
    alert("任务尚未完成。");
    return;
  }

  const reward=getSectTaskReward(task);
  gainReward(reward,"宗门任务:"+task.title);

  task.state="已完成";
  addNpcFavor(task.npcId,3);

  pushLog(`<span class="good">领取宗门任务奖励：</span>${task.title}，${task.npcName} 好感 +3。`);
  saveState();
  render();
}
function renderSect(){
  if(!STATE.sect){
    STATE.sect={joined:null,favor:{},dailyTalk:{},tasks:[],selectedNpc:null};
  }

  if(!STATE.sect.joined){
    return `<div class="panel">
      <h2>宗门</h2>
      <p class="cyan">请选择一个宗门加入。当前版本加入后暂不支持更换宗门。</p>

      <div class="cards">
        ${CONFIG.sects.map(sect=>`<div class="card" style="max-width:420px">
          <h3>${sect.name}</h3>
          <p class="gold">${sect.type}</p>
          <p>${sect.description}</p>
          <p class="muted">${sect.bonus}</p>
          <button onclick="joinSect('${sect.id}')">加入${sect.name}</button>
        </div>`).join("")}
      </div>
    </div>`;
  }

  const sect=getSectById(STATE.sect.joined);
  if(!sect)return `<div class="panel"><h2>宗门异常</h2><p>宗门数据不存在。</p></div>`;

  if(!STATE.sect.selectedNpc){
    STATE.sect.selectedNpc=sect.npcs[0].id;
  }

  const selectedNpc=getNpcById(STATE.sect.selectedNpc)||{...sect.npcs[0],sectId:sect.id,sectName:sect.name};
  const favor=getNpcFavor(selectedNpc.id);
  const taskChance=Math.round(getSectTaskChance(selectedNpc.id)*100);
  const today=new Date().toDateString();
  const talkedToday=!!STATE.sect.dailyTalk[today+"_"+selectedNpc.id];
  const npcTasks=STATE.sect.tasks.filter(task=>task.npcId===selectedNpc.id);
const lastDialogue=STATE.sect.lastDialogues?.[selectedNpc.id];
const npcLoading=!!STATE.sect.aiLoading?.[selectedNpc.id];

  return `<div class="panel">
    <h2>${sect.name}</h2>
    <p class="cyan">${sect.description}</p>
    <p class="muted">${sect.bonus}</p>

    <div class="sect-npc-layout">
      <div class="card" style="max-width:280px">
        <h3>宗门人物</h3>
        <div class="list">
          ${sect.npcs.map(npc=>`<div class="item" onclick="selectSectNpc('${npc.id}')" style="cursor:pointer;border-color:${STATE.sect.selectedNpc===npc.id?'var(--gold)':'#2b3858'}">
  <div class="sect-npc-list-item">
    <img class="sect-npc-list-avatar" src="${npc.portrait||''}" onerror="this.style.display='none'">
    <div>
      <b>${npc.role} · ${npc.name}</b><br>
      <span class="muted">好感：${getNpcFavor(npc.id)}/100</span>
    </div>
  </div>
</div>`).join("")}
        </div>
      </div>

      <div class="card" style="max-width:560px">
        <h3>${selectedNpc.role} · ${selectedNpc.name}</h3>
        <p class="gold">${selectedNpc.personality}</p>
        <p><b>说话风格：</b>${selectedNpc.speechStyle}</p>
        <p><b>背景：</b>${selectedNpc.background}</p>
        <p><b>与你关系：</b>${selectedNpc.relation}</p>
        <p><b>任务倾向：</b>${selectedNpc.taskTheme}</p>
        <p><b>奖励倾向：</b>${selectedNpc.rewardStyle}</p>

        <hr>

        <div class="kv">
          <b>好感度</b><span>${favor}/100</span>
          <b>委托倾向</b><span>好感越高，AI 越可能交付任务（参考值：${taskChance}%）</span>
          <b>今日互动</b><span>${talkedToday?"已互动":"未互动"}</span>
        </div>

        <div class="bar"><span style="width:${favor}%"></span></div>

        <p class="cyan">“${selectedNpc.greeting}”</p>

        ${lastDialogue?`
  <div class="card" style="max-width:none">
    <h3>最近对话</h3>
    <p class="cyan">${selectedNpc.name}：${escapeHtml(lastDialogue.text)}</p>
    <p class="muted">情绪：${lastDialogue.mood} ｜ 好感变化：${lastDialogue.favorDelta>0?"+"+lastDialogue.favorDelta:lastDialogue.favorDelta} ｜ ${lastDialogue.reason||""}</p>
  </div>
`:""}

<div class="row">
  <button ${talkedToday||npcLoading?"disabled":""} onclick="talkSectNpc('${selectedNpc.id}','闲聊','')">
    ${npcLoading?"对话中...":talkedToday?"今日已闲聊":"闲聊"}
  </button>

  <button ${npcLoading?"disabled":""} onclick="talkSectNpc('${selectedNpc.id}','请教修行','弟子想向你请教修行上的困惑。')">
    请教修行
  </button>

  <button ${npcLoading?"disabled":""} onclick="talkSectNpc('${selectedNpc.id}','表达亲近','弟子很敬佩你，想与你多亲近一些。')">
    表达亲近
  </button>

  <button ${npcLoading?"disabled":""} onclick="requestSectNpcTask('${selectedNpc.id}')">
    请求宗门任务
  </button>
</div>
      </div>
<div class="card sect-npc-portrait-card">
  <div class="sect-npc-portrait-wrap">
    <img class="sect-npc-portrait" src="${selectedNpc.portrait||''}" onerror="this.style.display='none'">
    <div class="sect-npc-portrait-name">
      <h3>${selectedNpc.name}</h3>
      <p class="muted">${sect.name} · ${selectedNpc.role}</p>
    </div>
  </div>

  <div class="sect-npc-dialogue-box">
    ${lastDialogue?`
      <span class="cyan">${selectedNpc.name}：</span>${escapeHtml(lastDialogue.text)}
      <br>
      <span class="muted">情绪：${lastDialogue.mood} ｜ 好感变化：${lastDialogue.favorDelta>0?"+"+lastDialogue.favorDelta:lastDialogue.favorDelta}</span>
    `:`
      <span class="cyan">${selectedNpc.name}：</span>${selectedNpc.greeting}
    `}
  </div>
</div>
      <div class="card" style="max-width:360px">
        <h3>${selectedNpc.name} 的任务</h3>
        <div class="list">
          ${npcTasks.length?npcTasks.map(task=>`<div class="item">
            <b>${task.title}</b>
            <span class="muted">｜${task.state}</span>
            <p>${task.description}</p>
            <p class="cyan">进度：${task.progress}/${task.count} ｜ 难度：${task.difficulty}</p>

            ${task.type==="collectMaterial"&&task.state==="进行中"?`<button onclick="tryCompleteCollectMaterialTask('${task.id}')">提交普通材料</button>`:""}
            <button ${task.state==="可领取"?"":"disabled"} onclick="claimSectTask('${task.id}')">${task.state==="已完成"?"已完成":"领取奖励"}</button>
          </div>`).join(""):"<span class='muted'>暂无该 NPC 的任务。</span>"}
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>全部宗门任务</h3>
      <div class="list">
        ${STATE.sect.tasks.length?STATE.sect.tasks.map(task=>`<div class="item">
          <b>${task.npcName}：</b>${task.title}
          <span class="muted">｜${task.state}</span>
          <p>${task.description}</p>
          <p>进度：${task.progress}/${task.count}</p>
        </div>`).join(""):"<span class='muted'>暂无宗门任务。</span>"}
      </div>
    </div>
  </div>`;
}

function renderDaily(){
  return `<div class="panel">
    <h2>日常</h2>
    <p>第一阶段占位。后续实现每日任务、周常任务、活跃度奖励。活动类日常奖励仍必须通过邮件发放。</p>
  </div>`;
}

setInterval(()=>{
  if(STATE.auth?.loggedIn&&STATE.player?.created){
    saveAccountState();
  }
},30000);
render();
restoreServerSession().then(()=>{
  if(STATE.ui?.bgmEnabled){
    startBgmRewardTimer();
  }
});
</script>
