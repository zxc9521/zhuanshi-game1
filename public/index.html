<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>转世之修仙系统</title>
<style>
:root{
  --bg:#090b12;--panel:#121826;--panel2:#182033;--panel3:#101725;--line:#26324d;
  --text:#d9e6ff;--muted:#8fa3c8;--gold:#ffd36a;--red:#ff6b6b;
  --green:#7dff9e;--cyan:#77e6ff;--purple:#d997ff;--orange:#ffb86c;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#18223a,#070911 55%);color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid #405073;background:#1c2740;color:var(--text);border-radius:8px;padding:7px 10px;margin:2px}
button:hover{background:#28375a}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{background:#101827;color:var(--text);border:1px solid #405073;border-radius:7px;padding:6px}
.app{max-width:1480px;margin:auto;padding:12px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px;background:linear-gradient(90deg,#101827,#17223a);border:1px solid var(--line);border-radius:14px}
.title{font-size:24px;font-weight:800;color:var(--gold)}
.notice{font-size:13px;color:var(--cyan);line-height:1.5}
.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#24314f;border:1px solid #405073;margin:2px;color:#dce8ff}
.warn{color:var(--orange)}
.grid{display:grid;grid-template-columns:210px 1fr;gap:12px;margin-top:12px}
.nav{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;position:sticky;top:8px;height:max-content}
.nav button{display:block;width:100%;margin:5px 0;text-align:left}
.nav button.active{background:#31446f;border-color:#6b85c8;color:#fff}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.subnav button.active{background:#40588e;border-color:#7f9fea}
.main{min-height:720px}
.panel{background:rgba(18,24,38,.94);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
h2,h3{margin:0 0 10px;color:#fff}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;font-size:14px}
.log{height:310px;overflow:auto;background:#080c14;border:1px solid #25314c;border-radius:10px;padding:8px;font-size:13px;line-height:1.65}
.small-log{height:220px;overflow:auto;background:#080c14;border:1px solid #25314c;border-radius:10px;padding:8px;font-size:13px;line-height:1.65}
.log .crit{color:var(--gold)}.log .bad{color:var(--red)}.log .good{color:var(--green)}.log .blue{color:var(--cyan)}
.list{max-height:430px;overflow:auto}
.item{padding:8px;border:1px solid #2b3858;border-radius:10px;background:#11192a;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{float:right}
.muted{color:var(--muted)}
.gold{color:var(--gold)}.red{color:var(--red)}.green{color:var(--green)}.cyan{color:var(--cyan)}.purple{color:var(--purple)}
.q0{color:#9aa6b2}.q1{color:#e8e8e8}.q2{color:#74ff92}.q3{color:#6bb9ff}.q4{color:#c47cff}.q5{color:#ffbc52}.q6{color:#ff6df2}
.bar{height:12px;background:#0a0f1b;border:1px solid #293653;border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#51d27a,#ffd36a)}
.hpbar>span{background:linear-gradient(90deg,#ff5353,#ffb86c)}
.map-hero{
  position:relative;
  overflow:hidden;
  border-radius:14px;
  border:1px solid var(--line);
  margin-bottom:12px;
  min-height:360px;
  background:#0b101b;
}
.map-bg-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.55;
  filter:saturate(.95) contrast(1.08);
  transform:scale(1.02);
  z-index:0;
}
.map-hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at center,rgba(9,11,18,.08),rgba(9,11,18,.08) 70%),
    linear-gradient(180deg,rgba(9,11,18,.22),rgba(9,11,18,.68));
}
.map-hero-content{
  position:relative;
  z-index:1;
  padding:12px;
}
.map-hero .card{
  background:rgba(18,32,51,.68);
  border:1px solid rgba(119,230,255,.22);
  backdrop-filter:blur(6px);
  box-shadow:0 8px 24px rgba(0,0,0,.22);
}

.map-hero .card:hover{
  background:rgba(24,40,65,.78);
  border-color:rgba(119,230,255,.36);
}
.map-title-line{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.map-name{
  font-size:22px;
  font-weight:800;
  color:var(--gold);
  text-shadow:0 2px 8px rgba(0,0,0,.55);
}
.map-subtitle{
  color:var(--cyan);
  font-size:13px;
}
.monster-art{
  width:100%;
  max-height:260px;
  object-fit:contain;
  display:block;
  margin:6px auto 10px;
  background:radial-gradient(circle at center,rgba(119,230,255,.08),rgba(0,0,0,0));
  border-radius:12px;
}
.monster-art-missing{
  height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px dashed #405073;
  border-radius:12px;
  color:var(--muted);
  background:#0b101b;
  margin:6px 0 10px;
}
.battle-scene{
  position:relative;
  height:220px;
  margin-top:10px;
  border:1px solid rgba(119,230,255,.22);
  border-radius:12px;
  overflow:hidden;
  background:#080c14;
  box-shadow:inset 0 0 28px rgba(0,0,0,.45);
}

.battle-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.82;
  filter:saturate(.92) contrast(1.05);
}

.battle-vignette{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at center,rgba(0,0,0,0),rgba(0,0,0,.55) 80%),
    linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.45));
  pointer-events:none;
}

.battle-unit{
  position:absolute;
  bottom:16px;
  width:34%;
  height:72%;
  object-fit:contain;
  filter:drop-shadow(0 10px 12px rgba(0,0,0,.55));
  z-index:2;
}

.battle-player{
  left:4%;
}

.battle-monster{
  right:4%;
  transform:scaleX(-1);
}
.battle-monster-dead{
  position:absolute;
  right:4%;
  bottom:16px;
  width:34%;
  height:72%;
  object-fit:contain;
  z-index:3;
  filter:drop-shadow(0 10px 12px rgba(0,0,0,.55));
  transform-origin:70% 90%;
  animation:monsterDeathFall .9s ease-out forwards;
  pointer-events:none;
}

@keyframes monsterDeathFall{
  0%{
    opacity:1;
    transform:scaleX(-1) rotate(0deg) translateY(0) scale(1);
    filter:drop-shadow(0 10px 12px rgba(0,0,0,.55)) brightness(1);
  }
  45%{
    opacity:.78;
    transform:scaleX(-1) rotate(58deg) translateY(16px) scale(.96);
    filter:drop-shadow(0 5px 8px rgba(0,0,0,.45)) brightness(.82);
  }
  100%{
    opacity:0;
    transform:scaleX(-1) rotate(82deg) translateY(34px) scale(.88);
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.25)) brightness(.45);
  }
}

.battle-fx{
  position:absolute;
  width:34%;
  height:70%;
  object-fit:contain;
  left:50%;
  top:46%;
  transform:translate(-50%,-50%);
  z-index:4;
  opacity:0;
  pointer-events:none;
}

.battle-fx.play{
  animation:battleFxFlash .55s ease-out;
}

@keyframes battleFxFlash{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.75) rotate(-6deg)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.25) rotate(4deg)}
}

.battle-nameplate{
  position:absolute;
  z-index:5;
  top:8px;
  left:8px;
  right:8px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
}

.battle-name{
  padding:4px 7px;
  border:1px solid rgba(64,80,115,.75);
  border-radius:999px;
  background:rgba(8,12,20,.68);
  color:var(--text);
}

.battle-mini-hp{
  position:absolute;
  z-index:5;
  height:7px;
  border:1px solid rgba(0,0,0,.5);
  border-radius:99px;
  background:rgba(0,0,0,.45);
  overflow:hidden;
}

.battle-mini-hp span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#ff5353,#ffb86c);
}

.battle-player-hp{
  left:8px;
  bottom:8px;
  width:34%;
}

.battle-monster-hp{
  right:8px;
  bottom:8px;
  width:34%;
}

.battle-float-text{
  position:absolute;
  z-index:6;
  left:50%;
  top:34%;
  transform:translateX(-50%);
  color:var(--gold);
  font-weight:800;
  text-shadow:0 2px 8px rgba(0,0,0,.8);
  opacity:0;
  pointer-events:none;
}

.battle-float-text.play{
  animation:battleTextFloat .7s ease-out;
}

@keyframes battleTextFloat{
  0%{opacity:0;transform:translate(-50%,10px) scale(.9)}
  25%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-24px) scale(1.08)}
}
.equip-icon{
  position:relative;
  width:72px;
  height:72px;
  flex:0 0 auto;
  display:inline-block;
  border-radius:10px;
  background:rgba(5,8,14,.62);
  box-shadow:inset 0 0 18px rgba(0,0,0,.35),0 4px 12px rgba(0,0,0,.25);
  overflow:hidden;
  vertical-align:middle;
}

.equip-icon.large{
  width:96px;
  height:96px;
}

.equip-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.equip-layer.material{
  opacity:.48;
  mix-blend-mode:screen;
}

.equip-layer.frame{
  z-index:3;
}

.equip-layer.grade{
  z-index:4;
}

.equip-layer.fx{
  z-index:5;
}

.equip-layer.unidentified{
  z-index:6;
}

.equip-line{
  display:flex;
  gap:10px;
  align-items:center;
}

.equip-info{
  min-width:0;
}
.equip-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
  gap:10px;
  align-items:start;
}

.equip-grid-cell{
  position:relative;
  min-height:88px;
  border:1px solid rgba(64,80,115,.7);
  border-radius:12px;
  background:rgba(10,15,26,.72);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px;
  transition:.15s;
}

.equip-grid-cell:hover{
  border-color:rgba(119,230,255,.55);
  background:rgba(18,32,51,.78);
  transform:translateY(-1px);
}

.equip-grid-cell .equip-icon{
  width:64px;
  height:64px;
}

.equip-tooltip{
  display:none;
  position:absolute;
  left:50%;
top:76px;
transform:translateX(-50%);
  z-index:50;
  width:300px;
  max-width:80vw;
  padding:10px;
  border:1px solid rgba(119,230,255,.38);
  border-radius:12px;
  background:rgba(8,12,20,.96);
  box-shadow:0 12px 30px rgba(0,0,0,.45);
  pointer-events:none;
}

.equip-grid-cell:hover .equip-tooltip{
  display:block;
}

.equip-tooltip-title{
  font-weight:800;
  margin-bottom:6px;
}

.equip-tooltip-line{
  font-size:13px;
  line-height:1.6;
}

.equip-mobile-mask{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.58);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
}

.equip-mobile-dialog{
  width:min(420px,96vw);
  max-height:80vh;
  overflow:auto;
  border:1px solid rgba(119,230,255,.38);
  border-radius:14px;
  background:rgba(12,18,30,.98);
  box-shadow:0 16px 42px rgba(0,0,0,.55);
  padding:12px;
}

.equip-mobile-actions{
  display:flex;
  justify-content:flex-end;
  margin-top:10px;
}
.item-icon{
  position:relative;
  width:42px;
  height:42px;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  background:rgba(5,8,14,.62);
  box-shadow:inset 0 0 12px rgba(0,0,0,.35);
  overflow:hidden;
  vertical-align:middle;
}

.item-icon.large{
  width:64px;
  height:64px;
}

.item-icon img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.item-icon-stack{
  position:relative;
  width:42px;
  height:42px;
  flex:0 0 auto;
}

.item-icon-stack.large{
  width:64px;
  height:64px;
}

.item-icon-stack img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
}

.item-quality-overlay{
  pointer-events:none;
  opacity:.85;
}

.item-line{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.item-line-text{
  min-width:0;
  overflow:hidden;
}

.reward-list{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin:6px 0;
}

.reward-chip{
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 7px;
  border:1px solid rgba(64,80,115,.7);
  border-radius:10px;
  background:rgba(10,15,26,.55);
}

.resource-icon{
  width:20px;
  height:20px;
  object-fit:contain;
  vertical-align:middle;
  margin-right:4px;
}

.shop-good{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.forge-cost-line{
  display:flex;
  align-items:center;
  gap:8px;
  margin:6px 0;
}
.forge-layout{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:12px;
}

.forge-sidebar{
  background:rgba(10,15,26,.72);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.forge-category{
  margin-bottom:8px;
}

.forge-category-title{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#1c2740;
  border:1px solid #405073;
  border-radius:10px;
  padding:9px 10px;
  color:var(--text);
}

.forge-category-title.active{
  background:#31446f;
  border-color:#6b85c8;
}

.forge-slot-list{
  margin-top:8px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.forge-slot-btn{
  text-align:center;
  padding:8px 6px;
  border-radius:9px;
  border:1px solid rgba(64,80,115,.75);
  background:rgba(18,32,51,.7);
}

.forge-slot-btn.active{
  border-color:var(--gold);
  background:rgba(80,62,28,.62);
  color:var(--gold);
}

.forge-preview{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:12px;
  align-items:start;
}

.forge-stat-range{
  padding:7px 9px;
  border:1px solid rgba(64,80,115,.7);
  border-radius:9px;
  background:rgba(8,12,20,.45);
  margin:5px 0;
}

.forge-blue-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:6px;
}

.forge-blue-item{
  padding:7px 8px;
  border:1px solid rgba(119,230,255,.18);
  border-radius:9px;
  background:rgba(8,18,28,.55);
}

.forge-cost-card{
  padding:9px;
  border:1px solid rgba(255,211,106,.25);
  border-radius:10px;
  background:rgba(35,28,12,.35);
  margin-bottom:10px;
}

.material-hover{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:6px;
}

.material-tooltip{
  display:none;
  position:absolute;
  left:0;
  top:48px;
  z-index:80;
  width:260px;
  padding:9px 10px;
  border:1px solid rgba(119,230,255,.32);
  border-radius:10px;
  background:rgba(8,12,20,.96);
  box-shadow:0 10px 28px rgba(0,0,0,.45);
  font-size:13px;
  line-height:1.55;
  pointer-events:none;
}

.material-hover:hover .material-tooltip{
  display:block;
}

.craft-layout{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:12px;
}

.craft-sidebar{
  background:rgba(10,15,26,.72);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.craft-category-title{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#1c2740;
  border:1px solid #405073;
  border-radius:10px;
  padding:9px 10px;
  color:var(--text);
}

.craft-category-title.active{
  background:#31446f;
  border-color:#6b85c8;
}

.craft-item-list{
  margin-top:8px;
  display:grid;
  grid-template-columns:1fr;
  gap:6px;
}

.craft-item-btn{
  text-align:left;
  padding:8px;
  border-radius:9px;
  border:1px solid rgba(64,80,115,.75);
  background:rgba(18,32,51,.7);
}

.craft-item-btn.active{
  border-color:var(--gold);
  background:rgba(80,62,28,.62);
  color:var(--gold);
}

.craft-preview{
  display:grid;
  grid-template-columns:90px 1fr;
  gap:12px;
  align-items:start;
}

@media(max-width:820px){
  .craft-layout{grid-template-columns:1fr}
  .craft-preview{grid-template-columns:1fr}
}
@media(max-width:820px){
  .forge-layout{grid-template-columns:1fr}
  .forge-preview{grid-template-columns:1fr}
}
.tabs-note{font-size:13px;color:var(--muted)}
.auth-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.auth-card{
  width:min(460px,96vw);
  background:rgba(18,24,38,.96);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  box-shadow:0 18px 42px rgba(0,0,0,.42);
}

.auth-card h1{
  margin:0 0 8px;
  color:var(--gold);
  font-size:26px;
}

.auth-card input{
  width:100%;
  margin:7px 0;
}

.auth-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.create-role-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.create-role-card{
  width:min(920px,96vw);
  background:rgba(18,24,38,.96);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  box-shadow:0 18px 42px rgba(0,0,0,.42);
}

.gender-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:12px;
  margin:12px 0;
}

.gender-card{
  border:1px solid rgba(64,80,115,.85);
  border-radius:14px;
  background:rgba(10,15,26,.66);
  padding:10px;
  cursor:pointer;
  transition:.15s;
}

.gender-card.active{
  border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(255,211,106,.18);
}

.gender-card img{
  width:100%;
  height:320px;
  object-fit:contain;
  display:block;
}
.mail-unread{color:var(--gold);font-weight:bold}
.tutorial-mask{
  position:fixed;
  inset:0;
  z-index:300;
  background:rgba(0,0,0,.62);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.tutorial-card{
  width:min(560px,96vw);
  background:rgba(18,24,38,.98);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  box-shadow:0 18px 44px rgba(0,0,0,.55);
}

.tutorial-card h2{
  margin:0 0 10px;

let STATE=loadState();
let GAME_WS=null;
let GAME_WS_RETRY_TIMER=null;
function getAuthToken(){
  return localStorage.getItem("zs_xxxt_token")||"";
}

function setAuthToken(token){
  localStorage.setItem("zs_xxxt_token",token||"");
}

function clearAuthToken(){
  localStorage.removeItem("zs_xxxt_token");
}

async function apiRequest(path,options={}){
  const headers={
    "Content-Type":"application/json",
    ...(options.headers||{})
  };

  const token=getAuthToken();
  if(token){
    headers.Authorization="Bearer "+token;
  }

  const response=await fetch(API_BASE+path,{
    ...options,
    headers
  });

  let data=null;
  try{
    data=await response.json();
  }catch{
    data={ok:false,message:"服务器返回格式错误"};
  }

  if(!response.ok||!data.ok){
    throw new Error(data.message||"请求失败");
  }

  return data;
}

function closeGameWebSocket(){
  if(GAME_WS){
    try{
      GAME_WS.onopen=null;
      GAME_WS.onclose=null;
      GAME_WS.onmessage=null;
      GAME_WS.onerror=null;
      GAME_WS.close();
    }catch{}
    GAME_WS=null;
  }

  if(GAME_WS_RETRY_TIMER){
    clearTimeout(GAME_WS_RETRY_TIMER);
    GAME_WS_RETRY_TIMER=null;
  }
}

function getWsUrl(){
  const token=getAuthToken();
  const protocol=location.protocol==="https:"?"wss":"ws";
  return `${protocol}://${location.host}/?token=${encodeURIComponent(token)}`;
}

function sendWsMessage(data){
  if(GAME_WS&&GAME_WS.readyState===WebSocket.OPEN){
    GAME_WS.send(JSON.stringify(data));
    return true;
  }
  return false;
}

function handleGameWsMessage(data){
  if(!data||typeof data!=="object")return;

  if(data.type==="connected"){
    return;
  }

  if(data.type==="pong"){
    return;
  }

  if(data.type==="auth_error"){
    alert(data.message||"WebSocket 登录失效");
    closeGameWebSocket();
    return;
  }

  if(data.type==="world_chat_history"){
    if(!STATE.worldChat){
      STATE.worldChat={input:"",messages:[]};
    }

    STATE.worldChat.messages=Array.isArray(data.messages)?data.messages:[];
    saveState();
    updateWorldChatDom();
    return;
  }

  if(data.type==="world_chat_message"){
    if(!STATE.worldChat){
      STATE.worldChat={input:"",messages:[]};
    }

    if(!STATE.worldChat.messages.some(message=>message.id===data.id)){
      STATE.worldChat.messages.push(data);
      STATE.worldChat.messages=STATE.worldChat.messages.slice(-80);
    }

    saveState();
    updateWorldChatDom();
    return;
  }

  if(data.type==="system_notice"){
    pushLog(`<span class="cyan">[系统频道]</span>${escapeHtml(data.message||"有新消息")}`);
    saveState();
    return;
  }

  if(data.type==="save_hint"){
    pushUseLog(`实时提示：${data.message||"已收到"}`);
    return;
  }
}

function connectGameWebSocket(){
  const token=getAuthToken();
  if(!token)return;

  closeGameWebSocket();

  const wsUrl=getWsUrl();
  const ws=new WebSocket(wsUrl);
  GAME_WS=ws;

  ws.onopen=()=>{
    sendWsMessage({type:"ping"});
  };

  ws.onmessage=event=>{
    let data;
    try{
      data=JSON.parse(event.data);
    }catch{
      return;
    }
    handleGameWsMessage(data);
  };

  ws.onclose=()=>{
    if(GAME_WS===ws)GAME_WS=null;

    if(getAuthToken()){
      GAME_WS_RETRY_TIMER=setTimeout(()=>{
        if(getAuthToken())connectGameWebSocket();
      },5000);
    }
  };

  ws.onerror=()=>{
    // 这里不弹窗，避免连接重试时一直吵
  };
}

function handleWorldChatInput(element){
  if(!STATE.worldChat){
    STATE.worldChat={input:"",messages:[]};

  STATE.worldChat.input=element.value;
  saveState();

function sendWorldChat(){
  const input=document.getElementById("worldChatInput");
  const text=(input?.value||"").trim();

  if(!text)return;
  if(text.length>80){
    alert("世界聊天最多 80 字。");
    return;
  }

  const sent=sendWsMessage({
    type:"world_chat",
    name:STATE.player.name||STATE.auth.account||"无名道友",
    realm:currentRealmTitle(),
    text
  });

  if(!sent){
    alert("实时服务器未连接，暂时无法发送世界聊天。");
    return;
  }

  if(!STATE.worldChat){
    STATE.worldChat={input:"",messages:[]};
  }

  STATE.worldChat.input="";
  saveState();
  updateWorldChatDom();
}

function mergeState(base,saved){
  if(Array.isArray(base))return Array.isArray(saved)?saved:base;
  if(base&&typeof base==="object"){
    const output={...base};
    Object.keys(saved||{}).forEach(key=>{
      output[key]=mergeState(base[key],saved[key]);
    });
    return output;
  }
  return saved===undefined?base:saved;
}

function getCultivationMultiplier(){
  const time=now();
  let multiplier=1;
  if(STATE.buffs.cultMultiplier2Until>time) multiplier=Math.max(multiplier,2);
  if(STATE.buffs.cultMultiplier3Until>time) multiplier=Math.max(multiplier,3);
  if(STATE.system.path==="苦修") multiplier*=1.35;
  multiplier*=1+(STATE.system.cultShopBonus||0);

function totalAttrs(){
  const attrs={
    生命:STATE.player.lifeMax,
    力量:STATE.player.attrs.力量,
    精神:STATE.player.attrs.精神,
    灵力:STATE.player.attrs.灵力,
    耐力:STATE.player.attrs.耐力,
    抗性:STATE.player.attrs.抗性,
    速度:STATE.player.attrs.速度
  };
  Object.values(STATE.equipped).filter(Boolean).forEach(equip=>{
    for(const key in equip.attrs) attrs[key]=(attrs[key]||0)+equip.attrs[key];
  });
  const vipConfig=CONFIG.vip[STATE.vip.level]||CONFIG.vip[0];
  const monthBonus = STATE.month.active ? .02 : 0;
  if(STATE.buffs?.wine&&STATE.buffs.wine.until>now()){
    const wine=STATE.buffs.wine;
    attrs[wine.attr]=(attrs[wine.attr]||0)+wine.value;
  }
  for(const key in attrs) attrs[key]=Math.floor(attrs[key]*(1+(vipConfig.bonus||0)+monthBonus));
  return attrs;
}

function weightedPick(values,weights){
  let total=weights.reduce((sum,value)=>sum+value,0);
  let roll=Math.random()*total;
  for(let index=0;index<values.length;index++){
    roll-=weights[index];
    if(roll<=0)return values[index];
  }
  return values[0];
}

function getMaterialConfigByName(name){
  return CONFIG.materials.find(material=>material.name===name);
}

function getSpecialMaterialConfigByName(name){
  return Object.values(CONFIG.monsterSpecialDrops||{}).find(material=>material.name===name);
}

function getPillBaseName(name){
  return String(name||"")
    .replace(/^下品/,"")
    .replace(/^中品/,"")
    .replace(/^上品/,"");
}

function getPillGradeIndexFromName(name){
  if(String(name||"").startsWith("上品"))return 2;
  if(String(name||"").startsWith("中品"))return 1;
  return 0;
}

function getPillConfigByName(name){
  const baseName=getPillBaseName(name);
  return CONFIG.pills.find(pill=>pill.name===baseName);
}

function createPillItemName(pillName,gradeIndex){
  const gradeName=CONFIG.grades[gradeIndex]?.name||"下品";
  return gradeName+pillName;
}

function getPillQualityFrameIndex(pillName){
  const pill=getPillConfigByName(pillName);
  if(!pill)return 1;
  return Math.max(0,Math.min(6,pill.realm+1));
}

function pillIconHtml(name,type=null,size=""){
  const pill=getPillConfigByName(name);

  const baseName=getPillBaseName(name);
  const icon=getItemIconPath(baseName,type);
  const gradeIndex=getPillGradeIndexFromName(name);
  const qualityIndex=getPillQualityFrameIndex(name);

  const framePath=CONFIG.equipmentIconPaths.frame+"quality_"+qualityIndex+"_"+[
    "broken","normal","fine","rare","epic","legend","myth"
  ][qualityIndex]+".webp";

  const gradePath=CONFIG.equipmentIconPaths.grade+"grade_"+gradeIndex+"_"+[
    "low","mid","high"
  ][gradeIndex]+".webp";

  return `<span class="item-icon-stack ${size}">
    <img src="${icon}" onerror="this.style.display='none'">
    <img class="item-quality-overlay" src="${framePath}" onerror="this.style.display='none'">
    <img class="item-quality-overlay" src="${gradePath}" onerror="this.style.display='none'">
  </span>`;
}

function getPillGradeWeights(){
  return [60,30,10];
}

function rollPillGrade(){
  return weightedPick([0,1,2],getPillGradeWeights());
}

function getPillGradeSuccessBonus(gradeIndex){
  return [0,.08,.16][gradeIndex]||0;
}

function findBestBreakthroughPill(pillName){
  const candidates=STATE.bag.filter(item=>{
    return item.type==="丹药"&&item.count>0&&getPillBaseName(item.name)===pillName;
  });

  if(!candidates.length)return null;

  candidates.sort((a,b)=>getPillGradeIndexFromName(b.name)-getPillGradeIndexFromName(a.name));
  return candidates[0];
}
function getItemIconPath(name,type=null){

  if(material)return CONFIG.materialTypeIcons[material.type]||CONFIG.iconPaths.materials+"material_treasure.webp";
  const specialMaterial=getSpecialMaterialConfigByName(name);
  if(specialMaterial){
    return CONFIG.materialTypeIcons[specialMaterial.type]||CONFIG.iconPaths.materials+"material_treasure.webp";
  }

  if(name.includes("破境丹"))return CONFIG.iconPaths.pills+"breakthrough_dan.webp";
  if(name.includes("丹"))return CONFIG.iconPaths.pills+"attribute_dan.webp";
  if(name.includes("灵石"))return CONFIG.iconPaths.packages+"random_spirit_stone_pack.webp";
  if(name.includes("残页"))return CONFIG.iconPaths.skillItems+"skill_page.webp";
  if(name.includes("礼包"))return CONFIG.iconPaths.packages+"normal_gift_pack.webp";
  if(name.includes("材料包"))return CONFIG.iconPaths.packages+"random_material_pack.webp";
  if(name.includes("装备箱"))return CONFIG.iconPaths.packages+"low_equip_box.webp";

  return CONFIG.iconPaths.itemsFallback||CONFIG.iconPaths.tools+"identify_talisman.webp";

function getConcreteMaterialSource(material){
  const mapIndex=Math.max(0,Math.min(CONFIG.maps.length-1,material.realm||0));
  const map=CONFIG.maps[mapIndex]||CONFIG.maps[0];
  const zoneIndex=Math.max(0,Math.min(2,material.quality%3));
  const zone=map.zones[zoneIndex]||map.zones[0];

  const secondMap=CONFIG.maps[Math.min(CONFIG.maps.length-1,mapIndex+1)];
  const secondZone=secondMap?.zones?.[(zoneIndex+1)%3];

  if(secondMap&&secondMap.id!==map.id){
    return `${map.name}·${zone}怪物掉落；${secondMap.name}·${secondZone}也有少量掉落；材料包和天材地宝副本可获得。`;
  }

  return `${map.name}·${zone}怪物掉落；材料包和天材地宝副本可获得。`;
}

function guessItemType(name){

  if(getPillConfigByName(name))return "丹药";
  if(getSpecialMaterialConfigByName(name))return "特殊材料";
  if(CONFIG.giftRecipes?.some(item=>item.name===name))return "礼物";
  if(CONFIG.wineRecipes?.some(item=>item.name===name))return "酒";
  if(name.includes("仙缘箱"))return "仙缘箱";
  if(name.includes("丹"))return "丹药";
  if(name.includes("灵石"))return "灵石";
  if(name.includes("生命晶石"))return "道具";
  if(name.includes("炉"))return "炼丹炉";
  if(name.includes("材料")||CONFIG.materials.some(material=>material.name===name))return "材料";
  if(name.includes("装备箱"))return "礼包";
  if(name.includes("功法残卷"))return "功法残卷";
if(name.includes("神技残卷"))return "神技残卷";
if(name.includes("心法玉简"))return "心法玉简";
if(name.includes("残页"))return "功法残页";
  return "道具";
}

function addItem(name,count=1,type=guessItemType(name),extra={}){
  const stack=STATE.bag.find(item=>item.name===name&&item.type===type&&!item.unique);
  if(stack) stack.count+=count;
  else STATE.bag.push({id:uid("item"),name,count,type,...extra});

function gainXianyuan(amount,source){
  const today=new Date().toDateString();
  if(STATE.progress.lastDay!==today){
    STATE.progress.dailyXianyuan=0;
    STATE.progress.lastDay=today;
  }
  STATE.resources.xianyuan+=amount;
  STATE.progress.dailyXianyuan+=amount;
  STATE.progress.recentXianyuan.unshift(`+${amount} 仙缘：${source}`);
  STATE.progress.recentXianyuan=STATE.progress.recentXianyuan.slice(0,8);
  pushFlow("xianyuan_gain",{amount,source});
  if(amount>=648){
    pushLog(`<span class="crit">系统公告：${STATE.player.name} 获得 ${amount} 仙缘！仙缘仅由游戏内玩法掉落。</span>`);
  }
}

function gainReward(attachment,source="未知"){
  if(!attachment)return true;
  if(attachment.coin) STATE.resources.coin+=attachment.coin;
  if(attachment.yuanbao) STATE.resources.yuanbao+=attachment.yuanbao;
  if(attachment.xianyuan) gainXianyuan(attachment.xianyuan,source);
  if(attachment.cult) STATE.player.cultivation+=attachment.cult;
  if(attachment.systemPoint) STATE.resources.systemPoint+=attachment.systemPoint;
  if(attachment.items) attachment.items.forEach(([name,count])=>addItem(name,count,guessItemType(name)));
  pushFlow("reward_claim",{source,attachment});
  saveState();
  return true;
}

function sendMail(templateId,source="system",extraAttachment=null){
  const template=CONFIG.mailTemplates[templateId];
  if(!template)return;
  const attachment=extraAttachment||JSON.parse(JSON.stringify(template.attachment||{}));
  STATE.mails.unshift({
    id:uid("mail"),
    title:template.title,
    body:template.body,
    from:"天道系统",
    created:now(),
    expire:now()+1000*86400*30,
    read:false,
    claimed:false,
    type:source,
    source,
    attachment
  });
  pushFlow("mail_send",{templateId,source,attachment});
  pushLog(`<span class="gold">系统邮件：</span>${template.title}`);
  saveState();
}

function claimMail(mailId){

  if(!mail||mail.claimed)return;
  mail.read=true;
  gainReward(mail.attachment,"邮件:"+mail.title);
  mail.claimed=true;
  pushFlow("mail_claim",{mailId,title:mail.title});
  pushLog(`<span class="good">领取邮件附件：</span>${mail.title}`);
  saveState();
saveAccountState();
render();

function createEquip(realm=STATE.player.realm,slot=pick(CONFIG.equipSlots),identified=true,options={}){
  const qualityIndex=options.qualityIndex!==undefined
  ? options.qualityIndex
  : weightedPick(options.qualityPool||[0,1,2,3,4,5,6],options.qualityWeights||[360,300,180,90,40,12,3]);
  const gradeIndex=weightedPick([0,1,2],[60,30,10]);
  const quality=CONFIG.qualities[qualityIndex];
  const grade=CONFIG.grades[gradeIndex];
  const base=10+realm*15;
  const baseSlot=getEquipBaseSlot(slot);
const isAttack=["武器","项链","手镯"].includes(baseSlot);
  const isDefense=["头盔","上身","下装","护臂"].includes(baseSlot);
  const isSpeed=baseSlot==="鞋";
  const attrs={};
  const multiplier=quality.multiplier*grade.multiplier;
  if(isAttack){
    attrs.力量=Math.floor(base*multiplier*rnd(8,13)/10);
    attrs.精神=Math.floor(base*multiplier*rnd(5,10)/10);
  }else if(isDefense){
    attrs.耐力=Math.floor(base*multiplier*rnd(8,13)/10);
    attrs.抗性=Math.floor(base*multiplier*rnd(5,10)/10);
    attrs.生命=Math.floor(base*multiplier*8);
  }else if(isSpeed){
    attrs.速度=Math.max(1,Math.floor((2+realm)*multiplier));
  }else{
    attrs.灵力=Math.floor(base*multiplier*2);
    attrs.生命=Math.floor(base*multiplier*5);
  }
  const blue=options.forceBlue
  ? pick(CONFIG.blueEffects)
  : (chance(.035+qualityIndex*.008)?pick(CONFIG.blueEffects):null);
  const weaponStyle=slot==="武器"?pick(CONFIG.weaponIconStyles):null;
  const icon=createEquipmentIcon(slot,realm,qualityIndex,gradeIndex,blue,identified,weaponStyle);
  return {
    id:uid("equip"),
    name:`${pick(["碎星","寒碑","青烬","澜影","玄垣","照夜","晦明"])}${slot}`,
    slot,
    realm,
    quality:qualityIndex,
    grade:gradeIndex,
    attrs,
    blue,
    identified,
    weaponStyle,
    icon
  };
}

function getEquipBaseSlot(slot){
  if(slot==="手镯1"||slot==="手镯2")return "手镯";
  if(slot==="戒指1"||slot==="戒指2"||slot==="戒指3")return "戒指";
  return slot;
}

function getCompatibleEquipSlots(slot){
  const baseSlot=getEquipBaseSlot(slot);

  if(baseSlot==="手镯"){
    return ["手镯1","手镯2"];
  }

  if(baseSlot==="戒指"){
    return ["戒指1","戒指2","戒指3"];
  }

  return [slot];
}

function getDisplaySlotName(slot){
  return getEquipBaseSlot(slot);
}

function equipToBestCompatibleSlot(equip){
  if(!equip)return false;

  const slots=getCompatibleEquipSlots(equip.slot);
  let bestSlot=slots[0];

  for(const slot of slots){
    if(!STATE.equipped[slot]){
      bestSlot=slot;
      break;
    }

    if(equipScore(equip)>equipScore(STATE.equipped[slot])){
      bestSlot=slot;
    }
  }

  if(STATE.equipped[bestSlot]){
    STATE.store.push(STATE.equipped[bestSlot]);
  }

  STATE.equipped[bestSlot]=equip;
  STATE.store=STATE.store.filter(item=>item.id!==equip.id);

  return true;
}
function equipScore(equip){
  return (equip.quality+1)*1000+(equip.grade+1)*180+Object.values(equip.attrs).reduce((a,b)=>a+b,0)+equip.realm*120+(equip.blue?500:0);
}

function pickBattleFxBySkill(skill){

function currentMonster(isBoss=false){
  const mapIndex=STATE.progress.map;
  const zoneIndex=STATE.progress.zone;
  let earlyEase=1;
if(mapIndex===0)earlyEase=.55;
if(mapIndex===1)earlyEase=.75;

const base=18*Math.pow(1.58,mapIndex)*(1+zoneIndex*.16)*(isBoss?4.5:1)*earlyEase;
const monsterData=CONFIG.mapMonsters?.[mapIndex]?.[zoneIndex] || CONFIG.mapMonsters?.[0]?.[0];
const monsterName=isBoss?CONFIG.maps[mapIndex].boss:monsterData.name;
const monsterImage=isBoss?CONFIG.bossImages[monsterName]:monsterData.image;

return {
  name:monsterName,
  image:monsterImage,
    hp:Math.floor(base*8),
    atk:Math.floor(base*.9),
    def:Math.floor(base*.32),
    res:Math.floor(base*.24),

function battle(isBoss=false){
  const attrs=totalAttrs();
  const monster=currentMonster(isBoss);
  if(!STATE.currentMonsterHp||STATE.currentMonsterHp<=0||isBoss){
    STATE.currentMonsterHp=monster.hp;
    STATE.currentMonsterMaxHp=monster.hp;
  }
  let playerHp=STATE.player.life;
  let monsterHp=STATE.currentMonsterHp;
  let round=0;
  let battleLogs=[];
  let playerShield=0;
  let monsterSeal=0;
  let monsterBurn=0;
  const blueEffects=Object.values(STATE.equipped).filter(Boolean).map(equip=>equip.blue).filter(Boolean);

  if(blueEffects.some(effect=>effect.type==="shield")){
    playerShield+=Math.floor(attrs.生命*.12);
    battleLogs.push(`<span class="blue">蓝字·覆潮灵膜：开局护盾 ${playerShield}</span>`);
  }
  if(blueEffects.some(effect=>effect.type==="speed")) attrs.速度+=8;

  while(playerHp>0&&monsterHp>0&&round<20){
    round++;
    if(monsterBurn>0){
      const burnDamage=Math.floor(attrs.精神*.18);
      monsterHp-=burnDamage;
      monsterBurn--;
      battleLogs.push(`第${round}回合：灼烧造成 ${burnDamage} 伤害。`);
    }

    const playerAttack=()=>{
      const skillId=STATE.skills.equipped.length?STATE.skills.equipped[0]:null;
const skill=skillId?CONFIG.skills.find(item=>item.id===skillId):null;
let damage;
let attackName="体术攻击";

if(skill){
  const spiritCost=skill.kind==="神技" ? (skill.spiritCost||100) : 0;
  const currentSpirit=STATE.player.currentSpirit ?? attrs.灵力;

  if(spiritCost>0&&currentSpirit<spiritCost){
    damage=Math.max(1,Math.floor(attrs.力量*.9-monster.def*.35));
    battleLogs.push(`<span class="warn">灵力不足，神技释放失败，改用体术攻击。</span>`);
  }else{
    if(spiritCost>0){
      STATE.player.currentSpirit=currentSpirit-spiritCost;
    }
    STATE.skills.proficiency[skillId]=(STATE.skills.proficiency[skillId]||0)+1;
    const proficiencyBonus=Math.min(.35,(STATE.skills.proficiency[skillId]||0)/1200);
    damage=Math.max(1,Math.floor((attrs.力量*.7+attrs.精神*.55)*((skill.multiplier||1)+proficiencyBonus)-monster.def*.45));
    attackName=skill.name;
  }
}else{
  damage=Math.max(1,Math.floor(attrs.力量*.9-monster.def*.35));
}

     let isCrit=false;
const critChance=Math.min(.18,.035+attrs.速度/5000);

if(chance(critChance)){
  isCrit=true;
  damage=Math.floor(damage*1.8);
  battleLogs.push(`<span class="crit">暴击！</span>`);
}

monsterHp-=damage;

if(isCrit){
  triggerBattleVisual("criticalFlash","暴击 "+damage);
}else{
  triggerBattleVisual(skill?pickBattleFxBySkill(skill):"slash",damage);
}
      battleLogs.push(attackName==="体术攻击"
  ? `第${round}回合：你以体术攻击 ${monster.name}，造成 ${damage} 伤害。`
  : `第${round}回合：你施展 ${attackName}，对 ${monster.name} 造成 ${damage} 伤害。`
);

      if(STATE.player.root&&chance(.08)){
        const root=pick(STATE.player.root);
        if(root.type==="burn"){
          monsterBurn=2;
          battleLogs.push(`<span class="blue">${root.name}灵根触发：灼烧。</span>`);
        }
        if(root.type==="heal"){
          const heal=Math.floor(attrs.生命*.04);
          playerHp=Math.min(STATE.player.lifeMax,playerHp+heal);
          battleLogs.push(`<span class="good">${root.name}灵根触发：回血 ${heal}。</span>`);
        }
        if(root.type==="shield"){
          playerShield+=Math.floor(attrs.生命*.06);
          battleLogs.push(`<span class="blue">${root.name}灵根触发：护盾。</span>`);
        }
        if(root.type==="stun"&&chance(.45)){
          monsterSeal=1;
          battleLogs.push(`<span class="crit">${root.name}灵根触发：麻痹敌人。</span>`);
        }
      }

      if(blueEffects.some(effect=>effect.type==="combo")&&chance(.08)){
        const comboDamage=Math.floor(damage*.45);
        monsterHp-=comboDamage;
        battleLogs.push(`<span class="blue">蓝字·双影回刃：追加 ${comboDamage}</span>`);
      }
      if(blueEffects.some(effect=>effect.type==="heal")&&chance(.12)){
        const heal=Math.floor(attrs.生命*.03);
        playerHp=Math.min(STATE.player.lifeMax,playerHp+heal);
        battleLogs.push(`<span class="good">蓝字回血 ${heal}</span>`);
      }
    };

    const monsterAttack=()=>{
      if(monsterSeal>0){
        monsterSeal--;
        battleLogs.push(`<span class="blue">${monster.name} 被封灵，行动失败。</span>`);
        return;
      }
      let damage=Math.max(1,Math.floor(monster.atk-attrs.耐力*.35-attrs.抗性*.18));
      if(isBoss&&round>8){
        damage=Math.floor(damage*1.35);
        battleLogs.push(`<span class="bad">Boss 狂暴！</span>`);
      }
      if(playerShield>0){
        const blocked=Math.min(playerShield,damage);
        playerShield-=blocked;
        damage-=blocked;
      }
      playerHp-=damage;
      battleLogs.push(`第${round}回合：${monster.name} 反击，造成 ${damage} 伤害。`);
      if(blueEffects.some(effect=>effect.type==="thorns")&&chance(.1)){

    };

    if(attrs.速度>=monster.speed){

    }else{
      monsterAttack();
      if(playerHp>0)playerAttack();
    }
  }

  STATE.player.life=Math.max(0,playerHp);
  STATE.currentMonsterHp=Math.max(0,monsterHp);
  const win=monsterHp<=0;

  if(win){
  triggerMonsterDeath(monster);
  STATE.currentMonsterHp=null;

}else if(playerHp<=0){

    if(STATE.player.lifespan<=0){

      battleLogs.push(`<span class="bad">寿命归零，进入濒死/轮回待定状态。</span>`);
    }else{
      battleLogs.push(`<span class="bad">战斗失败，寿命受损。</span>`);
    }
  }

  if(!STATE.hideLog) battleLogs.reverse().forEach(pushLog);
  tryBreakthrough(false);
  saveState();
}

  if(STATE.autoHeal&&STATE.player.life/STATE.player.lifeMax*100<STATE.autoHealPct){
    const crystal=STATE.bag.find(item=>item.name.includes("生命晶石")&&item.count>0);
    if(crystal){
      crystal.count--;
      STATE.player.life=Math.min(STATE.player.lifeMax,STATE.player.life+Math.floor(STATE.player.lifeMax*.45));
      pushUseLog("自动消耗生命晶石恢复生命");
      pushLog(`<span class="good">自动消耗生命晶石恢复生命。</span>`);
    }
  }
  battle(false);
   if(["背包","储物戒","仓库","装备"].includes(STATE.tab)){
  return;
}
  if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName)){
    return;
  }
  safeRender();
}

function tryBreakthrough(manual=true){
  let need=cultivationNeed();
  while(STATE.player.cultivation>=need&&STATE.player.subRealm<11){
    STATE.player.cultivation-=need;
    STATE.player.subRealm++;
    STATE.player.points+=3+STATE.player.realm;
    STATE.player.lifeMax+=10+STATE.player.realm*4;
    STATE.player.life=STATE.player.lifeMax;
    STATE.player.lifespanMax+=2;
    STATE.player.lifespan+=2;
    pushLog(`<span class="gold">突破成功：${currentRealmTitle()}，获得属性点。</span>`);

    if(STATE.player.realm===1&&!STATE.player.root){
      const count=weightedPick([1,2,3,4],[15,35,35,15]);
      STATE.player.root=[...CONFIG.spiritRoots].sort(()=>Math.random()-.5).slice(0,count);
      pushLog(`<span class="cyan">筑基灵根显现：${STATE.player.root.map(item=>item.name).join("、")}</span>`);
    }
    need=cultivationNeed();
  }

  if(manual&&STATE.player.subRealm>=11){
    const nextRealm=CONFIG.realms[STATE.player.realm+1];
    if(!nextRealm)return alert("已至当前版本最高境界。");
    const pillName=nextRealm+"破境丹";
const pill=findBestBreakthroughPill(pillName);

if(!pill){
  return alert("大圆满突破需要："+pillName+"，可使用下品/中品/上品。");
}

const pillGradeIndex=getPillGradeIndexFromName(pill.name);
pill.count--;

let probability=.48
  +STATE.player.attrs.精神/1000
  +(STATE.player.root?.length===1 ? .08 : 0)
  +getPillGradeSuccessBonus(pillGradeIndex);
    const furnace=CONFIG.alchemyFurnaces.find(item=>item.name===STATE.alchemy.furnace);
    if(furnace) probability+=furnace.successBonus*.2;

    if(chance(probability)){
      STATE.player.realm++;
      STATE.player.subRealm=0;
      STATE.player.points+=10+STATE.player.realm*3;
      STATE.player.lifespanMax+=CONFIG.realmConfigs[STATE.player.realm].lifeBonus;
      STATE.player.lifespan=STATE.player.lifespanMax;
      STATE.player.lifeMax+=80+STATE.player.realm*30;
      STATE.player.life=STATE.player.lifeMax;
      pushLog(`<span class="crit">大境界突破成功：${currentRealmTitle()}！消耗${pill.name}。</span>`);
    }else{
      STATE.player.subRealm=Math.max(0,STATE.player.subRealm-2);
      pushLog(`<span class="bad">突破失败，消耗${pill.name}，跌落两个小境界。</span>`);
    }
  }
    cleanBag();
  saveState();
  if(manual){
    render();
  }
}

function openEquipBox(item){
  const config=CONFIG.equipBoxConfigs[item.name];
  if(!config){
    alert("装备箱配置不存在："+item.name);
    return;
  }

  item.count--;

  const openCount=rnd(config.count[0],config.count[1]);
  const createdNames=[];

  for(let index=0;index<openCount;index++){
    const equipOptions={};

    if(config.qualityIndex!==undefined){
      equipOptions.qualityIndex=config.qualityIndex;
    }

    if(config.qualityPool){
      equipOptions.qualityPool=config.qualityPool;
      equipOptions.qualityWeights=config.qualityWeights;
    }

    if(config.forceBlue){
      equipOptions.forceBlue=true;
    }

    const equip=createEquip(
      STATE.player.realm,
      pick(CONFIG.equipSlots),
      config.identified,
      equipOptions
    );

    STATE.store.push(equip);
    createdNames.push(`${equip.name}（${CONFIG.qualities[equip.quality].name}·${CONFIG.grades[equip.grade].name}${equip.blue?"·蓝字":""}）`);
  }

  pushUseLog(`开启 ${item.name}，获得：${createdNames.join("、")}，装备已进入储物戒`);
  pushLog(`<span class="good">开启 ${item.name}，获得 ${openCount} 件装备，已进入储物戒。</span>`);

  cleanBag();
  saveState();
  safeRender();
}
function getUnownedSkillsByKind(kind){
  return CONFIG.skills.filter(skill=>{
    return skill.kind===kind&&!STATE.skills.owned.includes(skill.id);
  });
}

function learnRandomSkillByKind(kind,sourceName){
  const pool=getUnownedSkillsByKind(kind);

  if(!pool.length){
    pushUseLog(`${sourceName} 使用失败：该类型已全部领悟。`);
    alert(`你已经领悟了全部${kind}。`);
    return false;
  }

  const skill=pick(pool);
  STATE.skills.owned.push(skill.id);

  pushUseLog(`通过 ${sourceName} 领悟：${skill.name}`);
  pushLog(`<span class="gold">领悟${kind}：${skill.name}，已自动加入功法页。</span>`);
  pushFlow("skill_learn",{kind,skillId:skill.id,skillName:skill.name,source:sourceName});

  return true;
}

function useSkillItem(item){
  const config=CONFIG.skillItemConfigs[item.name];
  if(!config)return false;

  if(item.count<config.need){
    alert(`${item.name} 数量不足，需要 ${config.need} 个。当前：${item.count}`);
    return true;
  }

  const success=learnRandomSkillByKind(config.kind,item.name);
  if(!success)return true;

  item.count-=config.need;
  cleanBag();
  saveState();
  safeRender();
  return true;
}
function openXianyuanBox(item){
  const box=CONFIG.xianyuanBoxes.find(box=>item.name===box.name);
  if(!box)return;
  item.count--;
  const weights=CONFIG.xianyuanWeights.map((weight,index)=>weight*(1+index*box.bonus));
  const amount=weightedPick(CONFIG.xianyuanTiers,weights);
  gainXianyuan(amount,item.name);
  pushUseLog(`开启 ${item.name}，获得 ${amount} 仙缘`);
  pushLog(`<span class="gold">开启 ${item.name}，获得 ${amount} 仙缘。</span>`);
    cleanBag();
  saveState();
  safeRender();
}

function useSelectedBagItem(amount){
  const item=STATE.bag.find(bagItem=>bagItem.id===STATE.selectedBagItemId);
  if(!item)return;

  if(amount==="all"){
    amount=item.count;
  }

  amount=Math.max(1,Math.min(item.count,Number(amount)||1));

  const isPill=item.type==="丹药"||!!getPillConfigByName(item.name);

  if(isPill&&!getPillBaseName(item.name).includes("破境丹")){
    usePillBatch(item,amount);
    return;
  }

  useItem(item);
}

function bestEquip(){
  const sorted=STATE.store
    .filter(equip=>equip.identified)
    .sort((a,b)=>equipScore(b)-equipScore(a));

  sorted.forEach(equip=>{
    if(!STATE.store.some(item=>item.id===equip.id))return;

    const slots=getCompatibleEquipSlots(equip.slot);
    const hasEmpty=slots.some(slot=>!STATE.equipped[slot]);
    const weakestSlot=slots
      .filter(slot=>STATE.equipped[slot])
      .sort((a,b)=>equipScore(STATE.equipped[a])-equipScore(STATE.equipped[b]))[0];

    if(hasEmpty){
      equipToBestCompatibleSlot(equip);
      return;
    }

    if(weakestSlot&&equipScore(equip)>equipScore(STATE.equipped[weakestSlot])){
      equipToBestCompatibleSlot(equip);
    }
  });

  saveState();
  render();
}

function dismantle(qualityLimit=1){
  let count=0;
  STATE.store=STATE.store.filter(equip=>{
    if(!equip.identified||equip.quality>qualityLimit)return true;
    count++;
    STATE.resources.coin+=50*(equip.realm+1);
    addItem("锻造石",1+equip.quality,"材料");
    return false;
  });
  pushLog(`分解装备 ${count} 件，未鉴定装备自动跳过。`);
  saveState();
  render();
}

function getForgeCost(slot,targetRealm=STATE.player.realm){
  const playerRealm=STATE.player.realm;
  const realmGap=Math.max(0,targetRealm-playerRealm);
  const materialPool=CONFIG.materials.filter(material=>{
    return material.realm<=targetRealm+1&&material.realm>=Math.max(0,targetRealm-1);
  });

  const fallbackPool=CONFIG.materials.length?CONFIG.materials:[{name:"雾纹草",type:"药草",realm:0,quality:0}];
  const pool=materialPool.length?materialPool:fallbackPool;

  const mainIndex=(targetRealm+slot.length)%pool.length;
let secondIndex=(targetRealm*3+slot.length+1)%pool.length;

if(secondIndex===mainIndex&&pool.length>1){
  secondIndex=(secondIndex+1)%pool.length;
}

const mainMaterial=pool[mainIndex];
const secondMaterial=pool[secondIndex];

  const slotCostRate={
    "武器":1.35,
    "头盔":1.05,
    "上身":1.3,
    "下装":1.15,
    "鞋":1,
    "护臂":1,
    "项链":1.25,
"手镯":1.18,
    "手镯1":1.18,
    "手镯2":1.18,
"戒指":1.2,
    "戒指1":1.2,
    "戒指2":1.2,
    "戒指3":1.2
  }[slot]||1;

  const realmRate=Math.pow(CONFIG.forgeMaterialRules.realmCoinMultiplier,targetRealm);
  const overRealmRate=realmGap>0?CONFIG.forgeMaterialRules.overRealmPenalty:1;

  const rawMaterials=[
  {
    name:"锻造石",
    count:Math.ceil((CONFIG.forgeMaterialRules.stoneBase+targetRealm)*slotCostRate*overRealmRate)
  },
  {
    name:mainMaterial.name,
    count:Math.ceil((CONFIG.forgeMaterialRules.materialBase+targetRealm)*slotCostRate*overRealmRate)
  },
  {
    name:secondMaterial.name,
    count:Math.ceil((1+Math.floor(targetRealm/2))*slotCostRate*overRealmRate)
  }
];

const mergedMaterials=Object.values(rawMaterials.reduce((map,item)=>{
  if(!map[item.name])map[item.name]={name:item.name,count:0};
  map[item.name].count+=item.count;
  return map;
},{}));

return {
  coin:Math.floor(CONFIG.forgeMaterialRules.baseCoin*realmRate*slotCostRate*overRealmRate),
  materials:mergedMaterials,
    targetRealm,
    realmGap,
    slotCostRate,
    overRealmRate
  };
}

function getForgeRealmOptions(){
  const maxRealm=Math.min(CONFIG.realms.length-1,STATE.player.realm+1);
  const options=[];
  for(let realm=maxRealm;realm>=0;realm--){
    options.push(realm);
  }
  return options;
}

function getForgeStatPreview(slot,targetRealm){
  const baseSlot=getEquipBaseSlot(slot);
  const base=10+targetRealm*15;
  const qualityMin=CONFIG.qualities[0].multiplier;
  const qualityMax=CONFIG.qualities[6].multiplier;
  const gradeMin=CONFIG.grades[0].multiplier;
  const gradeMax=CONFIG.grades[2].multiplier;
  const minRate=qualityMin*gradeMin;
  const maxRate=qualityMax*gradeMax;

  const ranges=[];

 if(["武器","项链","手镯"].includes(baseSlot)){
    ranges.push({name:"力量",min:Math.floor(base*minRate*.8),max:Math.floor(base*maxRate*1.3)});
    ranges.push({name:"精神",min:Math.floor(base*minRate*.5),max:Math.floor(base*maxRate*1.0)});
 }else if(["头盔","上身","下装","护臂"].includes(baseSlot)){
    ranges.push({name:"耐力",min:Math.floor(base*minRate*.8),max:Math.floor(base*maxRate*1.3)});
    ranges.push({name:"抗性",min:Math.floor(base*minRate*.5),max:Math.floor(base*maxRate*1.0)});
    ranges.push({name:"生命",min:Math.floor(base*minRate*8),max:Math.floor(base*maxRate*8)});
 }else if(baseSlot==="鞋"){
    ranges.push({name:"速度",min:Math.max(1,Math.floor((2+targetRealm)*minRate)),max:Math.max(1,Math.floor((2+targetRealm)*maxRate))});
    ranges.push({name:"生命",min:Math.floor(base*minRate*2),max:Math.floor(base*maxRate*4)});
  }else{
    ranges.push({name:"灵力",min:Math.floor(base*minRate*2),max:Math.floor(base*maxRate*2)});
    ranges.push({name:"生命",min:Math.floor(base*minRate*5),max:Math.floor(base*maxRate*5)});
  }

  return ranges;
}

function getForgeSuccessRate(targetRealm){
  const gap=targetRealm-STATE.player.realm;
  let rate=.62;

  if(gap>0)rate-=.18;
  if(gap<0)rate+=Math.min(.18,Math.abs(gap)*.04);

  if(STATE.system.path==="炼器")rate+=.18;
  rate+=CONFIG.vip[STATE.vip.level]?.forge||0;
  rate+=STATE.system.forgeShopBonus||0;

  return Math.max(.08,Math.min(.92,rate));
}

}

function hasGenericCost(cost){
  if(STATE.resources.yuanbao<cost.yuanbao)return false;
  return cost.items.every(item=>getOwnedItemCount(item.name)>=item.count);
}

function consumeGenericCost(cost){
  STATE.resources.yuanbao-=cost.yuanbao;
  cost.items.forEach(costItem=>{

}

function getPillMaterialCost(pillName){
  const pill=getPillConfigByName(pillName)||CONFIG.pills[0];
  const realm=pill.realm||0;

  const pool=CONFIG.materials.filter(material=>{
    return material.realm>=Math.max(0,realm-1)&&material.realm<=Math.min(8,realm+1);
  });

  const usablePool=pool.length?pool:CONFIG.materials;

  const firstIndex=(realm*3+pill.name.length)%usablePool.length;
  let secondIndex=(realm*5+pill.name.length+7)%usablePool.length;

  if(secondIndex===firstIndex&&usablePool.length>1){
    secondIndex=(secondIndex+1)%usablePool.length;
  }

  const first=usablePool[firstIndex];
  const second=usablePool[secondIndex];

  return {
    items:[
      {
        name:first.name,
        count:2+realm
      },
      {
        name:second.name,
        count:1+Math.floor(realm/2)
      }
    ]
  };
}

function multiplyPillMaterialCost(cost,count){
  return {
    items:cost.items.map(item=>({
      name:item.name,
      count:item.count*count
    }))
  };
}
function hasPillMaterialCost(cost){
  return cost.items.every(costItem=>{

  });

function consumePillMaterialCost(cost){
  cost.items.forEach(costItem=>{

    const targetRealmName=CONFIG.realms[targetRealm];
    const targetName=targetSlot==="任意"
      ? `${targetRealmName}装备`

      title,
      description,
      type:"forgeRealm",
      target:targetName,
      targetRealm,
      targetRealmName,
      targetSlot,
      count:1,
      progress:0,
      difficulty,
      rewardHint:"系统点与炼器资源"
    };
  }

  if(path==="苦修"){
    let targetMapIndex=mapIndex;
    let count=10;

    if(difficulty==="easy"){
      targetMapIndex=mapIndex;
      count=12;
    }

    if(difficulty==="normal"){
      if(mapIndex>0&&chance(.5)){
        targetMapIndex=rnd(0,mapIndex);
      }
      count=targetMapIndex<mapIndex?45+15*(mapIndex-targetMapIndex):24;
    }

    if(difficulty==="hard"){
      if(mapIndex>0){
        targetMapIndex=rnd(0,mapIndex);
      }
      count=targetMapIndex<mapIndex?80+25*(mapIndex-targetMapIndex):36;
    }

    const targetMap=CONFIG.maps[targetMapIndex];

    const title=targetMapIndex<mapIndex
      ? `${targetMap.name}清剿`
      : `${targetMap.name}苦修`;

    const description=targetMapIndex<mapIndex

  if(good.type==="mail"){
    sendMail("mail_system_exchange","system_shop:"+good.id,good.attachment);
  }else if(good.type==="direct"){
    gainReward(good.reward,"系统点商城:"+good.name);
    pushLog(`<span class="good">系统点商城兑换：${good.name}</span>`);

    STATE.system[good.field]=(STATE.system[good.field]||0)+good.value;

  pushFlow("system_shop_buy",{goodId,cost:good.cost,path:STATE.system.path});
  saveState();
  render();
}

function updateAISystemTaskProgress(event){
  if(!STATE.system?.tasks?.length)return;

  STATE.system.tasks.forEach(task=>{
    if(!task.aiGenerated||task.state==="可领取"||task.state==="已完成")return;

    if(task.taskType==="killMap"&&event.type==="kill"){
      if(task.targetMapIndex===event.mapIndex){
        task.progress=(task.progress||0)+1;
      }
    }

    if(task.taskType==="forgeRealm"&&event.type==="forgeRealm"){
      const realmOk=task.targetRealm===event.targetRealm;
      const slotOk=!task.targetSlot||task.targetSlot==="任意"||task.targetSlot===event.slot;
      if(realmOk&&slotOk){
        task.progress=(task.progress||0)+1;
      }
    }

    if(task.taskType==="alchemy"&&event.type==="alchemy"){
      if(task.target===event.name){
        task.progress=(task.progress||0)+1;
      }
    }

    if(task.taskType==="wine"&&event.type==="wine"){
      if(task.target===event.name){
        task.progress=(task.progress||0)+1;
      }
    }

    if((task.progress||0)>=task.count){
      task.progress=task.count;
      task.state="可领取";
      pushLog(`<span class="gold">AI系统任务完成：</span>${task.name}`);
    }
  });
}

function safeRender(){
  const activeElement=document.activeElement;
  const activeId=activeElement&&activeElement.id;
  const activeTag=activeElement&&activeElement.tagName;
  const activeValue=activeElement&&(activeTag==="INPUT"||activeTag==="TEXTAREA"||activeTag==="SELECT")?activeElement.value:null;
  const selectionStart=activeElement&&activeElement.selectionStart;
  const selectionEnd=activeElement&&activeElement.selectionEnd;
  const scrollX=window.scrollX;
  const scrollY=window.scrollY;
  const bagList=document.getElementById("bagItemList");
  const bagLog=document.getElementById("bagUseLog");
  const bagListScroll=bagList?bagList.scrollTop:0;
  const bagLogScroll=bagLog?bagLog.scrollTop:0;

  render();

  if(activeId){
    const next=document.getElementById(activeId);
    if(next){
      if(activeValue!==null)next.value=activeValue;
      next.focus();
      if(typeof selectionStart==="number"&&typeof selectionEnd==="number"&&next.setSelectionRange){
        next.setSelectionRange(selectionStart,selectionEnd);
      }
    }
  }

  const nextBagList=document.getElementById("bagItemList");
  const nextBagLog=document.getElementById("bagUseLog");
  if(nextBagList)nextBagList.scrollTop=bagListScroll;
  if(nextBagLog)nextBagLog.scrollTop=bagLogScroll;
  window.scrollTo(scrollX,scrollY);
}
function renderStableAround(anchorId){
  const anchor=document.getElementById(anchorId);
  const oldTop=anchor?anchor.getBoundingClientRect().top:null;

  render();

  if(anchor&&oldTop!==null){
    const nextAnchor=document.getElementById(anchorId);
    if(nextAnchor){
      const newTop=nextAnchor.getBoundingClientRect().top;
      window.scrollBy(0,newTop-oldTop);
    }
  }
}

function getTutorialModal(){
  if(!STATE.tutorial){
    STATE.tutorial={newbieStep:0,pageGuideSeen:{},currentGuide:null};
  }

  if(STATE.tutorial.currentGuide){
    return getPageGuide(STATE.tutorial.currentGuide);
  }

  if(STATE.tutorial.newbieStep===0&&STATE.tab==="主页"){
    return {
      title:"新手教程 1/2",
      body:"先去【活动】页领取【新手礼包】。新手礼包会给你启动资源，别在主页发呆。",
      action:"去活动"
    };
  }

  if(STATE.tutorial.newbieStep===1&&STATE.tab==="主页"){
    return {
      title:"新手教程 2/2",
      body:"新手礼包已经领完了。现在回到主页开始挂机，先把修为和基础资源刷起来。",
      action:"开始挂机"
    };
  }

  return null;
}

function closeTutorialModal(){
  if(!STATE.tutorial){
    STATE.tutorial={newbieStep:0,pageGuideSeen:{},currentGuide:null};
  }

  if(STATE.tutorial.currentGuide){
    STATE.tutorial.currentGuide=null;
    saveState();
    render();
    return;
  }

  if(STATE.tutorial.newbieStep===0&&STATE.tab==="主页"){
    STATE.tutorial.newbieStep=1;
    saveState();
    render();
    return;
  }

  if(STATE.tutorial.newbieStep===1&&STATE.tab==="主页"){
    STATE.tutorial.newbieStep=2;
    saveState();
    render();
    return;
  }
}

function openPage(tab){
  if(!STATE.tutorial){
    STATE.tutorial={newbieStep:0,pageGuideSeen:{},currentGuide:null};
  }

  STATE.tab=tab;

  if(tab!=="主页"&&!STATE.tutorial.pageGuideSeen[tab]){
    STATE.tutorial.pageGuideSeen[tab]=true;
    STATE.tutorial.currentGuide=tab;
  }else{
    STATE.tutorial.currentGuide=null;
  }

  saveState();
  render();
}

function renderBattleScene(monster,monsterHp,monsterMax){
  const bg=getBattleBackground();
  const playerImage=getPlayerBattleImage();
  const monsterImage=monster.image;
  const death=STATE.battleDeath||{};
  const deathAlive=death.nonce&&Date.now()-(death.nonce||0)<1000;
  const visual=STATE.battleVisual||{};
  const nonce=visual.nonce||0;
  const visualAlive=nonce&&Date.now()-(visual.nonce||0)<800;

  const fxKey=visualAlive?(visual.fx||"slash"):"";
  const fxImage=fxKey?(CONFIG.battleAssets.fx[fxKey]||CONFIG.battleAssets.fx.slash):"";
  const text=visualAlive?(visual.text||""):"";

  const playerHpPct=Math.max(0,Math.min(100,STATE.player.life/STATE.player.lifeMax*100));
  const monsterHpPct=Math.max(0,Math.min(100,monsterHp/monsterMax*100));

  return `
    <div class="battle-scene">
      <img class="battle-bg" src="${bg}" onerror="this.style.display='none'">
      <div class="battle-vignette"></div>

      <div class="battle-nameplate">
        <span class="battle-name">${STATE.player.name||"无名道友"}</span>
        <span class="battle-name">${monster.name}</span>
      </div>

      <img class="battle-unit battle-player" src="${playerImage}" onerror="this.style.display='none'">

      ${
        !deathAlive&&monsterImage
          ? `<img class="battle-unit battle-monster" src="${monsterImage}" onerror="this.style.display='none'">`
          : ""
      }

      ${
        deathAlive&&death.image
          ? `<img class="battle-monster-dead" src="${death.image}" onerror="this.style.display='none'">`
          : ""
      }

      ${
        visualAlive&&fxImage
          ? `<img class="battle-fx play" src="${fxImage}?v=${nonce}" onerror="this.style.display='none'">`
          : ""
      }

      ${
        visualAlive&&text
          ? `<div class="battle-float-text play">${text}</div>`
          : ""
      }

      <div class="battle-mini-hp battle-player-hp">
        <span style="width:${playerHpPct}%"></span>
      </div>

      <div class="battle-mini-hp battle-monster-hp">
        <span style="width:${monsterHpPct}%"></span>
      </div>
    </div>
  `;
}

        </div>
      </div>
    </div>`;
  }

  const selectedSlot=STATE.forgeSlot||"武器";
  const maxRealm=Math.min(CONFIG.realms.length-1,STATE.player.realm+1);

  if(STATE.forgeRealm===undefined||STATE.forgeRealm>maxRealm){
    STATE.forgeRealm=STATE.player.realm;
  }

  const targetRealm=Number(STATE.forgeRealm);
  const category=CONFIG.forgeCategoryConfigs.find(item=>item.id===currentCategory)||CONFIG.forgeCategoryConfigs[0];
  const cost=getForgeCost(selectedSlot,targetRealm);
  const statRanges=getForgeStatPreview(selectedSlot,targetRealm);
  const successRate=getForgeSuccessRate(targetRealm);

  const previewEquip={
    id:"preview",
    name:`预览：${CONFIG.realms[targetRealm]}${selectedSlot}`,
    slot:selectedSlot,
    realm:targetRealm,
    quality:3,
    grade:1,
    attrs:{},
    blue:null,
    identified:true,
    weaponStyle:selectedSlot==="武器"?"weapon_sword":null,
    icon:createEquipmentIcon(selectedSlot,targetRealm,3,1,null,true,selectedSlot==="武器"?"weapon_sword":null)
  };

  return `<div class="panel">
    <h2>锻造</h2>
    <p class="muted">可打造自身境界 +1 及以下装备。手镯、戒指为通用装备：手镯可装入任意手镯栏，戒指可装入任意戒指栏。</p>

    <div class="forge-layout">
      <div class="forge-sidebar">
        ${CONFIG.forgeCategoryConfigs.map(cat=>`<div class="forge-category">
          <button class="forge-category-title ${currentCategory===cat.id?"active":""}" onclick="STATE.forgeCategory='${cat.id}';saveState();safeRender()">
            <span>${cat.name}</span>
            <span>${currentCategory===cat.id?"▾":"▸"}</span>
          </button>

          ${currentCategory===cat.id&&cat.id==="装备"?`<div class="forge-slot-list">
            ${cat.slots.map(slot=>`<button class="forge-slot-btn ${selectedSlot===slot?"active":""}" onclick="STATE.forgeSlot='${slot}';saveState();safeRender()">${slot}</button>`).join("")}
          </div>`:""}
        </div>`).join("")}
      </div>

      <div>
        <div class="card">
          <h3>目标选择</h3>
          <div class="row">
            <span>装备部位：<b class="gold">${selectedSlot}</b></span>
            <span>目标境界：</span>
            <select id="forgeRealmSelect" onchange="STATE.forgeRealm=+this.value;saveState();safeRender()">
              ${getForgeRealmOptions().map(realm=>`<option value="${realm}" ${realm===targetRealm?"selected":""}>${CONFIG.realms[realm]}${realm===STATE.player.realm+1?"（高一境界）":realm===STATE.player.realm?"（当前境界）":""}</option>`).join("")}
            </select>
          </div>
        </div>

        <div class="card">
          <h3>装备预览</h3>
          <div class="forge-preview">
            <div>${equipIconHtml(previewEquip,"large")}</div>
            <div>
              <p><b class="gold">${CONFIG.realms[targetRealm]}${selectedSlot}</b></p>
              <p>预览品质：精良 · 中品</p>
              <p>实际结果：品质、品级随机，低概率出现蓝字。</p>
              <p>成功率：<span class="gold">${Math.round(successRate*100)}%</span></p>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>可能出现的属性范围</h3>
          ${statRanges.map(stat=>`<div class="forge-stat-range">${stat.name}：${fmt(stat.min)} ~ ${fmt(stat.max)}</div>`).join("")}
        </div>

        <div class="card">
          <h3>材料消耗</h3>
          <div class="forge-cost-card">
            <div class="forge-cost-line">
              ${resourceIconHtml("coin")}<span>铜币：${fmt(STATE.resources.coin)} / ${fmt(cost.coin)}</span>
            </div>
            ${cost.materials.map(item=>{
              const owned=getOwnedItemCount(item.name);
              return `<div class="forge-cost-line">${materialCostHtml(item.name,owned,item.count)}</div>`;
            }).join("")}
          </div>

          <button onclick="forge()">开始锻造 ${CONFIG.realms[targetRealm]}${selectedSlot}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderAlchemy(){
  const currentCategory=STATE.alchemyCategory||"丹药";

  if(currentCategory==="酒"){
    const selected=CONFIG.wineRecipes.find(item=>item.name===STATE.wineItem)||CONFIG.wineRecipes[0];
    const cost=recipeToCost(selected);

    return `<div class="panel">
      <h2>丹炉</h2>
      <p class="muted">丹炉可炼制丹药，也可酿制灵酒。酒后续可用于 NPC 任务，或直接使用获得半小时临时属性。</p>

      <div class="craft-layout">
        <div class="craft-sidebar">
          ${categories.map(cat=>`<button class="craft-category-title ${currentCategory===cat?"active":""}" onclick="STATE.alchemyCategory='${cat}';saveState();safeRender()">
            <span>${cat}</span><span>${currentCategory===cat?"▾":"▸"}</span>
          </button>`).join("")}

          <div class="craft-item-list">
            ${CONFIG.wineRecipes.map(item=>`<button class="craft-item-btn ${selected.name===item.name?"active":""}" onclick="STATE.wineItem='${item.name}';saveState();safeRender()">
              ${item.name}
            </button>`).join("")}
          </div>
        </div>

        <div>
          <div class="card">
            <h3>灵酒预览</h3>
            <div class="craft-preview">
              <div>${itemIconHtml(selected.name,"酒","large")}</div>

                <p><b class="${CONFIG.qualities[selected.quality].className}">${selected.name}</b></p>
                <p>品质：${CONFIG.qualities[selected.quality].name}</p>
                <p class="cyan">${selected.effect}</p>
                <p>临时加成：${selected.buff.attr} +${selected.buff.value}</p>

              </div>
            </div>
          </div>

          <div class="card">
            <h3>材料消耗</h3>
            ${genericCostHtml(cost)}
            <button onclick="craftWine()">开始酿制：${selected.name}</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  const selectedName=STATE.alchemyItem||"回春丹";
  const selected=CONFIG.pills.find(item=>item.name===selectedName)||CONFIG.pills[0];
  const preview=getPillPreview(selected.name);
  const cost=getPillMaterialCost(selected.name);
const craftCount=Math.max(1,Math.min(99,Number(STATE.alchemyCount||1)));
const totalCost=multiplyPillMaterialCost(cost,craftCount);
  const furnace=CONFIG.alchemyFurnaces.find(item=>item.name===STATE.alchemy.furnace);

  return `<div class="panel">
    <h2>丹炉</h2>
    <p class="muted">丹炉页包含丹药与酒。丹药用于恢复、永久属性、修行倍率和突破。</p>

    <div class="craft-layout">
      <div class="craft-sidebar">
        ${categories.map(cat=>`<button class="craft-category-title ${currentCategory===cat?"active":""}" onclick="STATE.alchemyCategory='${cat}';saveState();safeRender()">
          <span>${cat}</span><span>${currentCategory===cat?"▾":"▸"}</span>
        </button>`).join("")}

        <div class="craft-item-list">
          ${CONFIG.pills.filter(pill=>pill.realm<=STATE.player.realm+1).map(pill=>`<button class="craft-item-btn ${selected.name===pill.name?"active":""}" onclick="STATE.alchemyItem='${pill.name}';saveState();safeRender()">
            ${pill.name}
          </button>`).join("")}
        </div>
      </div>

      <div>
        <div class="card">
          <h3>丹药预览</h3>
          <div class="craft-preview">
            <div>${itemIconHtml(selected.name,"丹药","large")}</div>
            <div>
              <p><b class="gold">${selected.name}</b></p>
              <p>类型：${selected.type}</p>
<p>适用境界：${CONFIG.realms[selected.realm]||"炼气"}</p>
<p class="cyan">${preview.effect}</p>
<p>基础效果：${preview.attr} ${preview.value}</p>
<p class="gold">成丹品级：下品 / 中品 / 上品</p>
<p class="muted">品级概率：下品60%，中品30%，上品10%。品级越高，属性丹效果越强；突破丹成功率越高。</p>
<div class="row">
  ${itemIconHtml(createPillItemName(selected.name,0),"丹药","large")}
  ${itemIconHtml(createPillItemName(selected.name,1),"丹药","large")}
  ${itemIconHtml(createPillItemName(selected.name,2),"丹药","large")}
</div>
              <p>当前丹炉：<b class="gold">${STATE.alchemy.furnace||"未装备"}</b></p>
              ${furnace?`<p>丹炉加成：成功率 +${Math.round(furnace.successBonus*100)}%，失败返还 +${Math.round(furnace.materialReturn*100)}%</p>`:""}
            </div>
          </div>
        </div>

        <div class="card">
          <h3>材料消耗</h3>
          <div class="row">
  <span>炼丹数量：</span>
  <input type="number" min="1" max="99" value="${craftCount}" style="width:90px" onchange="STATE.alchemyCount=Math.max(1,Math.min(99,+this.value||1));saveState();safeRender()">
</div>

${pillMaterialCostHtml(totalCost)}
<button onclick="craftPillFromFurnace()">开始炼制：${selected.name} ×${craftCount}</button>
        </div>
      </div>
    </div>
  </div>`;
}

        <div class="shop-good">${itemIconHtml("优秀生命晶石","道具")}<button onclick="buyShopItem('优秀生命晶石',260,'道具')">优秀生命晶石 260 元宝</button></div>
        <div class="shop-good">${itemIconHtml("精良生命晶石","道具")}<button onclick="buyShopItem('精良生命晶石',680,'道具')">精良生命晶石 680 元宝</button></div>

    </div>

    <div class="panel">
      <h3>炼丹炉</h3>
      <div class="cards">
        ${CONFIG.alchemyFurnaces.map(furnace=>`<div class="card">
          <h3 class="${CONFIG.qualities[furnace.quality].className}">${furnace.name}</h3>
          ${itemIconHtml(furnace.name,"炼丹炉","large")}
          <p>品质：${CONFIG.qualities[furnace.quality].name}</p>
          <p>炼丹成功率 +${Math.round(furnace.successBonus*100)}%，失败返还 +${Math.round(furnace.materialReturn*100)}%</p>
          <button onclick="buyShopItem('${furnace.name}',${furnace.price},'炼丹炉')">${fmt(furnace.price)} 元宝购买</button>

function renderRecharge(){

    <h2>充值 · 仙缘激活</h2>

    <div class="cards">
      ${CONFIG.xianyuanTiers.map(amount=>`<div class="card">
        <h3>${amount} 仙缘档</h3>
        <p>${resourceIconHtml("xianyuan")}消耗 ${amount} 仙缘，${resourceIconHtml("yuanbao")}获得 ${amount*100} 元宝。</p>
        <p class="muted">计入 VIP 经验与仙缘累充。</p>
        <button onclick="activateXianyuanTier(${amount})">仙缘激活</button>
      </div>`).join("")}
    </div>
  </div>`;
}
function claimVipLevelReward(level){
  if(STATE.vip.level<level)return alert("VIP 等级不足。");
  if(STATE.vip.claimed[level])return alert("该 VIP 奖励已领取。");
  STATE.vip.claimed[level]=true;
  sendMail("mail_vip","vip_level:"+level,{
    yuanbao:500*level,
    coin:3000*level,
    items:[
      ["普通仙缘箱",Math.max(1,Math.floor(level/3))],
      ["双倍修行丹",1],
      ["普通生命晶石",level]
    ]
  });
  saveState();
  render();
}
function renderVip(){
  const next=CONFIG.vip[STATE.vip.level+1];
  return `<div class="panel">
    <h2>VIP · 仙缘等级</h2>
    <p class="cyan">VIP 经验只来自仙缘模拟激活；仙缘只能由游戏内掉落获得。</p>
    <div class="cards">
      <div class="card">
        <h3>当前 VIP${STATE.vip.level}</h3>
        <p>经验：${STATE.vip.exp}${next?` / ${next.need}`:" 已满"}</p>
        <p>仙缘累充：${STATE.vip.cumulative}</p>
        <p>特权：挂机收益轻增益、背包/储物戒容量、副本次数、日志上限、炼丹/炼器小幅加成。</p>
      </div>
            <div class="card">
        <h3>VIP 奖励</h3>
        <p>每一级 VIP 奖励需要手动领取，奖励通过邮件发放。</p>
        <button onclick="STATE.tab='充值';render()">前往仙缘激活页</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel">
  <h3>VIP 配置与等级奖励</h3>
  <div class="cards">
    ${CONFIG.vip.filter(vip=>vip.level>0).map(vip=>`<div class="card">
      <h3>VIP${vip.level}</h3>
      <p>需要经验：${vip.need}</p>
<div class="reward-list">
  <div class="reward-chip">${resourceIconHtml("yuanbao")}元宝×${fmt(500*vip.level)}</div>

  <div class="reward-chip">${itemIconHtml("双倍修行丹","丹药")}双倍修行丹×1</div>
</div>
      <p>挂机收益 +${Math.round(vip.bonus*100)}%，副本次数 +${vip.dungeon}</p>
      <p>炼丹 +${Math.round(vip.alchemy*100)}%，炼器 +${Math.round(vip.forge*100)}%</p>
      <button ${STATE.vip.claimed[vip.level]?"disabled":""} onclick="claimVipLevelReward(${vip.level})">${STATE.vip.claimed[vip.level]?"已领取":"领取 VIP 奖励邮件"}</button>
    </div>`).join("")}
  </div>
</div>
  </div>`;
}

function renderMails(){
  return `<div class="panel">
    <h2>邮件</h2>
    <button onclick="claimAllMail()">一键领取全部附件</button>
    <button onclick="STATE.mails=STATE.mails.filter(mail=>!mail.claimed);saveState();render()">删除已领取邮件</button>
    <div class="list">
      ${STATE.mails.length?STATE.mails.map(mail=>`<div class="item">
        <h3 class="${mail.read?'':'mail-unread'}">${mail.title}</h3>
        <p>${mail.body}</p>
        <p class="muted">发件人：${mail.from} | 类型：${mail.type} | ${new Date(mail.created).toLocaleString()}</p>
        <div>附件：${attachmentHtml(mail.attachment)}</div>
        <button ${mail.claimed?"disabled":""} onclick="claimMail('${mail.id}')">${mail.claimed?"已领取":"领取附件"}</button>
        <button onclick="let mail=STATE.mails.find(item=>item.id==='${mail.id}');mail.read=true;saveState();render()">标记已读</button>
      </div>`).join(""):"暂无邮件。"}

}

function renderChat(){
  if(!STATE.worldChat){
    STATE.worldChat={input:"",messages:[]};
  }

  const wsState=
    GAME_WS?.readyState===WebSocket.OPEN ? "已连接" :
    GAME_WS?.readyState===WebSocket.CONNECTING ? "连接中" :
    "未连接";

  return `<div class="panel">
    <h2>聊天</h2>
    <p class="muted">世界聊天会通过服务器广播，所有在线玩家都能看到。不会整页刷新，也不会闪烁跳顶。</p>

    <div class="cards">
      <div class="card">
        <h3>世界频道</h3>
        <p class="muted">连接状态：${wsState}</p>

        <div id="worldChatList" class="log">
          ${renderWorldChatMessages()}

        <div class="row" style="margin-top:8px">
          <input

            style="min-width:280px;flex:1"

        <p class="muted">发言格式：境界 + 名称 + 内容。前缀由服务器和前端共同显示。</p>
      </div>

      <div class="card">
        <h3>频道预留</h3>
        <p>后续可增加：宗门频道、队伍频道、私聊、系统频道。</p>

}
function renderSect(){
  return `<div class="panel">
    <h2>宗门</h2>
    <p>第一阶段占位。后续实现宗门创建、加入、贡献、宗门商店、宗门 Boss。</p>
  </div>`;
}

function renderDaily(){
  return `<div class="panel">

    <p>第一阶段占位。后续实现每日任务、周常任务、活跃度奖励。活动类日常奖励仍必须通过邮件发放。</p>

setInterval(()=>{

restoreServerSession();
