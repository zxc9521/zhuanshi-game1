<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>转世之修仙系统</title>
<style>
:root{
  --bg:#090b12;--panel:#121826;--panel2:#182033;--panel3:#101725;--line:#26324d;
  --text:#d9e6ff;--muted:#8fa3c8;--gold:#ffd36a;--red:#ff6b6b;
  --green:#7dff9e;--cyan:#77e6ff;--purple:#d997ff;--orange:#ffb86c;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#18223a,#070911 55%);color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid #405073;background:#1c2740;color:var(--text);border-radius:8px;padding:7px 10px;margin:2px}
button:hover{background:#28375a}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{background:#101827;color:var(--text);border:1px solid #405073;border-radius:7px;padding:6px}
.app{max-width:1480px;margin:auto;padding:12px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px;background:linear-gradient(90deg,#101827,#17223a);border:1px solid var(--line);border-radius:14px}
.title{font-size:24px;font-weight:800;color:var(--gold)}
.notice{font-size:13px;color:var(--cyan);line-height:1.5}
.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#24314f;border:1px solid #405073;margin:2px;color:#dce8ff}
.warn{color:var(--orange)}
.grid{display:grid;grid-template-columns:210px 1fr;gap:12px;margin-top:12px}
.nav{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;position:sticky;top:8px;height:max-content}
.nav button{display:block;width:100%;margin:5px 0;text-align:left}
.nav button.active{background:#31446f;border-color:#6b85c8;color:#fff}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.subnav button.active{background:#40588e;border-color:#7f9fea}
.main{min-height:720px}
.panel{background:rgba(18,24,38,.94);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
h2,h3{margin:0 0 10px;color:#fff}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;font-size:14px}
.log{height:310px;overflow:auto;background:#080c14;border:1px solid #25314c;border-radius:10px;padding:8px;font-size:13px;line-height:1.65}
.small-log{height:220px;overflow:auto;background:#080c14;border:1px solid #25314c;border-radius:10px;padding:8px;font-size:13px;line-height:1.65}
.log .crit{color:var(--gold)}.log .bad{color:var(--red)}.log .good{color:var(--green)}.log .blue{color:var(--cyan)}
.list{max-height:430px;overflow:auto}
.item{padding:8px;border:1px solid #2b3858;border-radius:10px;background:#11192a;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{float:right}
.muted{color:var(--muted)}
.gold{color:var(--gold)}.red{color:var(--red)}.green{color:var(--green)}.cyan{color:var(--cyan)}.purple{color:var(--purple)}
.q0{color:#9aa6b2}.q1{color:#e8e8e8}.q2{color:#74ff92}.q3{color:#6bb9ff}.q4{color:#c47cff}.q5{color:#ffbc52}.q6{color:#ff6df2}
.bar{height:12px;background:#0a0f1b;border:1px solid #293653;border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,#51d27a,#ffd36a)}
.hpbar>span{background:linear-gradient(90deg,#ff5353,#ffb86c)}
.map-hero{
  position:relative;
  overflow:hidden;
  border-radius:14px;
  border:1px solid var(--line);
  margin-bottom:12px;
  min-height:360px;
  background:#0b101b;
}
.map-bg-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.55;
  filter:saturate(.95) contrast(1.08);
  transform:scale(1.02);
  z-index:0;
}
.map-hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at center,rgba(9,11,18,.08),rgba(9,11,18,.08) 70%),
    linear-gradient(180deg,rgba(9,11,18,.22),rgba(9,11,18,.68));
}
.map-hero-content{
  position:relative;
  z-index:1;
  padding:12px;
}
.map-hero .card{
  background:rgba(18,32,51,.68);
  border:1px solid rgba(119,230,255,.22);
  backdrop-filter:blur(6px);
  box-shadow:0 8px 24px rgba(0,0,0,.22);
}

.map-hero .card:hover{
  background:rgba(24,40,65,.78);
  border-color:rgba(119,230,255,.36);
}
.map-title-line{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.map-name{
  font-size:22px;
  font-weight:800;
  color:var(--gold);
  text-shadow:0 2px 8px rgba(0,0,0,.55);
}
.map-subtitle{
  color:var(--cyan);
  font-size:13px;
}
.monster-art{
  width:100%;
  max-height:260px;
  object-fit:contain;
  display:block;
  margin:6px auto 10px;
  background:radial-gradient(circle at center,rgba(119,230,255,.08),rgba(0,0,0,0));
  border-radius:12px;
}
.monster-art-missing{
  height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px dashed #405073;
  border-radius:12px;
  color:var(--muted);
  background:#0b101b;
  margin:6px 0 10px;
}
.battle-scene{
  position:relative;
  height:220px;
  margin-top:10px;
  border:1px solid rgba(119,230,255,.22);
  border-radius:12px;
  overflow:hidden;
  background:#080c14;
  box-shadow:inset 0 0 28px rgba(0,0,0,.45);
}

.battle-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.82;
  filter:saturate(.92) contrast(1.05);
}

.battle-vignette{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at center,rgba(0,0,0,0),rgba(0,0,0,.55) 80%),
    linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.45));
  pointer-events:none;
}

.battle-unit{
  position:absolute;
  bottom:16px;
  width:34%;
  height:72%;
  object-fit:contain;
  filter:drop-shadow(0 10px 12px rgba(0,0,0,.55));
  z-index:2;
}

.battle-player{
  left:4%;
}

.battle-monster{
  right:4%;
  transform:scaleX(-1);
}

.battle-fx{
  position:absolute;
  width:34%;
  height:70%;
  object-fit:contain;
  left:50%;
  top:46%;
  transform:translate(-50%,-50%);
  z-index:4;
  opacity:0;
  pointer-events:none;
}

.battle-fx.play{
  animation:battleFxFlash .55s ease-out;
}

@keyframes battleFxFlash{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.75) rotate(-6deg)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.25) rotate(4deg)}
}

.battle-nameplate{
  position:absolute;
  z-index:5;
  top:8px;
  left:8px;
  right:8px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
}

.battle-name{
  padding:4px 7px;
  border:1px solid rgba(64,80,115,.75);
  border-radius:999px;
  background:rgba(8,12,20,.68);
  color:var(--text);
}

.battle-mini-hp{
  position:absolute;
  z-index:5;
  height:7px;
  border:1px solid rgba(0,0,0,.5);
  border-radius:99px;
  background:rgba(0,0,0,.45);
  overflow:hidden;
}

.battle-mini-hp span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#ff5353,#ffb86c);
}

.battle-player-hp{
  left:8px;
  bottom:8px;
  width:34%;
}

.battle-monster-hp{
  right:8px;
  bottom:8px;
  width:34%;
}

.battle-float-text{
  position:absolute;
  z-index:6;
  left:50%;
  top:34%;
  transform:translateX(-50%);
  color:var(--gold);
  font-weight:800;
  text-shadow:0 2px 8px rgba(0,0,0,.8);
  opacity:0;
  pointer-events:none;
}

.battle-float-text.play{
  animation:battleTextFloat .7s ease-out;
}

@keyframes battleTextFloat{
  0%{opacity:0;transform:translate(-50%,10px) scale(.9)}
  25%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-24px) scale(1.08)}
}
.equip-icon{
  position:relative;
  width:72px;
  height:72px;
  flex:0 0 auto;
  display:inline-block;
  border-radius:10px;
  background:rgba(5,8,14,.62);
  box-shadow:inset 0 0 18px rgba(0,0,0,.35),0 4px 12px rgba(0,0,0,.25);
  overflow:hidden;
  vertical-align:middle;
}

.equip-icon.large{
  width:96px;
  height:96px;
}

.equip-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.equip-layer.material{
  opacity:.48;
  mix-blend-mode:screen;
}

.equip-layer.frame{
  z-index:3;
}

.equip-layer.grade{
  z-index:4;
}

.equip-layer.fx{
  z-index:5;
}

.equip-layer.unidentified{
  z-index:6;
}

.equip-line{
  display:flex;
  gap:10px;
  align-items:center;
}

.equip-info{
  min-width:0;
}
.equip-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
  gap:10px;
  align-items:start;
}

.equip-grid-cell{
  position:relative;
  min-height:88px;
  border:1px solid rgba(64,80,115,.7);
  border-radius:12px;
  background:rgba(10,15,26,.72);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px;
  transition:.15s;
}

.equip-grid-cell:hover{
  border-color:rgba(119,230,255,.55);
  background:rgba(18,32,51,.78);
  transform:translateY(-1px);
}

.equip-grid-cell .equip-icon{
  width:64px;
  height:64px;
}

.equip-tooltip{
  display:none;
  position:absolute;
  left:50%;
top:76px;
transform:translateX(-50%);
  z-index:50;
  width:300px;
  max-width:80vw;
  padding:10px;
  border:1px solid rgba(119,230,255,.38);
  border-radius:12px;
  background:rgba(8,12,20,.96);
  box-shadow:0 12px 30px rgba(0,0,0,.45);
  pointer-events:none;
}

.equip-grid-cell:hover .equip-tooltip{
  display:block;
}

.equip-tooltip-title{
  font-weight:800;
  margin-bottom:6px;
}

.equip-tooltip-line{
  font-size:13px;
  line-height:1.6;
}

.equip-mobile-mask{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.58);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
}

.equip-mobile-dialog{
  width:min(420px,96vw);
  max-height:80vh;
  overflow:auto;
  border:1px solid rgba(119,230,255,.38);
  border-radius:14px;
  background:rgba(12,18,30,.98);
  box-shadow:0 16px 42px rgba(0,0,0,.55);
  padding:12px;
}

.equip-mobile-actions{
  display:flex;
  justify-content:flex-end;
  margin-top:10px;
}
.item-icon{
  position:relative;
  width:42px;
  height:42px;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  background:rgba(5,8,14,.62);
  box-shadow:inset 0 0 12px rgba(0,0,0,.35);
  overflow:hidden;
  vertical-align:middle;
}

.item-icon.large{
  width:64px;
  height:64px;
}

.item-icon img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.item-icon-stack{
  position:relative;
  width:42px;
  height:42px;
  flex:0 0 auto;
}

.item-icon-stack.large{
  width:64px;
  height:64px;
}

.item-icon-stack img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
}

.item-quality-overlay{
  pointer-events:none;
  opacity:.85;
}

.item-line{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.item-line-text{
  min-width:0;
  overflow:hidden;
}

.reward-list{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin:6px 0;
}

.reward-chip{
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 7px;
  border:1px solid rgba(64,80,115,.7);
  border-radius:10px;
  background:rgba(10,15,26,.55);
}

.resource-icon{
  width:20px;
  height:20px;
  object-fit:contain;
  vertical-align:middle;
  margin-right:4px;
}

.shop-good{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.forge-cost-line{
  display:flex;
  align-items:center;
  gap:8px;
  margin:6px 0;
}
.tabs-note{font-size:13px;color:var(--muted)}
.mail-unread{color:var(--gold);font-weight:bold}
@media(max-width:820px){.grid{grid-template-columns:1fr}.nav{position:static}.nav button{display:inline-block;width:auto}.kv{grid-template-columns:92px 1fr}}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
/*
《转世之修仙系统》单文件完整原型
定位：
1. 公益网页挂机文字修仙游戏。
2. 无真实充值入口。
3. 仙缘仅由游戏内挂机、Boss、副本、活动、邮件等玩法获得。
4. 首充、月卡、VIP、累充、成长基金均为仙缘模拟激活。
5. 所有活动、兑换码、首充、累充、成长基金、VIP、月卡奖励全部通过邮件发放。
6. 第一阶段使用 localStorage，本文件结构便于后续迁移到 Node.js + WebSocket + 服务端权威结算。
*/
const $=s=>document.querySelector(s);
const now=()=>Date.now();
const fmt=n=>Math.floor(n||0).toLocaleString();
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const uid=p=>p+"_"+Math.random().toString(36).slice(2,10)+"_"+Date.now().toString(36);

const CONFIG={};

CONFIG.qualities=[
  {name:"破碎",className:"q0",multiplier:.55},
  {name:"普通",className:"q1",multiplier:1},
  {name:"优秀",className:"q2",multiplier:1.45},
  {name:"精良",className:"q3",multiplier:2.05},
  {name:"卓越",className:"q4",multiplier:3.2},
  {name:"传说",className:"q5",multiplier:5.2},
  {name:"神话",className:"q6",multiplier:8.8}
];

CONFIG.grades=[
  {name:"下品",multiplier:1},
  {name:"中品",multiplier:1.18},
  {name:"上品",multiplier:1.42}
];

CONFIG.realms=["炼气","筑基","金丹","元婴","化神","炼虚","合体","大乘","渡劫"];
CONFIG.subRealms=["一层","二层","三层","四层","五层","六层","七层","八层","九层","十层","小圆满","大圆满"];

CONFIG.realmConfigs=CONFIG.realms.map((realm,index)=>({
  id:index,
  name:realm,
  lifeBonus:90+index*80,
  attrPointBonus:5+index*8,
  needBase:Math.floor(80*Math.pow(3.05,index)),
  breakthroughPill:index===0?null:realm+"破境丹"
}));

CONFIG.maps=[
  ["雾骨荒原","残碑坡","冷萤谷","碎月滩","雾骨魇主"],
  ["青烬山脉","松火岭","赤苔洞","眠蛇涧","青烬岩君"],
  ["澜星湖泽","银藻洲","镜水湾","沉星潭","澜星水魈"],
  ["黑曜古城","断钟街","玄瓦巷","无灯台","黑曜城灵"],
  ["霜纹天阶","雪纹径","寒钟坪","白魄台","霜纹天将"],
  ["晦明海眼","潮骨礁","暗珠沟","归墟口","晦明潮皇"],
  ["赤霄裂谷","焦玉坡","焚碑窟","鸣雷峡","赤霄裂尊"],
  ["玄垣星野","落星丘","尘光林","古轨原","玄垣星兽"],
  ["无相劫门","静劫廊","虚命桥","问终台","无相劫主"]
].map((row,index)=>({
  id:index,
  name:row[0],
  zones:row.slice(1,4),
  boss:row[4],
  image:[
    "assets/images/maps/wugu_huangyuan.webp",
    "assets/images/maps/qingjin_shanmai.webp",
    "assets/images/maps/lanxing_huze.webp",
    "assets/images/maps/heiyao_gucheng.webp",
    "assets/images/maps/shuangwen_tianjie.webp",
    "assets/images/maps/huiming_haiyan.webp",
    "assets/images/maps/chixiao_liegu.webp",
    "assets/images/maps/xuanyuan_xingye.webp",
    "assets/images/maps/wuxiang_jiemen.webp"
  ][index]
}));
CONFIG.battleBackgrounds=[
  "assets/images/battle/backgrounds/battle_wugu_huangyuan.webp",
  "assets/images/battle/backgrounds/battle_qingjin_shanmai.webp",
  "assets/images/battle/backgrounds/battle_lanxing_huze.webp",
  "assets/images/battle/backgrounds/battle_heiyao_gucheng.webp",
  "assets/images/battle/backgrounds/battle_shuangwen_tianjie.webp",
  "assets/images/battle/backgrounds/battle_huiming_haiyan.webp",
  "assets/images/battle/backgrounds/battle_chixiao_liegu.webp",
  "assets/images/battle/backgrounds/battle_xuanyuan_xingye.webp",
  "assets/images/battle/backgrounds/battle_wuxiang_jiemen.webp"
];

CONFIG.battleAssets={
  playerMale:"assets/images/battle/player/player_male_sword.webp",
  playerFemale:"assets/images/battle/player/player_female_sword.webp",
  fx:{
    slash:"assets/images/battle/fx/slash.webp",
    magicHit:"assets/images/battle/fx/magic_hit.webp",
    fireBurst:"assets/images/battle/fx/fire_burst.webp",
    poisonCloud:"assets/images/battle/fx/poison_cloud.webp",
    iceShard:"assets/images/battle/fx/ice_shard.webp",
    thunderHit:"assets/images/battle/fx/thunder_hit.webp",
    healGlow:"assets/images/battle/fx/heal_glow.webp",
    shield:"assets/images/battle/fx/shield.webp",
    criticalFlash:"assets/images/battle/fx/critical_flash.webp"
  }
};

CONFIG.monsterNames=[
  "腐灯游魂","裂甲石奴","青鬃食露兽","玄斑毒蛾","抱月纸妖","断角魇鹿",
  "灰鳞穴蛇","铜喙山魈","赤羽焰鸦","白骨铃童","沉砂鬼蚌","雾面狐灵"
];
CONFIG.monsterImages={
  "腐灯游魂":"assets/images/monsters/normal/fudeng_youhun.webp",
  "裂甲石奴":"assets/images/monsters/normal/liejia_shinu.webp",
  "青鬃食露兽":"assets/images/monsters/normal/qingzong_shilushou.webp",
  "玄斑毒蛾":"assets/images/monsters/normal/xuanban_due.webp",
  "抱月纸妖":"assets/images/monsters/normal/baoyue_zhiyao.webp",
  "断角魇鹿":"assets/images/monsters/normal/duanjiao_yanlu.webp",
  "灰鳞穴蛇":"assets/images/monsters/normal/huilin_xueshe.webp",
  "铜喙山魈":"assets/images/monsters/normal/tonghui_shanxiao.webp",
  "赤羽焰鸦":"assets/images/monsters/normal/chiyu_yanya.webp",
  "白骨铃童":"assets/images/monsters/normal/baigu_lingtong.webp",
  "沉砂鬼蚌":"assets/images/monsters/normal/chensha_guibang.webp",
  "雾面狐灵":"assets/images/monsters/normal/wumian_huling.webp"

let STATE=loadState();

function loadState(){
  const base=createDefaultState();
  try{
    const saved=JSON.parse(localStorage.getItem("zs_xxxt_save"));
    if(!saved)return base;

    if(!saved.resources&&saved.res)saved.resources=saved.res;

    if(!saved.player&&saved.p){
      saved.player={
        name:saved.p.name||base.player.name,
        realm:saved.p.realm||0,
        subRealm:saved.p.sub??0,
        cultivation:saved.p.cult||0,
        life:saved.p.life||100,
        lifeMax:saved.p.lifeMax||100,
        lifespan:saved.p.age||90,
        lifespanMax:saved.p.ageMax||90,
        attrs:saved.p.attrs||base.player.attrs,
        points:saved.p.points||0,
        root:saved.p.root||null,
        dying:!!saved.p.dying
      };
    }

    if(!saved.progress&&saved.prog){
      saved.progress={
        map:saved.prog.map||0,
        zone:saved.prog.zone||0,
        kills:saved.prog.kills||[0,0,0],
        clearedZones:saved.prog.cleared||{},
        bossKilled:[],
        recentXianyuan:saved.prog.recent||[],
        dailyXianyuan:saved.prog.dailyXY||0,
        lastDay:saved.prog.lastDay||new Date().toDateString()
      };
    }

    if(!saved.equipped&&saved.eq)saved.equipped=saved.eq;
    if(!saved.bag)saved.bag=[];
    if(!saved.store)saved.store=[];
    if(!saved.mails)saved.mails=[];
    if(!saved.logs)saved.logs=base.logs;
    if(!saved.useLogs)saved.useLogs=[];
    if(!saved.buffs)saved.buffs=base.buffs;
    if(!saved.battleVisual)saved.battleVisual=base.battleVisual;
    if(!saved.alchemy)saved.alchemy=base.alchemy;
    if(!saved.activity)saved.activity=base.activity;
    if(!saved.vip)saved.vip=base.vip;
    if(!saved.month)saved.month=base.month;
    if(!saved.system)saved.system=base.system;
    if(!saved.dungeon)saved.dungeon=base.dungeon;
    if(!saved.flow)saved.flow=[];
    if(saved.skills&&saved.skills.equipped&&saved.skills.equipped.length===1&&saved.skills.equipped[0]==="sk1"&&!saved.skills.manualSkillFixed){
      saved.skills.equipped=[];
      saved.skills.manualSkillFixed=true;
    }

    return mergeState(base,saved);
  }catch(error){
    console.error("读取存档失败，已使用新存档：",error);
    return base;
  }
}

function mergeState(base,saved){
  if(Array.isArray(base))return Array.isArray(saved)?saved:base;
  if(base&&typeof base==="object"){
    const output={...base};
    Object.keys(saved||{}).forEach(key=>{
      output[key]=mergeState(base[key],saved[key]);
    });
    return output;
  }
  return saved===undefined?base:saved;
}

function saveState(){
  localStorage.setItem("zs_xxxt_save",JSON.stringify(STATE));
}

function pushLog(text){
  STATE.logs.unshift(text);
  STATE.logs=STATE.logs.slice(0,180);
  saveState();
}

function pushUseLog(text){
  STATE.useLogs.unshift(new Date().toLocaleTimeString()+" ｜ "+text);
  STATE.useLogs=STATE.useLogs.slice(0,80);
  saveState();
}

function pushFlow(type,data){
  STATE.flow.unshift({id:uid("flow"),time:now(),type,data});
  STATE.flow=STATE.flow.slice(0,400);
}

function currentRealmTitle(){
  return `${CONFIG.realms[STATE.player.realm]}${CONFIG.subRealms[STATE.player.subRealm]}`;
}

function cultivationNeed(realm=STATE.player.realm,subRealm=STATE.player.subRealm){
  return Math.floor(CONFIG.realmConfigs[realm].needBase*Math.pow(1.32,subRealm));
}

function getCultivationMultiplier(){
  const time=now();
  let multiplier=1;
  if(STATE.buffs.cultMultiplier2Until>time) multiplier=Math.max(multiplier,2);
  if(STATE.buffs.cultMultiplier3Until>time) multiplier=Math.max(multiplier,3);
  if(STATE.system.path==="苦修") multiplier*=1.35;
  multiplier*=1+(STATE.system.cultShopBonus||0);
  return multiplier;
}

function totalAttrs(){
  const attrs={
    生命:STATE.player.lifeMax,
    力量:STATE.player.attrs.力量,
    精神:STATE.player.attrs.精神,
    灵力:STATE.player.attrs.灵力,
    耐力:STATE.player.attrs.耐力,
    抗性:STATE.player.attrs.抗性,
    速度:STATE.player.attrs.速度
  };
  Object.values(STATE.equipped).filter(Boolean).forEach(equip=>{
    for(const key in equip.attrs) attrs[key]=(attrs[key]||0)+equip.attrs[key];
  });
  const vipConfig=CONFIG.vip[STATE.vip.level]||CONFIG.vip[0];
  const monthBonus = STATE.month.active ? .02 : 0;
  for(const key in attrs) attrs[key]=Math.floor(attrs[key]*(1+(vipConfig.bonus||0)+monthBonus));
  return attrs;
}

function weightedPick(values,weights){
  let total=weights.reduce((sum,value)=>sum+value,0);
  let roll=Math.random()*total;
  for(let index=0;index<values.length;index++){
    roll-=weights[index];
    if(roll<=0)return values[index];
  }
  return values[0];
}

function getMaterialConfigByName(name){
  return CONFIG.materials.find(material=>material.name===name);
}

function getItemIconPath(name,type=null){
  if(CONFIG.itemIconMap[name])return CONFIG.itemIconMap[name];

  const material=getMaterialConfigByName(name);
  if(material)return CONFIG.materialTypeIcons[material.type]||CONFIG.iconPaths.materials+"material_treasure.webp";

  if(name.includes("破境丹"))return CONFIG.iconPaths.pills+"breakthrough_dan.webp";
  if(name.includes("丹"))return CONFIG.iconPaths.pills+"attribute_dan.webp";
  if(name.includes("灵石"))return CONFIG.iconPaths.packages+"random_spirit_stone_pack.webp";
  if(name.includes("残页"))return CONFIG.iconPaths.skillItems+"skill_page.webp";
  if(name.includes("礼包"))return CONFIG.iconPaths.packages+"normal_gift_pack.webp";
  if(name.includes("材料包"))return CONFIG.iconPaths.packages+"random_material_pack.webp";
  if(name.includes("装备箱"))return CONFIG.iconPaths.packages+"low_equip_box.webp";

  if(type==="材料")return CONFIG.iconPaths.materials+"material_treasure.webp";
  if(type==="功法残页")return CONFIG.iconPaths.skillItems+"skill_page.webp";
  if(type==="礼包")return CONFIG.iconPaths.packages+"normal_gift_pack.webp";

  return CONFIG.iconPaths.itemsFallback||CONFIG.iconPaths.tools+"identify_talisman.webp";
}

function itemIconHtml(name,type=null,size=""){
  const material=getMaterialConfigByName(name);
  const icon=getItemIconPath(name,type);
  const qualityIcon=material?CONFIG.materialQualityIcons[material.quality]:null;

  if(qualityIcon){
    return `<span class="item-icon-stack ${size}">
      <img src="${icon}" onerror="this.style.display='none'">
      <img class="item-quality-overlay" src="${qualityIcon}" onerror="this.style.display='none'">
    </span>`;
  }

  return `<span class="item-icon ${size}">
    <img src="${icon}" alt="${name}" onerror="this.style.display='none'">
  </span>`;
}

function resourceIconHtml(resourceKey){
  const icon=CONFIG.currencyIcons[resourceKey];
  return icon?`<img class="resource-icon" src="${icon}" onerror="this.style.display='none'">`:"";
}
function guessItemType(name){
  if(name.includes("仙缘箱"))return "仙缘箱";
  if(name.includes("丹"))return "丹药";
  if(name.includes("灵石"))return "灵石";
  if(name.includes("生命晶石"))return "道具";
  if(name.includes("炉"))return "炼丹炉";
  if(name.includes("材料")||CONFIG.materials.some(material=>material.name===name))return "材料";
  if(name.includes("装备箱"))return "礼包";
  if(name.includes("功法残卷"))return "功法残卷";
if(name.includes("神技残卷"))return "神技残卷";
if(name.includes("心法玉简"))return "心法玉简";
if(name.includes("残页"))return "功法残页";
  return "道具";
}

function addItem(name,count=1,type=guessItemType(name),extra={}){
  const stack=STATE.bag.find(item=>item.name===name&&item.type===type&&!item.unique);
  if(stack) stack.count+=count;
  else STATE.bag.push({id:uid("item"),name,count,type,...extra});
}

function cleanBag(){
  STATE.bag=STATE.bag.filter(item=>item.count>0);
}

function gainXianyuan(amount,source){
  const today=new Date().toDateString();
  if(STATE.progress.lastDay!==today){
    STATE.progress.dailyXianyuan=0;
    STATE.progress.lastDay=today;
  }
  STATE.resources.xianyuan+=amount;
  STATE.progress.dailyXianyuan+=amount;
  STATE.progress.recentXianyuan.unshift(`+${amount} 仙缘：${source}`);
  STATE.progress.recentXianyuan=STATE.progress.recentXianyuan.slice(0,8);
  pushFlow("xianyuan_gain",{amount,source});
  if(amount>=648){
    pushLog(`<span class="crit">系统公告：${STATE.player.name} 获得 ${amount} 仙缘！仙缘仅由游戏内玩法掉落。</span>`);
  }
}

function gainReward(attachment,source="未知"){
  if(!attachment)return true;
  if(attachment.coin) STATE.resources.coin+=attachment.coin;
  if(attachment.yuanbao) STATE.resources.yuanbao+=attachment.yuanbao;
  if(attachment.xianyuan) gainXianyuan(attachment.xianyuan,source);
  if(attachment.cult) STATE.player.cultivation+=attachment.cult;
  if(attachment.systemPoint) STATE.resources.systemPoint+=attachment.systemPoint;
  if(attachment.items) attachment.items.forEach(([name,count])=>addItem(name,count,guessItemType(name)));
  pushFlow("reward_claim",{source,attachment});
  saveState();
  return true;
}

function sendMail(templateId,source="system",extraAttachment=null){
  const template=CONFIG.mailTemplates[templateId];
  if(!template)return;
  const attachment=extraAttachment||JSON.parse(JSON.stringify(template.attachment||{}));
  STATE.mails.unshift({
    id:uid("mail"),
    title:template.title,
    body:template.body,
    from:"天道系统",
    created:now(),
    expire:now()+1000*86400*30,
    read:false,
    claimed:false,
    type:source,
    source,
    attachment
  });
  pushFlow("mail_send",{templateId,source,attachment});
  pushLog(`<span class="gold">系统邮件：</span>${template.title}`);
  saveState();
}

function claimMail(mailId){
  const mail=STATE.mails.find(item=>item.id===mailId);
  if(!mail||mail.claimed)return;
  mail.read=true;
  gainReward(mail.attachment,"邮件:"+mail.title);
  mail.claimed=true;
  pushFlow("mail_claim",{mailId,title:mail.title});
  pushLog(`<span class="good">领取邮件附件：</span>${mail.title}`);
  saveState();
  render();
}

function claimAllMail(){
  STATE.mails.filter(mail=>!mail.claimed&&mail.expire>now()).forEach(mail=>{
    mail.read=true;
    gainReward(mail.attachment,"邮件:"+mail.title);
    mail.claimed=true;
    pushFlow("mail_claim",{mailId:mail.id,title:mail.title});
  });
  pushLog(`<span class="good">已一键领取全部可领取邮件附件。</span>`);
  saveState();
  render();
}

function createEquipmentIcon(slot,realm,quality,grade,blue,identified,weaponStyle=null){
  const baseName=slot==="武器"
    ? (weaponStyle||pick(CONFIG.weaponIconStyles))
    : CONFIG.equipmentIconBase[slot];

  return {
    base:CONFIG.equipmentIconPaths.base+baseName+".webp",
    material:CONFIG.equipmentIconPaths.material+"realm_"+realm+"_"+[
      "lianqi","zhuji","jindan","yuanying","huashen","lianxu","heti","dacheng","dujie"
    ][realm]+".webp",
    frame:CONFIG.equipmentIconPaths.frame+"quality_"+quality+"_"+[
      "broken","normal","fine","rare","epic","legend","myth"
    ][quality]+".webp",
    grade:CONFIG.equipmentIconPaths.grade+"grade_"+grade+"_"+[
      "low","mid","high"
    ][grade]+".webp",
    blue:blue?CONFIG.equipmentIconPaths.fx+"blue_effect.webp":null,
    unidentified:identified?null:CONFIG.equipmentIconPaths.fx+"unidentified.webp",
    equipped:null
  };
}
function createEquip(realm=STATE.player.realm,slot=pick(CONFIG.equipSlots),identified=true,options={}){
  const qualityIndex=options.qualityIndex!==undefined
  ? options.qualityIndex
  : weightedPick(options.qualityPool||[0,1,2,3,4,5,6],options.qualityWeights||[360,300,180,90,40,12,3]);
  const gradeIndex=weightedPick([0,1,2],[60,30,10]);
  const quality=CONFIG.qualities[qualityIndex];
  const grade=CONFIG.grades[gradeIndex];
  const base=10+realm*15;
  const isAttack=["武器","项链","手镯1","手镯2"].includes(slot);
  const isDefense=["头盔","上身","下装","护臂"].includes(slot);
  const isSpeed=slot==="鞋";
  const attrs={};
  const multiplier=quality.multiplier*grade.multiplier;
  if(isAttack){
    attrs.力量=Math.floor(base*multiplier*rnd(8,13)/10);
    attrs.精神=Math.floor(base*multiplier*rnd(5,10)/10);
  }else if(isDefense){
    attrs.耐力=Math.floor(base*multiplier*rnd(8,13)/10);
    attrs.抗性=Math.floor(base*multiplier*rnd(5,10)/10);
    attrs.生命=Math.floor(base*multiplier*8);
  }else if(isSpeed){
    attrs.速度=Math.max(1,Math.floor((2+realm)*multiplier));
  }else{
    attrs.灵力=Math.floor(base*multiplier*2);
    attrs.生命=Math.floor(base*multiplier*5);
  }
  const blue=options.forceBlue
  ? pick(CONFIG.blueEffects)
  : (chance(.035+qualityIndex*.008)?pick(CONFIG.blueEffects):null);
  const weaponStyle=slot==="武器"?pick(CONFIG.weaponIconStyles):null;
  const icon=createEquipmentIcon(slot,realm,qualityIndex,gradeIndex,blue,identified,weaponStyle);
  return {
    id:uid("equip"),
    name:`${pick(["碎星","寒碑","青烬","澜影","玄垣","照夜","晦明"])}${slot}`,
    slot,
    realm,
    quality:qualityIndex,
    grade:gradeIndex,
    attrs,
    blue,
    identified,
    weaponStyle,
    icon
  };
}

function pickBattleFxBySkill(skill){
  if(!skill)return "slash";
  if(skill.kind==="神技")return "thunderHit";
  if(skill.name.includes("火")||skill.name.includes("烬"))return "fireBurst";
  if(skill.name.includes("寒")||skill.name.includes("霜")||skill.name.includes("冰"))return "iceShard";
  if(skill.name.includes("毒"))return "poisonCloud";
  if(skill.kind==="功法")return "magicHit";
  return "slash";

  };

function currentMonster(isBoss=false){
  const mapIndex=STATE.progress.map;
  const zoneIndex=STATE.progress.zone;
  const base=30*Math.pow(2.05,mapIndex)*(1+zoneIndex*.22)*(isBoss?5.5:1);
  const monsterName=isBoss?CONFIG.maps[mapIndex].boss:CONFIG.monsterNames[(mapIndex*3+zoneIndex)%CONFIG.monsterNames.length];
  return {
    name:monsterName,
    image:isBoss?CONFIG.bossImages[monsterName]:CONFIG.monsterImages[monsterName],
    hp:Math.floor(base*8),
    atk:Math.floor(base*.9),
    def:Math.floor(base*.32),
    res:Math.floor(base*.24),
    speed:Math.floor(8+mapIndex*3+zoneIndex+(isBoss?8:0)),
    boss:isBoss
  };

function battle(isBoss=false){
  const attrs=totalAttrs();
  const monster=currentMonster(isBoss);
  if(!STATE.currentMonsterHp||STATE.currentMonsterHp<=0||isBoss){
    STATE.currentMonsterHp=monster.hp;
    STATE.currentMonsterMaxHp=monster.hp;
  }
  let playerHp=STATE.player.life;
  let monsterHp=STATE.currentMonsterHp;
  let round=0;
  let battleLogs=[];
  let playerShield=0;
  let monsterSeal=0;
  let monsterBurn=0;
  const blueEffects=Object.values(STATE.equipped).filter(Boolean).map(equip=>equip.blue).filter(Boolean);

  if(blueEffects.some(effect=>effect.type==="shield")){
    playerShield+=Math.floor(attrs.生命*.12);
    battleLogs.push(`<span class="blue">蓝字·覆潮灵膜：开局护盾 ${playerShield}</span>`);
  }
  if(blueEffects.some(effect=>effect.type==="speed")) attrs.速度+=8;

  while(playerHp>0&&monsterHp>0&&round<20){
    round++;
    if(monsterBurn>0){
      const burnDamage=Math.floor(attrs.精神*.18);
      monsterHp-=burnDamage;
      monsterBurn--;
      battleLogs.push(`第${round}回合：灼烧造成 ${burnDamage} 伤害。`);
    }

    const playerAttack=()=>{
      const skillId=STATE.skills.equipped.length?STATE.skills.equipped[0]:null;
const skill=skillId?CONFIG.skills.find(item=>item.id===skillId):null;
let damage;
let attackName="体术攻击";

if(skill){
  const spiritCost=skill.kind==="神技" ? (skill.spiritCost||100) : 0;
  const currentSpirit=STATE.player.currentSpirit ?? attrs.灵力;

  if(spiritCost>0&&currentSpirit<spiritCost){
    damage=Math.max(1,Math.floor(attrs.力量*.9-monster.def*.35));
    battleLogs.push(`<span class="warn">灵力不足，神技释放失败，改用体术攻击。</span>`);
  }else{
    if(spiritCost>0){
      STATE.player.currentSpirit=currentSpirit-spiritCost;
    }
    STATE.skills.proficiency[skillId]=(STATE.skills.proficiency[skillId]||0)+1;
    const proficiencyBonus=Math.min(.35,(STATE.skills.proficiency[skillId]||0)/1200);
    damage=Math.max(1,Math.floor((attrs.力量*.7+attrs.精神*.55)*((skill.multiplier||1)+proficiencyBonus)-monster.def*.45));
    attackName=skill.name;
  }
}else{
  damage=Math.max(1,Math.floor(attrs.力量*.9-monster.def*.35));
}

      if(chance(.08+attrs.速度/1200)){
        damage=Math.floor(damage*1.8);
        battleLogs.push(`<span class="crit">暴击！</span>`);
        triggerBattleVisual("criticalFlash","暴击 "+damage);
      }

      monsterHp-=damage;
      if(!STATE.battleVisual.text||!String(STATE.battleVisual.text).includes("暴击")){
  triggerBattleVisual(skill?pickBattleFxBySkill(skill):"slash",damage);
}
      battleLogs.push(attackName==="体术攻击"
  ? `第${round}回合：你以体术攻击 ${monster.name}，造成 ${damage} 伤害。`
  : `第${round}回合：你施展 ${attackName}，对 ${monster.name} 造成 ${damage} 伤害。`
);

      if(STATE.player.root&&chance(.08)){
        const root=pick(STATE.player.root);
        if(root.type==="burn"){
          monsterBurn=2;
          battleLogs.push(`<span class="blue">${root.name}灵根触发：灼烧。</span>`);
        }
        if(root.type==="heal"){
          const heal=Math.floor(attrs.生命*.04);
          playerHp=Math.min(STATE.player.lifeMax,playerHp+heal);
          battleLogs.push(`<span class="good">${root.name}灵根触发：回血 ${heal}。</span>`);
        }
        if(root.type==="shield"){
          playerShield+=Math.floor(attrs.生命*.06);
          battleLogs.push(`<span class="blue">${root.name}灵根触发：护盾。</span>`);
        }
        if(root.type==="stun"&&chance(.45)){
          monsterSeal=1;
          battleLogs.push(`<span class="crit">${root.name}灵根触发：麻痹敌人。</span>`);
        }
      }

      if(blueEffects.some(effect=>effect.type==="combo")&&chance(.08)){
        const comboDamage=Math.floor(damage*.45);
        monsterHp-=comboDamage;
        battleLogs.push(`<span class="blue">蓝字·双影回刃：追加 ${comboDamage}</span>`);
      }
      if(blueEffects.some(effect=>effect.type==="heal")&&chance(.12)){
        const heal=Math.floor(attrs.生命*.03);
        playerHp=Math.min(STATE.player.lifeMax,playerHp+heal);
        battleLogs.push(`<span class="good">蓝字回血 ${heal}</span>`);
      }
    };

    const monsterAttack=()=>{
      if(monsterSeal>0){
        monsterSeal--;
        battleLogs.push(`<span class="blue">${monster.name} 被封灵，行动失败。</span>`);
        return;
      }
      let damage=Math.max(1,Math.floor(monster.atk-attrs.耐力*.35-attrs.抗性*.18));
      if(isBoss&&round>8){
        damage=Math.floor(damage*1.35);
        battleLogs.push(`<span class="bad">Boss 狂暴！</span>`);
      }
      if(playerShield>0){
        const blocked=Math.min(playerShield,damage);
        playerShield-=blocked;
        damage-=blocked;
      }
      playerHp-=damage;
      battleLogs.push(`第${round}回合：${monster.name} 反击，造成 ${damage} 伤害。`);
      if(blueEffects.some(effect=>effect.type==="thorns")&&chance(.1)){
        const thornsDamage=Math.floor(damage*.4);
        monsterHp-=thornsDamage;
        battleLogs.push(`<span class="blue">蓝字反伤 ${thornsDamage}</span>`);
      }
    };

    if(attrs.速度>=monster.speed){
      playerAttack();
      if(monsterHp>0)monsterAttack();
    }else{
      monsterAttack();
      if(playerHp>0)playerAttack();
    }
  }

  STATE.player.life=Math.max(0,playerHp);
  STATE.currentMonsterHp=Math.max(0,monsterHp);
  const win=monsterHp<=0;

  if(win){
    STATE.currentMonsterHp=null;
    rewardBattle(isBoss);
    battleLogs.push(`<span class="good">战斗胜利。</span>`);
  }else if(playerHp<=0){
    STATE.player.lifespan-=isBoss?2:1;
    if(STATE.player.lifespan<=0){
      STATE.player.dying=true;
      battleLogs.push(`<span class="bad">寿命归零，进入濒死/轮回待定状态。</span>`);
    }else{
      battleLogs.push(`<span class="bad">战斗失败，寿命受损。</span>`);
    }
  }

  if(!STATE.hideLog) battleLogs.reverse().forEach(pushLog);
  tryBreakthrough(false);
  saveState();
}

 if(chance(isBoss ? .12 : .012)){

function tryBreakthrough(manual=true){
  let need=cultivationNeed();
  while(STATE.player.cultivation>=need&&STATE.player.subRealm<11){
    STATE.player.cultivation-=need;
    STATE.player.subRealm++;
    STATE.player.points+=3+STATE.player.realm;
    STATE.player.lifeMax+=10+STATE.player.realm*4;
    STATE.player.life=STATE.player.lifeMax;
    STATE.player.lifespanMax+=2;
    STATE.player.lifespan+=2;
    pushLog(`<span class="gold">突破成功：${currentRealmTitle()}，获得属性点。</span>`);

    if(STATE.player.realm===1&&!STATE.player.root){
      const count=weightedPick([1,2,3,4],[15,35,35,15]);
      STATE.player.root=[...CONFIG.spiritRoots].sort(()=>Math.random()-.5).slice(0,count);
      pushLog(`<span class="cyan">筑基灵根显现：${STATE.player.root.map(item=>item.name).join("、")}</span>`);
    }
    need=cultivationNeed();
  }

  if(manual&&STATE.player.subRealm>=11){
    const nextRealm=CONFIG.realms[STATE.player.realm+1];
    if(!nextRealm)return alert("已至当前版本最高境界。");
    const pillName=nextRealm+"破境丹";
    const pill=STATE.bag.find(item=>item.name===pillName&&item.count>0);
    if(!pill)return alert("大圆满突破需要："+pillName);
    pill.count--;

   let probability=.48+STATE.player.attrs.精神/1000+(STATE.player.root?.length===1 ? .08 : 0);
    const furnace=CONFIG.alchemyFurnaces.find(item=>item.name===STATE.alchemy.furnace);
    if(furnace) probability+=furnace.successBonus*.2;

    if(chance(probability)){
      STATE.player.realm++;
      STATE.player.subRealm=0;
      STATE.player.points+=10+STATE.player.realm*3;
      STATE.player.lifespanMax+=CONFIG.realmConfigs[STATE.player.realm].lifeBonus;
      STATE.player.lifespan=STATE.player.lifespanMax;
      STATE.player.lifeMax+=80+STATE.player.realm*30;
      STATE.player.life=STATE.player.lifeMax;
      pushLog(`<span class="crit">大境界突破成功：${currentRealmTitle()}！</span>`);
    }else{
      STATE.player.subRealm=Math.max(0,STATE.player.subRealm-2);
      pushLog(`<span class="bad">突破失败，跌落两个小境界。</span>`);
    }
  }
    cleanBag();
  saveState();
  if(manual){
    render();
  }
}

  if(!config){
    alert("装备箱配置不存在："+item.name);
    return;
  }

  item.count--;

function getForgeCost(slot){
  const realm=STATE.player.realm;
  const materialPool=CONFIG.materials.filter(material=>material.realm<=realm+1);
  const mainMaterial=materialPool.length?materialPool[(realm+slot.length)%materialPool.length]:CONFIG.materials[0];
  const secondMaterial=materialPool.length?materialPool[(realm*3+slot.length)%materialPool.length]:CONFIG.materials[1];
  return {
    coin:500*(realm+1),
    materials:[
      {name:mainMaterial.name,count:2+realm},
      {name:secondMaterial.name,count:1+Math.floor(realm/2)},
      {name:"锻造石",count:2+realm}
    ]
  };
}

function hasForgeCost(cost){
  if(STATE.resources.coin<cost.coin)return false;
  return cost.materials.every(costItem=>{
    const bagItem=STATE.bag.find(item=>item.name===costItem.name&&item.count>=costItem.count);
    return !!bagItem;
  });
}

function consumeForgeCost(cost){
  STATE.resources.coin-=cost.coin;
  cost.materials.forEach(costItem=>{
    const bagItem=STATE.bag.find(item=>item.name===costItem.name);
    if(bagItem)bagItem.count-=costItem.count;
  });
  cleanBag();
}

function forge(){
  const slot=document.getElementById("forgeSlot")?.value||"武器";
  const cost=getForgeCost(slot);
  if(!hasForgeCost(cost)){
    alert("锻造材料不足。请查看锻造页显示的材料需求。");
    return;
  }

  consumeForgeCost(cost);

  const vipBonus=CONFIG.vip[STATE.vip.level]?.forge||0;
  const probability=.62+(STATE.system.path==="炼器" ? .18 : 0)+vipBonus+(STATE.system.forgeShopBonus||0);

  if(chance(probability)){
    const equip=createEquip(STATE.player.realm,slot,false);
    STATE.store.push(equip);
    pushLog(`<span class="good">锻造成功：${equip.name}，已进入储物戒待鉴定。</span>`);
  }else{
    let returnRate=STATE.month.active ? .6 : 0;
    if(returnRate){
      STATE.resources.coin+=Math.floor(cost.coin*returnRate);
      cost.materials.forEach(costItem=>{
        addItem(costItem.name,Math.floor(costItem.count*returnRate),guessItemType(costItem.name));
      });
    }
    pushLog(`<span class="bad">锻造失败。${returnRate?"月卡返还 60% 资源。":""}</span>`);
  }

  saveState();
  render();
}

function alchemy(){
  const pillName=$("#pillSelect")?.value||"回春丹";
  const pillConfig=CONFIG.pills.find(item=>item.name===pillName);
  const cost=Math.floor((pillConfig?.baseCost||200)*(1+STATE.player.realm*.25));
  if(STATE.resources.coin<cost)return alert("铜币不足。");
  STATE.resources.coin-=cost;

  const furnace=CONFIG.alchemyFurnaces.find(item=>item.name===STATE.alchemy.furnace);
  const vipBonus=CONFIG.vip[STATE.vip.level]?.alchemy||0;
  let probability=pillName.includes("破境") ? .45 : .68;
  probability += STATE.system.path === "炼丹" ? .15 : 0;
  probability+=furnace?furnace.successBonus:0;
  probability+=vipBonus+(STATE.system.alchemyShopBonus||0);
  probability+=Math.min(.15,STATE.alchemy.failCompensation);

  if(chance(probability)){
    addItem(pillName,1,"丹药");
    STATE.alchemy.failCompensation=Math.max(0,STATE.alchemy.failCompensation-.04);
    pushLog(`<span class="good">炼丹成功：${pillName}</span>`);
  }else{
    STATE.alchemy.failCompensation+=.03;
    let returnRate = STATE.month.active ? .6 : 0;
    if(furnace) returnRate=Math.max(returnRate,furnace.materialReturn);
    if(returnRate) STATE.resources.coin+=Math.floor(cost*returnRate);
    pushLog(`<span class="bad">炼丹失败。${returnRate?`返还 ${Math.round(returnRate*100)}% 铜币。`:""}</span>`);
  }
  saveState();
  render();
}

function attachmentText(attachment){
  if(!attachment)return"无";
  const list=[];
  if(attachment.coin)list.push("铜币×"+fmt(attachment.coin));
  if(attachment.yuanbao)list.push("元宝×"+fmt(attachment.yuanbao));
  if(attachment.xianyuan)list.push("仙缘×"+fmt(attachment.xianyuan));
  if(attachment.cult)list.push("修为×"+fmt(attachment.cult));
  if(attachment.systemPoint)list.push("系统点×"+fmt(attachment.systemPoint));
  if(attachment.items)list.push(...attachment.items.map(item=>item[0]+"×"+item[1]));
  return list.join("，");
}

  if(attachment.yuanbao)list.push(`<div class="reward-chip">${resourceIconHtml("yuanbao")}元宝×${fmt(attachment.yuanbao)}</div>`);
  if(attachment.xianyuan)list.push(`<div class="reward-chip">${resourceIconHtml("xianyuan")}仙缘×${fmt(attachment.xianyuan)}</div>`);
  if(attachment.systemPoint)list.push(`<div class="reward-chip">${resourceIconHtml("systemPoint")}系统点×${fmt(attachment.systemPoint)}</div>`);
  if(attachment.cult)list.push(`<div class="reward-chip">修为×${fmt(attachment.cult)}</div>`);

function safeRender(){
  const activeElement=document.activeElement;
  const activeId=activeElement&&activeElement.id;
  const activeTag=activeElement&&activeElement.tagName;
  const activeValue=activeElement&&(activeTag==="INPUT"||activeTag==="TEXTAREA"||activeTag==="SELECT")?activeElement.value:null;
  const selectionStart=activeElement&&activeElement.selectionStart;
  const selectionEnd=activeElement&&activeElement.selectionEnd;
  const scrollX=window.scrollX;
  const scrollY=window.scrollY;
  const bagList=document.getElementById("bagItemList");
  const bagLog=document.getElementById("bagUseLog");
  const bagListScroll=bagList?bagList.scrollTop:0;
  const bagLogScroll=bagLog?bagLog.scrollTop:0;

  render();

  if(activeId){
    const next=document.getElementById(activeId);
    if(next){
      if(activeValue!==null)next.value=activeValue;
      next.focus();
      if(typeof selectionStart==="number"&&typeof selectionEnd==="number"&&next.setSelectionRange){
        next.setSelectionRange(selectionStart,selectionEnd);
      }
    }
  }

  const nextBagList=document.getElementById("bagItemList");
  const nextBagLog=document.getElementById("bagUseLog");
  if(nextBagList)nextBagList.scrollTop=bagListScroll;
  if(nextBagLog)nextBagLog.scrollTop=bagLogScroll;
  window.scrollTo(scrollX,scrollY);
}

function claimVipLevelReward(level){
  if(STATE.vip.level<level)return alert("VIP 等级不足。");
  if(STATE.vip.claimed[level])return alert("该 VIP 奖励已领取。");
  STATE.vip.claimed[level]=true;
  sendMail("mail_vip","vip_level:"+level,{
    yuanbao:500*level,
    coin:3000*level,
    items:[
      ["普通仙缘箱",Math.max(1,Math.floor(level/3))],
      ["双倍修行丹",1],
      ["普通生命晶石",level]
    ]
  });
  saveState();
  render();
}
